[env]
_.file = ["{{config_root}}/.secrets.env"]
FLATE_PATH = '{{config_root}}/kubernetes/flux/cluster'
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"


[tools]
lefthook = "2.1.9"
shellcheck = "0.11.0"
flux2 = "2.8.8"
gum = "0.17.0"
helm = "4.2.0"
helmfile = "1.5.3"
jq = "1.8.1"
kubectl = "1.36.1"
kustomize = "5.8.1"
sops = "3.13.1"
talhelper = "3.1.11"
talosctl = "1.13.3"
yq = "4.53.3"
terraform = "1.15.6"
"github:bitwarden/sdk" = "bws-v1.0.0"

[hooks]
postinstall = "lefthook install"
