[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
LEFTHOOK_OUTPUT = "false"


[tools]
"lefthook" = "2.1.6"
"python" = "3.14.5"
"uv" = "latest"
"pipx:flux-local" = "latest"
"aqua:budimanjojo/talhelper" = "3.1.9"
"aqua:casey/just" = "1.51.0"
"aqua:charmbracelet/gum" = "0.17.0"
"aqua:cilium/cilium-cli" = "0.19.2"
"aqua:cli/cli" = "2.92.0"
"aqua:fluxcd/flux2" = "2.8.6"
"aqua:getsops/sops" = "3.13.0"
"aqua:helm/helm" = "4.1.4"
"aqua:helmfile/helmfile" = "1.5.1"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.0"
"aqua:kubernetes/kubectl" = "1.33.2"
"aqua:mikefarah/yq" = "4.53.2"
"aqua:siderolabs/talos" = "1.13.0"
"aqua:hashicorp/terraform" = "1.15.2"
"ubi:google/yamlfmt" = "0.21.0"
"github:bitwarden/sdk" = "bws-v1.0.0"
