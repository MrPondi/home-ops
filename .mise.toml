[env]
_.python.venv = { path = "{{config_root}}/.venv", create = true }
KUBECONFIG = "{{config_root}}/kubeconfig"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
TALOSCONFIG = "{{config_root}}/talos/clusterconfig/talosconfig"
LEFTHOOK_OUTPUT = "false"


[tools]
"lefthook" = "2.0.2"
"python" = "3.14.0"
"uv" = "latest"
"pipx:flux-local" = "latest"
"aqua:budimanjojo/talhelper" = "3.0.39"
"aqua:casey/just" = "1.43.0"
"aqua:charmbracelet/gum" = "0.17.0"
"aqua:cilium/cilium-cli" = "0.18.8"
"aqua:cli/cli" = "2.83.0"
"aqua:cloudflare/cloudflared" = "2025.10.1"
"aqua:FiloSottile/age" = "1.2.1"
"aqua:fluxcd/flux2" = "2.7.3"
"aqua:getsops/sops" = "3.11.0"
"aqua:helm/helm" = "3.19.0"
"aqua:helmfile/helmfile" = "1.1.9"
"aqua:jqlang/jq" = "1.8.1"
"aqua:kubernetes-sigs/kustomize" = "5.7.0"
"aqua:kubernetes/kubectl" = "1.33.2"
"aqua:mikefarah/yq" = "4.48.1"
