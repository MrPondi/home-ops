min_version = "2026.7.0"

[env]
_.file = ["{{config_root}}/.secrets.env"]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
JUST_UNSTABLE = "1"
HOMEBREW_NO_ENV_HINTS = "1"

[hooks]
postinstall = "lefthook install"

[settings]
lockfile_platforms = ["linux-x64", "linux-arm64", "macos-arm64"]

[tools]
"github:home-operations/flate" = "v0.6.5"
"aqua:cilium/cilium-cli" = "0.20.1"
"aqua:cilium/hubble" = "1.20.2"
"aqua:astral-sh/uv" = "0.13.1"
flux2 = "2.9.6"
gh = "2.102.0"
gum = "2.0.2"
helm = "4.3.1"
helmfile = "1.8.1"
jq = "1.8.2"
kubectl = "1.37.1"
kustomize = "5.8.3"
lefthook = "2.2.2"
shellcheck = "0.11.0"
talos = "v1.14.2"
terraform = "1.16.6"
yq = "4.54.1"
