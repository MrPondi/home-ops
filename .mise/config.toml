[env]
_.file = ["{{config_root}}/.secrets.env"]
FLATE_PATH = "{{config_root}}/kubernetes/flux/cluster"
KUBECONFIG = "{{config_root}}/kubeconfig"
TALOSCONFIG = "{{config_root}}/talosconfig"
MINIJINJA_CONFIG_FILE = "{{config_root}}/.minijinja.toml"
SOPS_AGE_KEY_FILE = "{{config_root}}/age.key"
JUST_UNSTABLE = "1"
HOMEBREW_NO_ENV_HINTS = "1"

[hooks]
postinstall = "lefthook install"

[tools]
"github:home-operations/flate" = "v0.6.5"
"aqua:cilium/cilium-cli" = "0.20.0"
"aqua:cilium/hubble" = "1.19.4"
"aqua:astral-sh/uv" = "0.12.13"
flux2 = "2.9.5"
gh = "2.100.0"
gum = "2.0.1"
helm = "4.3.0"
helmfile = "1.7.4"
jq = "1.8.2"
kubectl = "1.37.0"
kustomize = "5.8.1"
lefthook = "2.1.12"
shellcheck = "0.11.0"
talos = "v1.14.0"
terraform = "1.16.2"
yq = "4.53.6"
