---
# yaml-language-server: $schema=https://raw.githubusercontent.com/budimanjojo/talhelper/master/pkg/config/schemas/talconfig.json
clusterName: main

talosVersion: "${talosVersion}"
kubernetesVersion: "${kubernetesVersion}"

endpoint: https://k8s.internal:6443

clusterPodNets:
  - "10.42.0.0/16"
clusterSvcNets:
  - "10.43.0.0/16"

# Disable built-in CNI to use Cilium
cniConfig:
  name: none

nodes:
  - hostname: "k8s-01"
    ipAddress: "10.0.30.21"
    installDisk: "/dev/sda"
    machineSpec:
      secureboot: false
    talosImageURL: factory.talos.dev/installer/3066b4896f2afce30beef890e880d5ad5081f6194d83f8e1b665226147e5faf0
    controlPlane: true
    userVolumes:
      - name: longhorn-storage
        volumeType: disk
        provisioning:
          diskSelector:
            match: disk.dev_path == '/dev/sdb'
        filesystem:
          type: xfs
    networkInterfaces:
      - deviceSelector:
          hardwareAddr: "bc:24:11:68:28:1c"
        dhcp: true
        mtu: 1500
        vip:
          ip: "10.0.30.10"
      - deviceSelector:
          hardwareAddr: "bc:24:11:80:ca:be"
        dhcp: false
        mtu: 1500
      - deviceSelector:
          hardwareAddr: "bc:24:11:f7:74:38"
        dhcp: false
        mtu: 1500

# Global patches
patches:
  - "@./patches/global/machine-features.yaml"
  - "@./patches/global/machine-files.yaml"
  - "@./patches/global/machine-kubelet.yaml"
  - "@./patches/global/machine-labels.yaml"
  - "@./patches/global/machine-network.yaml"
  - "@./patches/global/machine-sysctls.yaml"

# Controller patches
controlPlane:
  patches:
    - "@./patches/controller/cluster.yaml"
