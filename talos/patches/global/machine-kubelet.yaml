---
machine:
  kubelet:
    extraConfig:
      serializeImagePulls: false
      maxPods: 240
      imageGCHighThresholdPercent: 65
      imageGCLowThresholdPercent: 60
    nodeIP:
      validSubnets:
        - 10.0.30.0/24
    extraMounts:
      - destination: /var/mnt/longhorn
        type: bind
        source: /var/mnt/longhorn
        options:
          - bind
          - rshared
          - rw
