---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: ${APP}-postgres
spec:
  # CNPG instance pods (${APP} cluster)
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: ${APP}
  ingress:
    # Same-namespace consumers (override label via POSTGRES_APP_NAME)
    - fromEndpoints:
        # consumer app pods (same namespace)
        - matchLabels:
            app.kubernetes.io/name: ${POSTGRES_APP_NAME:=${APP}}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Cluster peers (streaming replication for future replicas)
    - fromEndpoints:
        # sibling instance pods (${APP} cluster)
        - matchLabels:
            cnpg.io/cluster: ${APP}
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # cloudnative-pg operator (database) — instance manager API + psql
    - fromEndpoints:
        # cloudnative-pg operator pods (database)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            k8s:app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
    # Prometheus metrics (PodMonitor, port 9187)
    - fromEndpoints:
        # prometheus pods (observability)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9187"
              protocol: TCP
  egress:
    - toEndpoints:
        # kube-dns pods (kube-system)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # QNAP MinIO (WAL archiving + barman backups, direct)
    - toCIDR:
        - 10.0.25.25/32
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
