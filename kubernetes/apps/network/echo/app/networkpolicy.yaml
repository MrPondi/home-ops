---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: echo
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: echo
  ingress:
    # HTTPRoute echo.pondi.dev (envoy-external)
    - fromEndpoints:
        # envoy-external gateway pods (network)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Gatus HTTP health check
    - fromEndpoints:
        # gatus-sidecar prober pods (observability)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: gatus-sidecar
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Prometheus metrics scrape
    - fromEndpoints:
        # prometheus pods (observability)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    # DNS resolution
    - toEndpoints:
        # kube-dns pods (kube-system)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API (config.kubernetes discovery)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
