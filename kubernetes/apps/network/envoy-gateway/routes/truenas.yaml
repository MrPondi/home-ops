---
apiVersion: v1
kind: Service
metadata:
  name: truenas-backend
spec:
  ports:
    - name: https
      protocol: TCP
      port: 443
      targetPort: https
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/discovery.k8s.io/endpointslice_v1.json
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: truenas-backend-slice
  labels:
    kubernetes.io/service-name: truenas-backend
addressType: IPv4
ports:
  - name: https
    port: 443
endpoints:
  - addresses:
      - 10.0.25.25
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.envoyproxy.io/backendtrafficpolicy_v1alpha1.json
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: truenas-backend-traffic
  namespace: network
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: truenas-route
  useClientProtocol: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/backendtlspolicy_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  name: truenas-tls-policy
spec:
  targetRefs:
    - kind: Service
      name: truenas-backend
      group: ""
  validation:
    hostname: localhost
    caCertificateRefs:
      - kind: ConfigMap
        name: truenas-ca-cert
        group: ""
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: truenas-route
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - truenas.pondi.dev
  rules:
    - backendRefs:
        - name: truenas-backend
          port: 443
