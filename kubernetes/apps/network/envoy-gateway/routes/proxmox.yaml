---
apiVersion: v1
kind: Service
metadata:
  name: proxmox-backend
spec:
  ports:
    - name: https
      protocol: TCP
      port: 8006
      targetPort: https
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/discovery.k8s.io/endpointslice_v1.json
apiVersion: discovery.k8s.io/v1
kind: EndpointSlice
metadata:
  name: proxmox-backend-slice
  labels:
    kubernetes.io/service-name: proxmox-backend
addressType: IPv4
ports:
  - name: https
    port: 8006
endpoints:
  - addresses:
      - 10.0.10.10
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/backendtlspolicy_v1alpha3.json
apiVersion: gateway.networking.k8s.io/v1alpha3
kind: BackendTLSPolicy
metadata:
  name: proxmox-tls-policy
spec:
  targetRefs:
    - kind: Service
      name: proxmox-backend
      group: ""
  validation:
    hostname: orion.pondi.dev
    caCertificateRefs:
      - kind: ConfigMap
        name: proxmox-ca-cert
        group: ""
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: proxmox-route
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - pve.pondi.dev
  rules:
    - backendRefs:
        - name: proxmox-backend
          port: 8006
