---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cloudnative-pg
spec:
  description: Operator ingress (kube-apiserver webhook) + egress (kube API, barman plugin, all CNPG instances)
  # cloudnative-pg operator pods (database)
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cloudnative-pg
  ingress:
    # Admission webhook from kube-apiserver (host-networked)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # Kubernetes API
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Barman cloud plugin API (gRPC, database)
    - toEndpoints:
        # plugin-barman-cloud pods (database)
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: database
            k8s:app.kubernetes.io/name: plugin-barman-cloud
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # All CNPG cluster instance pods (any namespace — Exists matcher, no per-cluster rules needed)
    - toEndpoints:
        # CNPG instance pods (cluster-wide)
        - matchExpressions:
            - key: k8s:cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
