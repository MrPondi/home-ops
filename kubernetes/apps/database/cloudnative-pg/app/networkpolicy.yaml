---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name cloudnative-pg
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # Admission webhook from kube-apiserver (host-networked)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # Barman cloud plugin API (gRPC)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Postgres instances (instance manager API + psql)
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cloudnative-pg-clusters
spec:
  description: Operator egress to all CNPG instance pods cluster-wide (no per-cluster rules needed)
  # cloudnative-pg operator pods (database)
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: cloudnative-pg
  egress:
    # All CNPG cluster instance pods (any namespace — Exists matcher, no maintenance needed)
    - toEndpoints:
        - matchExpressions:
            - key: k8s:cnpg.io/cluster
              operator: Exists
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
            - port: "8000"
              protocol: TCP
