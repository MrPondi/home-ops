---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name postgres
spec:
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: *name
  ingress:
    # Cluster-wide clients on the service port (replication, operator psql, consumer apps)
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # cloudnative-pg operator (instance manager API)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Barman cloud plugin API (gRPC)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: plugin-barman-cloud
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # Same-cluster replication
    - toEndpoints:
        - matchLabels:
            cnpg.io/cluster: *name
      toPorts:
        - ports:
            - port: "5432"
              protocol: TCP
    # Backups / WAL archiving (sidecar -> QNAP MinIO)
    - toCIDR:
        - 10.0.25.25/32
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name cnpg-barman-cloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: plugin-barman-cloud
      app.kubernetes.io/instance: cnpg-barman-cloud
  ingress:
    # cloudnative-pg operator + postgres instance sidecars (gRPC)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: cloudnative-pg
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    - fromEndpoints:
        - matchLabels:
            cnpg.io/cluster: postgres
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
