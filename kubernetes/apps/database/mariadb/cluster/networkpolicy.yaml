---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mariadb
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # Cluster-wide clients on the service port (operator, exporter, gatus, consumer apps, backup/restore jobs)
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mariadb-metrics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: exporter
      app.kubernetes.io/instance: mariadb-metrics
  egress:
    # MariaDB (exporter)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mariadb
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
