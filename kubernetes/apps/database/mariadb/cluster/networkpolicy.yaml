---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mariadb
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # Same-namespace clients (operator, metrics exporter, backup/restore jobs)
    - fromEndpoints:
        - matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values:
                - mariadb-operator
                - exporter
        - matchExpressions:
            - key: batch.kubernetes.io/job-name
              operator: Exists
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # nextcloud (default)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            k8s:app.kubernetes.io/name: nextcloud
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # pelican (default)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            k8s:app.kubernetes.io/name: pelican
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # gatus health checks (observability)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: gatus-sidecar
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # LAN clients (10.0.20.0/24, wordpress)
    - fromCIDR:
        - 10.0.20.0/24
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mariadb-metrics
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: exporter
      app.kubernetes.io/instance: mariadb-metrics
  ingress:
    # Prometheus metrics (ServiceMonitor)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9104"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # MariaDB (exporter)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mariadb
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
