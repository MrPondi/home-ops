---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: pelican
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: panel
  table: "*"
  username: pelican
  host: "%"
---
apiVersion: k8s.mariadb.com/v1alpha1
kind: Grant
metadata:
  name: pelican-user
spec:
  mariaDbRef:
    name: mariadb
  privileges:
    - "ALL PRIVILEGES"
  database: "*"
  table: "*"
  username: pelicanuser
  host: "%"
  grantOption: true
