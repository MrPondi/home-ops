---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
metadata:
  name: mariadb-cluster
resources:
  - ./externalsecret.yaml
  - ./mariadb.yaml
  - ./networkpolicy.yaml
  - ./physicalbackup.yaml

  # Pelican
  - ./databases/pelican.yaml
  - ./grants/pelican.yaml
  - ./users/pelican.yaml
  - ./users/pelican-user.yaml

  # Nextcloud
  - ./databases/nextcloud.yaml
  - ./grants/nextcloud.yaml
  - ./users/nextcloud.yaml
