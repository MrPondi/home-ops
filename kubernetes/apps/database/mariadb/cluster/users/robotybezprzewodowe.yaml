---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: robotybezprzewodowe
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: robotybezprzewodowe-secret
    template:
      data:
        password: "{{ .ROBOTYBEZPRZEWODOWE_MARIADB_PASSWORD }}"
  dataFrom:
    - extract:
        key: wordpress

---
# yaml-language-server: $schema=https://schemas.hydaz.com/k8s.mariadb.com/user_v1alpha1.json
apiVersion: k8s.mariadb.com/v1alpha1
kind: User
metadata:
  name: robotybezprzewodowe
spec:
  mariaDbRef:
    name: mariadb
  passwordSecretKeyRef:
    name: robotybezprzewodowe-secret
    key: password
  host: "%"
  maxUserConnections: 20
