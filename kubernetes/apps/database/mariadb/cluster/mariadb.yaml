---
# yaml-language-server: $schema=https://schemas.hydaz.com/k8s.mariadb.com/mariadb_v1alpha1.json
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
spec:
  storage:
    size: 8Gi
    storageClassName: openebs-hostpath
  resources:
    requests:
      cpu: 10m
      memory: 512Mi
    limits:
      memory: 2Gi
  service:
    metadata:
      annotations:
        gatus.home-operations.com/endpoint: |-
          group: services
          interval: 15s
          conditions:
            - "[CONNECTED] == true"
  rootPasswordSecretKeyRef:
    name: mariadb-secret
    key: root-password
  myCnf: |-
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=1600MB
    max_allowed_packet=1GB
    log_warnings=0
  bootstrapFrom:
    s3:
      accessKeyIdSecretKeyRef:
        name: mariadb-secret
        key: MINIO_ACCESS_ACCESS_KEY
      bucket: backups
      endpoint: minio.storage.svc.cluster.local:9000
      prefix: mariadb
      secretAccessKeySecretKeyRef:
        name: mariadb-secret
        key: MINIO_SECRET_SECRET_KEY
      tls:
        enabled: false
    backupContentType: Physical
    # stagingStorage:
    #   persistentVolumeClaim:
    #     resources:
    #       requests:
    #         storage: 4Gi
    #     accessModes:
    #       - ReadWriteMany
    #     storageClassName: ceph-filesystem
  metrics:
    enabled: true
  updateStrategy:
    autoUpdateDataPlane: true
