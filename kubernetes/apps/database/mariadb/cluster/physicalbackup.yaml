---
# yaml-language-server: $schema=https://schemas.hydaz.com/k8s.mariadb.com/physicalbackup_v1alpha1.json
apiVersion: k8s.mariadb.com/v1alpha1
kind: PhysicalBackup
metadata:
  name: mariadb-backup
spec:
  mariaDbRef:
    name: mariadb
  target: Replica
  schedule:
    cron: 0 2 * * *
  storage:
    s3:
      accessKeyIdSecretKeyRef:
        name: mariadb-secret
        key: MINIO_ACCESS_ACCESS_KEY
      bucket: backups
      endpoint: minio.storage.svc.cluster.local:9000
      prefix: mariadb
      secretAccessKeySecretKeyRef:
        name: mariadb-secret
        key: MINIO_SECRET_SECRET_KEY
      tls:
        enabled: false
  compression: bzip2
  maxRetention: 168h # 7 days
  stagingStorage:
    persistentVolumeClaim:
      resources:
        requests:
          storage: 4Gi
      accessModes:
        - ReadWriteMany
      storageClassName: ceph-filesystem
