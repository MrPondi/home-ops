---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mssql
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # Cluster-wide clients on the service port (gatus health checks, in-cluster clients)
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "1433"
              protocol: TCP
    # LAN clients (LoadBalancer 10.0.30.131)
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "1433"
              protocol: TCP
  egress: []
