---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mssql
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # LAN clients (LoadBalancer 10.0.30.131)
    - fromCIDR:
        - 192.168.1.0/24
      toPorts:
        - ports:
            - port: "1433"
              protocol: TCP
    # gatus health checks
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: gatus-sidecar
      toPorts:
        - ports:
            - port: "1433"
              protocol: TCP
  egress:
    # DNS
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
