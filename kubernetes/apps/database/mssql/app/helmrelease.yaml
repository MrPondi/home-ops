---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mssql
spec:
  chartRef:
    kind: OCIRepository
    name: mssql
  interval: 1h
  values:
    controllers:
      mssql:
        type: statefulset
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: mcr.microsoft.com/mssql/server
              tag: 2025-latest@sha256:05644dad1266ca3d445d1e8f6d2ebb9a6a03df9a39376e0f7b48917356dca9d9
            env:
              ACCEPT_EULA: Y
              MSSQL_PID: Express
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { add: ["SYS_PTRACE"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
        statefulset:
          podManagementPolicy: Parallel
          volumeClaimTemplates:
            - name: data
              accessMode: ReadWriteOnce
              size: 8Gi
              storageClass: longhorn
              dataSourceRef:
                apiGroup: kopiur.home-operations.com
                kind: Restore
                name: "{{ .Release.Name }}"
              globalMounts:
                - path: /var/opt/mssql
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        type: LoadBalancer
        annotations:
          external-dns.kubernetes.io/hostname: mssql.pondi.dev
          gatus.home-operations.com/endpoint: |-
            group: services
          lbipam.cilium.io/ips: 10.0.30.131
        externalTrafficPolicy: Local
        ports:
          mssql:
            port: 1433
    persistence:
      tmp:
        type: emptyDir
        globalMounts:
          - path: /var/opt/mssql/log
