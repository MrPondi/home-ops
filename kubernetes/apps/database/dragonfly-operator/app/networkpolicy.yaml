---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumclusterwidenetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: &name dragonfly-operator
spec:
  description: Operator egress (DNS, kube API, Dragonfly pods via 9999)
  endpointSelector:
    matchLabels:
      k8s:app.kubernetes.io/name: *name
  ingress: []
  egress:
    # Kubernetes API
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Dragonfly Cluster pods (cluster-wide: any namespace, no maintenance needed)
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: dragonfly
            k8s:app.kubernetes.io/part-of: dragonfly
      toPorts:
        - ports:
            - port: "9999"
              protocol: TCP
