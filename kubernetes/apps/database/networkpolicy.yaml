---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name database-jobs
spec:
  endpointSelector:
    matchExpressions:
      - key: batch.kubernetes.io/job-name
        operator: Exists
      - key: kopiur.home-operations.com/config
        operator: DoesNotExist
  ingress:
    # MariaDB (backup/restore data stream)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mariadb
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
  egress:
    # MariaDB (backup source / restore target)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mariadb
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # Backups to QNAP MinIO (S3)
    - toCIDR:
        - 10.0.25.25/32
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name database-kopiur
spec:
  endpointSelector:
    matchExpressions:
      - key: kopiur.home-operations.com/config
        operator: Exists
  ingress: []
  # egress: kube-API comes from the namespace-wide default-deny
  egress:
    # Repository backend (kopia S3 via envoy-internal VIP)
    - toCIDR:
        - 10.0.30.11/32
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
