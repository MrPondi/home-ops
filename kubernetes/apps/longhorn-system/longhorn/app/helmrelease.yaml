---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: longhorn
spec:
  chartRef:
    kind: OCIRepository
    name: longhorn
  interval: 1h
  values:
    persistence:
      defaultClass: true
      defaultClassReplicaCount: 1
      dataEngine: v1

    csi:
      attacherReplicaCount: 1
      provisionerReplicaCount: 1
      resizerReplicaCount: 1
      snapshotterReplicaCount: 1

    defaultSettings:
      createDefaultDiskLabeledNodes: true

      defaultDataPath: /var/lib/longhorn
      storageOverProvisioningPercentage: 100000
      storageReservedPercentageForDefaultDisk: 25
      defaultReplicaCount: '{"v1":"1","v2":"1"}'

      v1DataEngine: true
      v2DataEngine: false
      allowCollectingLonghornUsageMetrics: false
      # dataEngineHugepageEnabled: true # Engine v2

      nodeDownPodDeletionPolicy: do-nothing
      nodeDrainPolicy: allow-if-replica-is-stopped

    longhornUI:
      replicas: 1

    httproute:
      enabled: true
      parentRefs:
        - name: envoy-internal
          namespace: network
      hostnames:
        - longhorn.pondi.dev
      annotations:
        gatus.home-operations.com/endpoint: |-
          name: longhorn
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Longhorn
        gethomepage.dev/group: Infrastructure
        gethomepage.dev/icon: longhorn.svg
        gethomepage.dev/description: Storage cluster management interface
        gethomepage.dev/weight: "15"
        gethomepage.dev/app: longhorn
    monitoring:
      enabled: true
      createPrometheusRules: true
    metrics:
      serviceMonitor:
        enabled: true
