---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: longhorn-manager
spec:
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
    # Prometheus (observability) - metrics scrape
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    # Longhorn MCP server workload (ai)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:toolhive-name: longhorn
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    # Instance-manager control traffic — same-namespace manager-spawned pods; ports dynamic (37516/38258 observed), selector is the boundary
    - fromEndpoints:
        - matchLabels:
            longhorn.io/component: instance-manager
