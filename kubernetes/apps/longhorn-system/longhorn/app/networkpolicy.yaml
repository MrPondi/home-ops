---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-to-longhorn-manager
spec:
  # Longhorn manager pods (longhorn-system)
  endpointSelector:
    matchLabels:
      app: longhorn-manager
  ingress:
    # Prometheus (observability) - metrics scrape
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
    # Longhorn MCP server workload (ai) - ToolHive pods (manager API, unauthenticated)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:toolhive-name: longhorn
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
