---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-cleanup
spec:
  concurrency: 1
  cron: 0 8 * * *
  groups:
    - default
  name: cleanup
  retain: 0
  task: snapshot-cleanup
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: snapshot-delete
spec:
  concurrency: 1
  cron: 0 7 * * *
  groups:
    - default
  name: delete
  retain: 0
  task: snapshot-delete
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/longhorn.io/recurringjob_v1beta2.json
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: trim
spec:
  concurrency: 1
  cron: 0 15 * * *
  groups:
    - default
  name: trim
  retain: 0
  task: filesystem-trim
