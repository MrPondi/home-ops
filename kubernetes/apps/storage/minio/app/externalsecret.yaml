---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: minio-secret
    template:
      data:
        MINIO_ROOT_USER: "{{ .MINIO_ROOT_USER }}"
        MINIO_ROOT_PASSWORD: "{{ .MINIO_ROOT_PASSWORD }}"
        MINIO_IDENTITY_OPENID_CONFIG_URL: "http://authentik.security.svc.cluster.local/application/o/minio/.well-known/openid-configuration"
        MINIO_IDENTITY_OPENID_CLIENT_ID: "{{ .MINIO_OIDC_CLIENT_ID }}"
        MINIO_IDENTITY_OPENID_CLIENT_SECRET: "{{ .MINIO_OIDC_CLIENT_SECRET }}"
        MINIO_IDENTITY_OPENID_DISPLAY_NAME: "authentik"
        MINIO_IDENTITY_OPENID_CLAIM_NAME: "policy"
        MINIO_IDENTITY_OPENID_SCOPES: "openid,profile,email"
  dataFrom:
    - extract:
        key: minio
