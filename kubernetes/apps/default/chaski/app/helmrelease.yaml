---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: chaski
spec:
  chartRef:
    kind: OCIRepository
    name: chaski
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: "true"
    env:
      TZ: Europe/Warsaw
    envFrom:
      - secretRef:
          name: chaski-secret
    config:
      targets:
        seerr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SEER_PUSHOVER_TOKEN" }}
        radarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "RADARR_PUSHOVER_TOKEN" }}
        sonarr:
          apprise:
            url: pover://{{ env "PUSHOVER_USER_KEY" }}@{{ env "SONARR_PUSHOVER_TOKEN" }}
      templates:
        url: "https://{{ . }}.pondi.dev"
      routes:
        seerr-request:
          target: seerr
          title: 'New {{ ternary "Movie" "TV Show" (eq .payload.media.media_type "movie") }} requested'
          message: |-
            User: {{ .payload.request.requestedBy_username }}
          params:
            priority: low
            url: '{{ include "url" "seerr" }}/requests'
            url_title: View Request
          whenExpr: payload.request != null
        radarr-download:
          target: radarr
          title: "Movie {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}"
          message: |-
            {{ .payload.movie.title }} ({{ .payload.movie.year }})
            {{ .payload.movie.overview | ellipsis 300 }}

            Client: {{ .payload.downloadClient | default "unknown" }}
          params:
            priority: low
            url: '{{ .payload.applicationUrl | default (include "url" "radarr" ) }}/movie/{{ .payload.movie.tmdbId }}'
            url_title: View Movie
          whenExpr: payload.eventType == "Download"
        radarr-manual:
          target: radarr
          title: Movie Requires Manual Interaction
          message: |-
            {{ .payload.movie.title }} ({{ .payload.movie.year }})
            Client: {{ .payload.downloadClient | default "unknown" }}
          params:
            priority: high
            url: '{{ .payload.applicationUrl | default (include "url" "radarr" ) }}/activity/queue'
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
        sonarr-download:
          target: sonarr
          title: "Episode {{ if .payload.isUpgrade }}Upgraded{{ else }}Added{{ end }}"
          message: |-
            {{ .payload.series.title }} ({{ printf "S%02dE%02d" (toInt (index .payload.episodes 0).seasonNumber) (toInt (index .payload.episodes 0).episodeNumber) }})
            {{ (index .payload.episodes 0).title }}

            Client: {{ .payload.downloadClient | default "unknown" }}
          params:
            priority: low
            url: '{{ .payload.applicationUrl | default (include "url" "sonarr" ) }}/series/{{ .payload.series.titleSlug }}'
            url_title: View Series
          whenExpr: payload.eventType == "Download"
        sonarr-manual:
          target: sonarr
          title: Episode Requires Manual Interaction
          message: |-
            {{ .payload.series.title }}
            Client: {{ .payload.downloadClient | default "unknown" }}
          params:
            priority: high
            url: '{{ .payload.applicationUrl | default (include "url" "sonarr" ) }}/activity/queue'
            url_title: View Queue
          whenExpr: payload.eventType == "ManualInteractionRequired"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
