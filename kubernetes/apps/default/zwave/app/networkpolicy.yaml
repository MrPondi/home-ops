---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: zwave
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: zwave
  ingress:
    # HTTPRoute zwave.pondi.dev (envoy-internal)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # MQTT broker (mosquitto)
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mosquitto
      toPorts:
        - ports:
            - port: "1883"
              protocol: TCP
    # npm registry for add-on installs (internet; wire name carries search suffix)
    - toFQDNs:
        - matchName: registry.npmjs.org
        - matchName: registry.npmjs.org.default.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
    # Z-Wave JS firmware updates
    - toFQDNs:
        - matchName: firmware.zwave-js.io
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
