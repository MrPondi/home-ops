---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./networkpolicy.yaml
  - ./ocirepository.yaml
patches:
  - patch: |-
      apiVersion: kopiur.home-operations.com/v1alpha1
      kind: SnapshotPolicy
      metadata:
        name: _
      spec:
        mover:
          privilegedMode: true
          securityContext:
            runAsUser: 0
            runAsGroup: 0
            privileged: true
    target:
      group: kopiur.home-operations.com
      kind: SnapshotPolicy
