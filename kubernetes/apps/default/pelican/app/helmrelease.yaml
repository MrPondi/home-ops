---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pelican
spec:
  chartRef:
    kind: OCIRepository
    name: pelican
  interval: 1h
  values:
    controllers:
      pelican:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          volume-permissions:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.37.0@sha256:026ed7273270ec08f6902b4ae8334c23b473e5394bec3bbbdbfe580c710d50bc
            command:
              - /bin/sh
              - -c
              - |
                chown -R 82:82 /var/www/html/storage/logs
                mkdir -p /pelican-data/plugins
                chown -R 82:82 /pelican-data
            securityContext:
              runAsUser: 0
        containers:
          app:
            image:
              repository: ghcr.io/pelican-dev/panel
              tag: v1.0.0-beta31@sha256:5c57b17627eb134d52c0589bc1eaccf198b811a47c33cceb6416ff29504b2fa5
            env:
              XDG_DATA_HOME: /pelican-data
              FILAMENT_UPLOADABLE_AVATARS: "true"
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Pelican Panel
          gethomepage.dev/group: Apps
          gethomepage.dev/icon: pelican-panel.svg
          gethomepage.dev/description: Game server management panel
        hostnames:
          - "gamepanel.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network

    configMaps:
      php-config:
        data:
          uploads.ini: |
            upload_max_filesize = 5M
            post_max_size = 8M

    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /pelican-data
      php-config:
        type: configMap
        identifier: php-config
        advancedMounts:
          pelican:
            app:
              - path: /usr/local/etc/php/conf.d/uploads.ini
                subPath: uploads.ini
      tmp:
        type: emptyDir
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/www/html/storage/logs
