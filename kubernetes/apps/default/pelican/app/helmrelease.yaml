# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pelican
spec:
  chartRef:
    kind: OCIRepository
    name: pelican
  interval: 1h
  values:
    controllers:
      pelican:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          permissions-fix:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - /bin/sh
              - -c
              - |
                # Create Laravel storage directories
                mkdir -p /var/www/html/storage/framework/views
                mkdir -p /var/www/html/storage/framework/sessions
                mkdir -p /var/www/html/storage/framework/cache/data
                mkdir -p /pelican-data/plugins

                # Set permissions
                chown -R 82:82 /var/www/html/storage /pelican-data
                chmod -R 770 /var/www/html/storage/framework
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
        containers:
          app:
            image:
              repository: ghcr.io/pelican/panel
              tag: v1.0.0-beta38@sha256:46f356f3fda423b1d43f0dc3c71efc056cd8b9bec365d1d7817306a17ee5694a
            env:
              XDG_DATA_HOME: /pelican-data
              FILAMENT_UPLOADABLE_AVATARS: "true"
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness: &probes
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /up
                    port: 80
                  initialDelaySeconds: 0
                  periodSeconds: 10
                  timeoutSeconds: 1
                  failureThreshold: 3
              readiness: *probes
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 82
        runAsGroup: 82
        fsGroup: 82
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Pelican Panel
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: pelican-panel.png
          gethomepage.dev/description: Game server management panel
          gethomepage.dev/weight: "10"
          gethomepage.dev/widget.type: pterodactyl
          gethomepage.dev/widget.url: http://{{ .Release.Name }}.{{ .Release.Namespace }}.svc.cluster.local
          gethomepage.dev/widget.key: "{{`{{HOMEPAGE_VAR_PELICAN_TOKEN}}`}}"
        hostnames:
          - "gamepanel.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    configMaps:
      php-config:
        data:
          uploads.ini: |
            upload_max_filesize = 5M
            post_max_size = 8M
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /pelican-data
      php-config:
        type: configMap
        identifier: php-config
        globalMounts:
          - path: /usr/local/etc/php/conf.d/uploads.ini
            subPath: uploads.ini
      tmp:
        type: emptyDir
      app-private:
        type: emptyDir
        globalMounts:
          - path: /var/www/html/storage/app/private
      logs:
        type: emptyDir
        globalMounts:
          - path: /var/www/html/storage/logs
      framework:
        type: emptyDir
        globalMounts:
          - path: /var/www/html/storage/framework
      bootstrap-cache:
        type: emptyDir
        globalMounts:
          - path: /var/www/html/bootstrap/cache
      supervisord:
        type: emptyDir
        globalMounts:
          - path: /var/run/supervisord
      homedir:
        type: emptyDir
        globalMounts:
          - path: /home/www-data/
      node-modules:
        type: emptyDir
        globalMounts:
          - path: /var/www/html/node_modules
