---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  labels:
    components.dragonfly/authentication: "true"
    components.dragonfly/enabled: "true"
  name: pelican
spec:
  components:
    - ../../../../components/kopiur/statefulset
  dependsOn:
    - name: external-secrets-store
      namespace: external-secrets
    - name: mariadb-cluster
      namespace: database
  healthCheckExprs: []
  interval: 1h
  path: ./kubernetes/apps/default/pelican/app
  postBuild:
    substitute:
      APP: pelican
      KOPIUR_CLAIM: data
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
