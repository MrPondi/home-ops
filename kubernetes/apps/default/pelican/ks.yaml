---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: pelican
spec:
  components:
    - ../../../../components/kopiur/backup
    - ../../../../components/volsync
  dependsOn:
    - name: longhorn
      namespace: longhorn-system
    - name: mariadb-cluster
      namespace: database
  interval: 1h
  path: ./kubernetes/apps/default/pelican/app
  postBuild:
    substitute:
      APP: pelican
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  targetNamespace: default
  wait: false

  patches:
    - target:
        kind: SnapshotPolicy
      patch: |-
        apiVersion: kopiur.home-operations.com/v1alpha1
        kind: SnapshotPolicy
        metadata:
          name: ${APP}
        spec:
          mover:
            privilegedMode: true
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              privileged: true
