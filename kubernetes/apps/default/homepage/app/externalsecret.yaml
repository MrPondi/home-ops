---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: homepage
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: homepage-secret
    template:
      data:
        # Media - *arr Apps
        HOMEPAGE_VAR_BAZARR_TOKEN: "{{ .BAZARR_API_KEY }}"
        HOMEPAGE_VAR_PROWLARR_TOKEN: "{{ .PROWLARR_API_KEY }}"
        HOMEPAGE_VAR_RADARR_TOKEN: "{{ .RADARR_API_KEY }}"
        HOMEPAGE_VAR_SONARR_TOKEN: "{{ .SONARR_API_KEY }}"
        # Media
        HOMEPAGE_VAR_AUTOBRR_TOKEN: "{{ .HOMEPAGE_VAR_AUTOBRR_TOKEN }}"
        HOMEPAGE_VAR_QUI_TOKEN: "{{ .HOMEPAGE_VAR_QUI_TOKEN }}"
        HOMEPAGE_VAR_JELLYFIN_TOKEN: "{{ .HOMEPAGE_VAR_JELLYFIN_TOKEN }}"
        HOMEPAGE_VAR_SEERR_TOKEN: "{{ .SEERR_API_KEY }}"
        # Observability
        HOMEPAGE_VAR_GRAFANA_USERNAME: "{{ .GRAFANA_ADMIN_USER }}"
        HOMEPAGE_VAR_GRAFANA_PASSWORD: "{{ .GRAFANA_ADMIN_PASSWORD }}"
        HOMEPAGE_VAR_UNIFI_CONSOLE_KEY: "{{ .UNIFI_API_KEY }}"
        # Other
        HOMEPAGE_VAR_HOMEASSISTANT_TOKEN: "{{ .HOMEPAGE_VAR_HOMEASSISTANT_TOKEN }}"
        HOMEPAGE_VAR_PELICAN_TOKEN: "{{ .HOMEPAGE_VAR_PELICAN_TOKEN }}"
        HOMEPAGE_VAR_NEXTCLOUD_TOKEN: "{{ .NEXTCLOUD_NC_TOKEN }}"
        HOMEPAGE_VAR_TRUENAS_API_KEY: "{{ .HOMEPAGE_VAR_TRUENAS_API_KEY }}"
        HOMEPAGE_VAR_AUTHENTIK_TOKEN: "{{ .AUTHENTIK_ADMIN_TOKEN }}"
        # Proxmox
        HOMEPAGE_VAR_PROXMOX_API_TOKEN: "{{ .HOMEPAGE_VAR_PROXMOX_API_TOKEN }}"
        HOMEPAGE_VAR_PROXMOX_API_SECRET: "{{ .HOMEPAGE_VAR_PROXMOX_API_SECRET }}"
        # Cloudflare Tunnel
        HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID: "{{ .CLOUDFLARE_ACCOUNT_TAG }}"
        HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID: "{{ .CLOUDFLARE_TUNNEL_ID }}"
        HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN: "{{ .HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN }}"
  dataFrom:
    - extract:
        key: bazarr
    - extract:
        key: prowlarr
    - extract:
        key: radarr
    - extract:
        key: sonarr
    - extract:
        key: seerr
    - extract:
        key: grafana
    - extract:
        key: unifi
    - extract:
        key: nextcloud
    - extract:
        key: authentik
    - extract:
        key: cloudflare
    - extract:
        key: homepage
