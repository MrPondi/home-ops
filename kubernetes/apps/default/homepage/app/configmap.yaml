---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
    traefik: false
  settings.yaml: |
    title: Homelab
    # background:
    #   image: https://raw.githubusercontent.com/joryirving/home-ops/main/.docs/assets/101518784_p0.jpg
    #   opacity: 20
    favicon: https://github.com/walkxcode/dashboard-icons/blob/main/png/heimdall.png
    theme: dark
    color: slate
    headerStyle: boxed
    statusStyle: dot
    useEqualHeights: false
    fiveColumns: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true
    layout:
      Media & Entertainment:
        icon: jellyfin
        style: row
        columns: 4
      Home & Automation:
        icon: home-assistant
        style: column
      Monitoring & Operations:
        icon: prometheus
        style: column
      Infrastructure:
        icon: flux-cd
        style: column
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: ""
  proxmox.yaml: |
    orion:
      url: https:/10.0.10.10:8006
      token: {{HOMEPAGE_VAR_PROXMOX_API_TOKEN}}
      secret: {{HOMEPAGE_VAR_PROXMOX_API_SECRET}}
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        network: default
    - unifi_console:
        url: https://192.168.1.1
        key: {{HOMEPAGE_VAR_UNIFI_CONSOLE_KEY}}
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
