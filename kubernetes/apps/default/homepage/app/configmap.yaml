---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
    traefik: false
  settings.yaml: |
    title: Homelab
    background:
      image: https://images.unsplash.com/photo-1672288072591-619afe830096?ixlib=rb-4.0.3&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1170&q=80
      opacity: 20
    favicon: https://cdn.jsdelivr.net/gh/homarr-labs/dashboard-icons/svg/heimdall.svg
    theme: dark
    color: slate
    headerStyle: boxed
    statusStyle: dot
    useEqualHeights: false
    fiveColumns: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
      hideVisitURL: true
    layout:
      Media & Entertainment:
        icon: /icons/popcorn.svg
        style: row
        columns: 4
      Home & Automation:
        icon: home-assistant
        style: column
      Monitoring & Operations:
        icon: prometheus
        style: column
      Infrastructure:
        icon: flux-cd
        style: column
  custom.css: ""
  custom.js: ""
  bookmarks.yaml: ""
  services.yaml: |
    - Infrastructure:
      - Cloudflare Tunnel:
          icon: cloudflare.svg
          description: External access
          weight: "20"
          widget:
            type: cloudflared
            accountid: {{HOMEPAGE_VAR_CLOUDFLARE_ACCOUNT_ID}}
            tunnelid: {{HOMEPAGE_VAR_CLOUDFLARE_TUNNEL_ID}}
            key: {{HOMEPAGE_VAR_CLOUDFLARE_API_TOKEN}}
    - Home & Automation:
      - Pelican Wings:
          icon: docker-moby.svg
          description: Proxmox Ubuntu VM
          weight: "15"
          proxmoxNode: orion
          proxmoxVMID: 102
  proxmox.yaml: |
    orion:
      url: https://10.0.10.10:8006
      token: {{HOMEPAGE_VAR_PROXMOX_API_TOKEN}}
      secret: {{HOMEPAGE_VAR_PROXMOX_API_SECRET}}
  widgets.yaml: |
    - kubernetes:
        cluster:
          show: true
          cpu: true
          memory: true
          showLabel: true
          label: "cluster"
        nodes:
          show: false
          cpu: true
          memory: true
          showLabel: true
    - resources:
        backend: resources
        expanded: true
        network: default
    - unifi_console:
        url: https://192.168.1.1
        key: {{HOMEPAGE_VAR_UNIFI_CONSOLE_KEY}}
    - search:
        provider: duckduckgo
        target: _blank
  docker.yaml: ""
