---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lavalink
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: lavalink-secret
    template:
      data:
        application.yml: |-
          server:
            port: 2333
            address: 0.0.0.0
          lavalink:
            server:
              sources:
                youtube: false # Using Youtube nativly on lavalink is deprecated, disable it and use https://github.com/lavalink-devs/youtube-source instead.
              password: "{{ .LAVALINK_PASSWORD }}"
              bufferDurationMs: 225
              frameBufferDurationMs: 5000
              youtubePlaylistLoadLimit: 3
              opusEncodingQuality: 5
              resamplingQuality: MEDIUM
              trackStuckThresholdMs: 5000
              playerUpdateInterval: 3
              useSeekGhosting: true
              youtubeSearchEnabled: true
              soundcloudSearchEnabled: true
              gc-warnings: true
            plugins:
              - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.1" # LavaSrc - for extra sources like deezer, spotify, etc. https://github.com/topi314/LavaSrc
                repository: "https://maven.lavalink.dev/releases"
              - dependency: "com.github.topi314.lavasearch:lavasearch-plugin:1.0.0" # https://github.com/topi314/LavaSearch
                repository: "https://maven.lavalink.dev/releases"
              - dependency: "com.dunctebot:skybot-lavalink-plugin:1.7.0" # https://github.com/DuncteBot/skybot-lavalink-plugin
                repository: "https://maven.lavalink.dev/releases"
              - dependency: "com.github.Devoxin:LavaDSPX-Plugin:0.0.5" # https://github.com/devoxin/LavaDSPX-Plugin
                repository: "https://jitpack.io"
              - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.0" # https://github.com/lavalink-devs/youtube-source
                repository: "https://maven.lavalink.dev/releases"
              - dependency: "com.github.topi314.lavalyrics:lavalyrics-plugin:1.1.0" # https://github.com/topi314/LavaLyrics
                repository: "https://maven.lavalink.dev/releases"
              - dependency: "me.duncte123:java-lyrics-plugin:1.6.6" # https://github.com/DuncteBot/java-timed-lyrics
                repository: "https://maven.lavalink.dev/releases"
          plugins:
            lyrics:
              countryCode: pl
              geniusApiKey: "{{ .GENIUS_API_KEY }}"
            lavalyrics:
              sources:
                - genius
                - spotify
                - youtube
                - deezer
                - yandexMusic
            youtube:
              enabled: true
              # YouTube's cipher changes are becoming more frequent and complex, making it harder to keep up.
              # To simplify signature deciphering, you can use a remote cipher server like yt-cipher, a lightweight Deno server with a REST API. More details are available at https://github.com/kikkia/yt-cipher
              remoteCipher:
                userAgent: "lavalink"
                url: "http://yt-cipher.default.svc.cluster.local:8001" # The base URL of your remote cipher server.
                password: "{{ .YT_CIPHER_API_TOKEN }}" # The password to authenticate with your remote cipher server.
              oauth:
                enabled: false
                # refreshToken: "Insert your refresh token here" # For more details, please refer to https://github.com/lavalink-devs/youtube-source?tab=readme-ov-file#using-oauth-tokens
              allowSearch: true
              allowDirectVideoIds: true
              allowDirectPlaylistIds: true
              # For more details about client setup, refer to https://github.com/lavalink-devs/youtube-source?tab=readme-ov-file#available-clients
              clients:
                - "ANDROID_MUSIC"
                - "MUSIC"
                - "WEB"
                - "WEBEMBEDDED"
                - "TVHTML5EMBEDDED"
              ANDROID_MUSIC:
                playlistLoading: false
                videoLoading: true
                searching: true
                playback: true
              MUSIC:
                playlistLoading: false
                videoLoading: false
                searching: true
                playback: false
              WEB:
                playlistLoading: false
                videoLoading: true
                searching: true
                playback: true
              WEBEMBEDDED:
                playlistLoading: false
                videoLoading: false
                searching: false
                playback: true
              TVHTML5EMBEDDED:
                playlistLoading: false
                videoLoading: false
                searching: false
                playback: true
            lavasrc:
              providers:
                - 'ytsearch:"%ISRC%"'
                - "dzisrc:%ISRC%"

                - "ytsearch:%QUERY%"
                - "dzsearch:%QUERY%"
                # - "spsearch:%QUERY%"
                # - "amsearch:%QUERY%"
                - "tdsearch:%QUERY%"
                - "qbsearch:%QUERY%"
              sources:
                spotify: false # Enable Spotify source
                applemusic: true # Enable Apple Music source
                deezer: false # Enable Deezer source
                youtube: true # Enable YouTube search source (https://github.com/topi314/LavaSearch)
                tidal: false # Enable Tidal source
                qobuz: false # Enabled qobuz source
                ytdlp: false # Enable yt-dlp source
                flowerytts: false # Enable Flowery TTS source
                yandexmusic: false # Enable Yandex Music source
                vkmusic: false # Enable Vk Music source
                jiosaavn: false # Enable JioSaavn source
              lyrics-sources:
                spotify: false # Enable Spotify lyrics source
                deezer: false # Enable Deezer lyrics source
                youtube: true # Enable YouTube lyrics source
                yandexmusic: false # Enable Yandex Music lyrics source
                vkmusic: false # Enable Vk Music lyrics source
                lrcLib: false # Enable LRC Library lyrics source (https://lrclib.net)
              spotify:
                clientId: "{{ .SPOTIFY_CLIENT_ID }}"
                clientSecret: "{{ .SPOTIFY_CLIENT_SECRET }}"
                # spDc: "{{ .SPOTIFY_SPDC }}" # the sp dc cookie used for accessing the spotify lyrics api
                countryCode: "PL" # the country code you want to use for filtering the artists top tracks. See https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
                playlistLoadLimit: 6 # The number of pages at 100 tracks each
                albumLoadLimit: 6 # The number of pages at 50 tracks each
                resolveArtistsInSearch: true # Whether to resolve artists in track search results (can be slow)
                localFiles: true # Enable local files support with Spotify playlists. Please note `uri` & `isrc` will be `null` & `identifier` will be `"local"`
                preferAnonymousToken: false # Use this to generate and cache anonymous Spotify access tokens from your own endpoint, as Spotify recently updated their implementation. This requires the customTokenEndpoint to be set.
                customTokenEndpoint: "http://localhost:8080/api/token" # For more details, please refer to https://github.com/topi314/spotify-tokener
              applemusic:
                countryCode: "PL" # the country code you want to use for filtering the artists top tracks and language. See https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
                mediaAPIToken: "{{ .APPLE_MUSIC_API_TOKEN }}" # apple music api token
                # or specify an apple developer music kit key. See https://developer.apple.com/help/account/capabilities/create-a-media-identifier-and-private-key/
                keyID: "your key id"
                teamID: "your team id"
                musicKitKey: |
                  -----BEGIN PRIVATE KEY-----
                  your key
                  -----END PRIVATE KEY-----
                playlistLoadLimit: 6 # The number of pages at 300 tracks each
                albumLoadLimit: 6 # The number of pages at 300 tracks each
              deezer:
                masterDecryptionKey: "{{ .DEEZER_MASTER_DECRYPTION_KEY }}" # the master key used for decrypting the deezer tracks.
                arl: "{{ .DEEZER_ARL }}" # the arl cookie used for accessing the deezer api this is not optional anymore
                formats: ["FLAC", "MP3_320", "MP3_256", "MP3_128", "MP3_64", "AAC_64"] # the formats you want to use for the deezer tracks. "FLAC", "MP3_320", "MP3_256" & "AAC_64" are only available for premium users and require a valid arl
              youtube:
                countryCode: "PL" # the country code you want to use for searching & lyrics. See https://en.wikipedia.org/wiki/ISO_3166-1_alpha-2
                language: "pl" # the language code you want to use for searching & lyrics. See https://en.wikipedia.org/wiki/List_of_ISO_639_language_codes
              tidal:
                countryCode: "PL" # the country code for accessing region-specific content on Tidal (ISO 3166-1 alpha-2).
                searchLimit: 6 # How many search results should be returned
                token: "{{ .TIDAL_TOKEN }}" # the token used for accessing the tidal api. See https://github.com/topi314/LavaSrc#tidal
              qobuz:
                userOauthToken: "{{ .QOBUZ_USER_OAUTH_TOKEN }}" # This token is needed for authorization in the api. Guide: https://github.com/topi314/LavaSrc#qobuz
                # appId : optional (Only pass it when you are using an old userOauthToken)
                # appSecret : optional (Only pass it when you are using an old userOauthToken)
              ytdlp:
                path: "yt-dlp" # the path to the yt-dlp executable.
                searchLimit: 10 # How many search results should be returned
                # customLoadArgs: ["-q", "--no-warnings", "--flat-playlist", "--skip-download", "-J"] # Custom arguments to pass to yt-dlp
                # customPlaybackArgs: ["-q", "--no-warnings", "-f", "bestaudio", "-J"] # Custom arguments for yt-dlp
              flowerytts:
                voice: "Olivia" # (case-sensitive) get default voice from here https://api.flowery.pw/v1/tts/voices
                translate: false # whether to translate the text to the native language of voice
                silence: 0 # the silence parameter is in milliseconds. Range is 0 to 10000. The default is 0.
                speed: 1.0 # the speed parameter is a float between 0.5 and 10. The default is 1.0. (0.5 is half speed, 2.0 is double speed, etc.)
                audioFormat: "mp3" # supported formats are: mp3, ogg_opus, ogg_vorbis, aac, wav, and flac. Default format is mp3
              yandexmusic:
                accessToken: "your access token" # the token used for accessing the yandex music api. See https://github.com/topi314/LavaSrc#yandex-music
                playlistLoadLimit: 1 # The number of pages at 100 tracks each
                albumLoadLimit: 1 # The number of pages at 50 tracks each
                artistLoadLimit: 1 # The number of pages at 10 tracks each
                # proxy: # If defined, YandexMusic HTTP requests will be proxied through here. YandexMusic uses region blocking
                #   url: "https://example.org" # The HTTP proxy to use
                #   username: "my-bot" # Optional username to authenticate with the proxy
                #   password: "youshallpass" # Optional password to authenticate with the proxy
              vkmusic:
                userToken: "your user token" # This token is needed for authorization in the api. Guide: https://github.com/topi314/LavaSrc#vk-music
                playlistLoadLimit: 1 # The number of pages at 50 tracks each
                artistLoadLimit: 1 # The number of pages at 10 tracks each
                recommendationsLoadLimit: 10 # Number of tracks
                # proxy: # If the server with the plugin is located outside of Russia, you must configure a proxy located in Russia to bypass regional restrictions.
                #   url: "https://example.org" # The HTTP proxy to use
                #   username: "my-bot" # Optional username to authenticate with the proxy
                #   password: "youshallpass" # Optional password to authenticate with the proxy
              jiosaavn:
                decryption: # The decryption configuration for the JioSaavn tracks
                  secretKey: "your secret key" # The required secret key used for decryption (Find your own secret key)
                  algorithm: "DES" # The algorithm used for decryption (Default "DES")
                  transformation: "DES/ECB/PKCS5Padding" # The transformation used for decryption (Default "DES/ECB/PKCS5Padding")
                # proxy: # If defined, JioSaavn HTTP requests will be proxied through here. JioSaavn uses region blocking
                #   url: "https://example.org" # The HTTP proxy to use
                #   username: "my-bot" # Optional username to authenticate with the proxy
                #   password: "youshallpass" # Optional password to authenticate with the proxy
            dunctebot:
              ttsLanguage: "en-US"
              sources:
                getyarn: true # www.getyarn.io
                clypit: true # www.clyp.it
                tts: true # speak:Words to speak
                pornhub: true # should be self-explanatory
                reddit: true # should be self-explanatory
                ocremix: true # www.ocremix.org
                tiktok: true # tiktok.com
                mixcloud: true # mixcloud.com
                soundgasm: true # soundgasm.net
          metrics:
            prometheus:
              enabled: true
              endpoint: /metrics
          sentry:
            dsn: ""
            environment: ""
          logging:
            file:
              max-history: 5
              max-size: 10MB
            path: /tmp/logs/
            level:
              root: INFO
              lavalink: INFO
            request:
              enabled: true
              includeClientInfo: true
              includeHeaders: true
              includeQueryString: true
              includePayload: true
              maxPayloadLength: 10000
            logback:
              rollingpolicy:
                max-file-size: 10MB
                max-history: 5
  dataFrom:
    - extract:
        key: musicbot
