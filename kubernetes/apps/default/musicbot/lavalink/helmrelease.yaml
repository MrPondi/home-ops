---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lavalink
spec:
  chartRef:
    kind: OCIRepository
    name: lavalink
  interval: 1h
  values:
    controllers:
      lavalink:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lavalink-devs/lavalink
              tag: 4.2.0@sha256:0ec84c5327efcc82e6a020bf7663e3facf0d5c008a2f6915032784f3083f81d8
            env:
              _JAVA_OPTIONS: -Xmx2G
              SERVER_PORT: &port 2333
              TZ: Europe/Warsaw
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 233
        runAsGroup: 233
        fsGroup: 233
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          lavalink:
            port: *port
    serviceMonitor:
      app:
        endpoints:
          - port: lavalink
    persistence:
      config:
        type: secret
        name: "{{ .Release.Name }}-secret"
        globalMounts:
          - path: /opt/Lavalink/application.yml
            subPath: application.yml
      plugins:
        existingClaim: "{{ .Release.Name }}-plugins"
        globalMounts:
          - path: /opt/Lavalink/plugins/
      tmp:
        type: emptyDir
