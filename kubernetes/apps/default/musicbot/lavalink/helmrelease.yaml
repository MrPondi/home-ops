---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lavalink
spec:
  chartRef:
    kind: OCIRepository
    name: lavalink
  interval: 1h
  values:
    controllers:
      lavalink:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/lavalink-devs/lavalink
              tag: 4.1.2@sha256:21c021c42dd7d0a874cf0262233d88d5e6238bac969b47b242172f904a53c5db
            env:
              _JAVA_OPTIONS: -Xmx2G
              SERVER_PORT: &port 2333
              TZ: Europe/Warsaw
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 233
        runAsGroup: 233
        fsGroup: 233
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
      lavalink:
        type: LoadBalancer
        annotations:
          lbipam.cilium.io/ips: 10.0.30.132
        externalTrafficPolicy: Local
        ports:
          lavalink:
            port: *port

    persistence:
      config:
        type: secret
        name: "{{ .Release.Name }}-secret"
        globalMounts:
          - path: /opt/Lavalink/application.yml
            subPath: application.yml
      plugins:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/Lavalink/plugins/
      tmp:
        type: emptyDir
