---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lavamusic
spec:
  chartRef:
    kind: OCIRepository
    name: lavamusic
  interval: 1h
  values:
    controllers:
      lavamusic:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/botxlab/lavamusic
              tag: v4.7.0@sha256:3541b981b5389d04d4e0b534080a9a4c7c390da70aa3057ec55c6cd2d96f2181
            env:
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      pgdata:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/lavamusic-pgdata
      entrypoint:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        defaultMode: 0775
        globalMounts:
          - path: /app/entrypoint.sh
            subPath: entrypoint.sh
