---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: lavamusic
spec:
  chartRef:
    kind: OCIRepository
    name: lavamusic
  interval: 1h
  values:
    controllers:
      lavamusic:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/botxlab/lavamusic
              tag: main@sha256:30c08e38443374541da919bc2135634f94b23da3e9d02281adb11df90269d084
            env:
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: false
        runAsUser: 0
        runAsGroup: 0
        fsGroup: 233
        fsGroupChangePolicy: OnRootMismatch

    persistence:
      pgdata:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/lavamusic-pgdata
