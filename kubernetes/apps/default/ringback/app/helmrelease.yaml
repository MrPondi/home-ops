---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: ringback
spec:
  chartRef:
    kind: OCIRepository
    name: ringback
  interval: 1h
  values:
    controllers:
      ringback:
        type: cronjob
        cronjob:
          schedule: 9 0 * * 1-5
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          pip-install:
            image:
              repository: python
              tag: 3.14-slim@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
            command:
              - "pip3"
              - "install"
              - "--no-cache-dir"
              - "--target"
              - "/packages"
              - "httpx"
              - "pydantic"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:ce40764625a4ff50df3548277632e7f96c4e77fe75fa848aae9885476e7df5a4
            env:
              PYTHONPATH: "/packages"
              TZ: Europe/Warsaw
            command:
              - "python"
              - "-u"
              - "/app/main.py"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      script:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /app
      secret:
        type: secret
        name: "{{ .Release.Name }}-secret"
        globalMounts:
          - path: /config/config.json
            subPath: config.json
      packages:
        type: emptyDir
        globalMounts:
          - path: /packages
      tmp:
        type: emptyDir
