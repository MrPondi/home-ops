---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: ringback-configmap
    files:
      - main.py=./resources/main.py
      - models.py=./resources/models.py
      - play.py=./resources/play.py
      - woocommerce.py=./resources/woocommerce.py
generatorOptions:
  disableNameSuffixHash: true
