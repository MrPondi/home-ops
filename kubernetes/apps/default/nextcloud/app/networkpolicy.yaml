---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: nextcloud
  ingress:
    # HTTPRoute nextcloud.pondi.dev (envoy-internal)
    - fromEndpoints:
        - matchLabels: # envoy-internal gateway pods (network)
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # MariaDB (database)
    - toEndpoints:
        - matchLabels: # MariaDB pods (database)
            k8s:io.kubernetes.pod.namespace: database
            k8s:app.kubernetes.io/name: mariadb
      toPorts:
        - ports:
            - port: "3306"
              protocol: TCP
    # SMTP relay (default)
    - toEndpoints:
        - matchLabels: # smtp-relay pods (default)
            app.kubernetes.io/name: smtp-relay
      toPorts:
        - ports:
            - port: "25"
              protocol: TCP
    # QNAP NFS storage (TrueNAS)
    - toCIDR:
        - 10.0.25.25/32
      toPorts:
        - ports:
            - port: "2049"
              protocol: TCP
    # OIDC via auth.pondi.dev (internet)
    - toFQDNs:
        - matchName: auth.pondi.dev
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
