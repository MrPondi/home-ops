---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: nextcloud
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: nextcloud-secret
    template:
      data:
        # Admin credentials
        ADMIN_USERNAME: "admin"
        ADMIN_PASSWORD: "{{ .NEXTCLOUD_ADMIN_PASSWORD }}"
        # Collabora credentials
        COLLABORA_USERNAME: "admin"
        COLLABORA_PASSWORD: "{{ .COLLABORA_ADMIN_PASSWORD }}"
        # SMTP
        SMTP_USERNAME: ""
        SMTP_PASSWORD: ""
        SMTP_HOST: smtp-relay.default.svc.cluster.local
        # Database credentials
        DB_USER: "nextcloud"
        DB_PASSWORD: "{{ .NEXTCLOUD_MARIADB_PASSWORD }}"
        # OIDC credentials
        NEXTCLOUD_OIDC_CLIENT_ID: "{{ .NEXTCLOUD_OIDC_CLIENT_ID }}"
        NEXTCLOUD_OIDC_CLIENT_SECRET: "{{ .NEXTCLOUD_OIDC_CLIENT_SECRET }}"
        # NC-Token for Homepage widget
        NEXTCLOUD_TOKEN: "{{ .NEXTCLOUD_NC_TOKEN }}"

  dataFrom:
    - extract:
        key: nextcloud
