---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: nextcloud-collabora
  annotations:
    gatus.home-operations.com/endpoint: |-
      name: collabora
spec:
  hostnames:
    - office.pondi.dev
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - name: collabora-admin
      backendRefs:
        - name: nextcloud-collabora
          namespace: default
          port: 9980
      matches:
        - path:
            value: /browser/dist/admin

    - name: collabora-general
      backendRefs:
        - name: nextcloud-collabora
          namespace: default
          port: 9980
      matches:
        - path:
            value: /
