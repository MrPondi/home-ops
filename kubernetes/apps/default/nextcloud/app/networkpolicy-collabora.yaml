---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: nextcloud-collabora
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: collabora
  ingress:
    # HTTPRoute office.pondi.dev (envoy-internal)
    - fromEndpoints:
        - matchLabels: # envoy-internal gateway pods (network)
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "9980"
              protocol: TCP
  egress:
    # WOPI to Nextcloud (default)
    - toEndpoints:
        - matchLabels: # nextcloud pods (default)
            app.kubernetes.io/name: nextcloud
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
