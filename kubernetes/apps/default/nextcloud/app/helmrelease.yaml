---
# yaml-language-server: $schema=https://github.com/fluxcd-community/flux2-schemas/raw/main/helmrelease-helm-v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nextcloud
spec:
  chartRef:
    kind: OCIRepository
    name: nextcloud
  interval: 1h
  values:
    deploymentAnnotations:
      reloader.stakater.com/auto: 'true'

    httpRoute:
      enabled: true
      annotations:
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Nextcloud
        gethomepage.dev/group: Home & Automation
        gethomepage.dev/icon: nextcloud.svg
        gethomepage.dev/description: Personal cloud storage
        gethomepage.dev/weight: "20"
        gethomepage.dev/widget.type: nextcloud
        gethomepage.dev/widget.url: https://nextcloud.pondi.dev
        gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_NEXTCLOUD_TOKEN}}"
      hostnames:
        - "{{ .Release.Name }}.pondi.dev"
      parentRefs:
        - name: envoy-internal
          namespace: network
      rules:
        - matches:
            - path:
                type: PathPrefix
                value: "/"

    nextcloud:
      host: nextcloud.pondi.dev
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: ADMIN_USERNAME
        passwordKey: ADMIN_PASSWORD
        smtpUsernameKey: SMTP_USERNAME
        smtpPasswordKey: SMTP_PASSWORD
        smtpHostKey: SMTP_HOST
      mail:
        enabled: true
        fromAddress: no-reply
        domain: pondi.dev
        smtp:
          host:
          port: 25
          secure: NONE
          authtype: NONE

      configs:
        proxy.config.php: |-
          <?php
          $CONFIG = array (
            'trusted_proxies' => array(
              0 => '127.0.0.1',
              1 => '10.42.0.0/16',
              2 => '10.43.0.0/16',
            ),
            'forwarded_for_headers' => array('HTTP_X_FORWARDED_FOR'),
          ); ?>
        misc.config.php: |-
          <?php
          $CONFIG = array (
            'default_timezone' => 'Europe/Warsaw',
            'default_phone_region' => 'PL',
            'maintenance_window_start' => 2,
            'simpleSignUpLink.shown' => false,
            'overwrite.cli.url' => 'https://nextcloud.pondi.dev',
            'overwriteprotocol' => 'https',
            'allow_local_remote_servers' => true,
          ); ?>
        oidc.config.php: |-
          <?php
          $CONFIG = array (
            'allow_user_to_change_display_name' => false,
            'lost_password_link' => 'disabled',
            'oidc_login_provider_url' => 'https://authentik.pondi.dev/application/o/nextcloud',
            'oidc_login_client_id' => getenv('NEXTCLOUD_OIDC_CLIENT_ID'),
            'oidc_login_client_secret' => getenv('NEXTCLOUD_OIDC_CLIENT_SECRET'),
            'oidc_login_auto_redirect' => true,
            'oidc_login_logout_url' => 'https://authentik.pondi.dev/application/o/nextcloud/end-session/',
            'oidc_login_end_session_redirect' => true,
            'oidc_login_default_quota' => '5368709120', // 5 GB
            'oidc_login_button_text' => 'Log in with Authentik',
            'oidc_login_hide_password_form' => true,

            // Use ID Token instead of UserInfo
            'oidc_login_use_id_token' => false,

            'oidc_login_attributes' => array (
                'id' => 'sub',
                'name' => 'name',
                'mail' => 'email',
                'quota' => 'quota',
                'groups' => 'nc-groups',
                'photoURL' => 'avatar',
                'is_admin' => 'is_admin',
                'birthdate' => 'birthdate',
            ),
            'oidc_login_scope' => 'openid email profile nextcloud',
            'oidc_login_default_group' => 'oidc',
            'oidc_login_use_external_storage' => false,
            'oidc_login_proxy_ldap' => false,
            'oidc_login_disable_registration' => false,
            'oidc_login_redir_fallback' => false,
            'oidc_login_alt_login_page' => false,
            'oidc_create_groups' => true,
            'oidc_login_webdav_enabled' => true,
            'oidc_login_password_authentication' => false,
            'oidc_login_update_avatar' => true,
            'oidc_login_code_challenge_method' => 'S256',
          ); ?>
      hooks:
        post-installation: |-
          printf "Configure NC-Token\n"
          php occ config:app:set serverinfo token --value $NEXTCLOUD_TOKEN
          printf "Add missing DB indices\n"
          php occ db:add-missing-indices
        post-upgrade: |-
          # based on https://github.com/nextcloud/all-in-one/blob/25c580bca370eaead5f1fad9d3842a9c49562dff/Containers/nextcloud/entrypoint.sh#L451-L457
          php occ maintenance:repair --include-expensive
          php occ db:add-missing-indices
          php occ db:add-missing-columns
          php occ db:add-missing-primary-keys
          yes | php occ db:convert-filecache-bigint
      extraEnv:
        - name: NEXTCLOUD_TOKEN
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: NEXTCLOUD_TOKEN
        - name: NEXTCLOUD_OIDC_CLIENT_ID
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: NEXTCLOUD_OIDC_CLIENT_ID
        - name: NEXTCLOUD_OIDC_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: nextcloud-secret
              key: NEXTCLOUD_OIDC_CLIENT_SECRET
      extraVolumes:
        - name: tmp
          EmptyDir: {}
      extraVolumeMounts:
        - name: tmp
          mountPath: "/tmp"
      podSecurityContext:
        runAsNonRoot: true
        runAsUser: 33
        runAsGroup: 33
        fsGroup: 33
        fsGroupChangePolicy: OnRootMismatch
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}

    internalDatabase:
      enabled: false
    externalDatabase:
      enabled: true
      type: mysql
      host: mariadb.database.svc.cluster.local:3306
      database: nextcloud
      existingSecret:
        enabled: true
        secretName: nextcloud-secret
        usernameKey: DB_USER
        passwordKey: DB_PASSWORD
    cronjob:
      enabled: true
      type: cronjob
      cronjob:
        securityContext:
          runAsNonRoot: true
          runAsUser: 33
          runAsGroup: 33
          fsGroup: 33
          fsGroupChangePolicy: OnRootMismatch
          readOnlyRootFilesystem: true
    persistence:
      enabled: true
      existingClaim: nextcloud
      nextcloudData:
        enabled: true
        existingClaim: nextcloud-data
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 2Gi
    startupProbe:
      enabled: true
    metrics:
      enabled: false
      serviceMonitor:
        enabled: true
