---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tar1090
spec:
  dependsOn:
    - name: external-secrets-store
      namespace: external-secrets
  interval: 1h
  path: ./kubernetes/apps/default/tar1090/app
  postBuild:
    substitute:
      APP: tar1090
      # vendored Grafana dashboard JSON uses ${DS_PROMETHEUS} placeholders;
      # flux postBuild envsubst runs strict, so the var must be defined
      DS_PROMETHEUS: prometheus
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
