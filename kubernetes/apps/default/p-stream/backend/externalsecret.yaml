---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pstream-backend
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: pstream-backend-secret
    template:
      data:
        CRYPTO_SECRET: "{{ .PSTREAM_CRYPTO_SECRET }}"
        TMDB_API_KEY: "{{ .PSTREAM_TMDB_API_KEY }}"
        TRAKT_CLIENT_ID: "{{ .PSTREAM_TRAKT_CLIENT_ID }}"
        TRAKT_CLIENT_SECRET: "{{ .PSTREAM_TRAKT_CLIENT_SECRET }}"

        # Database
        DATABASE_URL: "postgresql://pstream:{{ .PSTREAM_POSTGRES_PASSWORD }}@postgres-rw.database.svc.cluster.local"
        PG_HOST: &dbhost "postgres-rw.database.svc.cluster.local"
        PG_DB: &dbname "pstream"
        PG_USER: &dbuser "pstream"
        PG_PORT: "5432"
        PG_PASSWORD: &dbpass "{{ .PSTREAM_POSTGRES_PASSWORD  }}"

        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: pstream
    - extract:
        key: cloudnative-pg
