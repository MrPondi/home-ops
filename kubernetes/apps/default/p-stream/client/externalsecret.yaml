---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pstream
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: pstream-secret
    template:
      data:
        VITE_TMDB_READ_API_KEY: "{{ .PSTREAM_TMDB_READ_KEY }}"
        VITE_CORS_PROXY_URL: &corsproxy "http://pstream-proxy.default.svc.cluster.local"
        VITE_M3U8_PROXY_URL: *corsproxy
        VITE_NORMAL_ROUTER: "true"
        VITE_BACKEND_URL: "http://pstream-backend.default.svc.cluster.local"
        VITE_ALLOW_AUTOPLAY: "true"
        VITE_TURNSTILE_KEY: "{{ .PSTREAM_TURNSTILE_SITE_KEY }}"
        VITE_PWA_ENABLED: "true"
        VITE_APP_DOMAIN: "https://pstream.pondi.dev"
        VITE_OPENSEARCH_ENABLED: "true"
  dataFrom:
    - extract:
        key: pstream
