---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pstream-proxy
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: pstream-proxy-secret
    template:
      data:
        TURNSTILE_SECRET: "{{ .PSTREAM_TURNSTILE_SECRET_KEY }}"
        JWT_SECRET: "{{ .PSTREAM_PROXY_JWT_SECRET }}"
  dataFrom:
    - extract:
        key: pstream
