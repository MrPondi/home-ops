# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fixly-bot
spec:
  chartRef:
    kind: OCIRepository
    name: fixly-bot
  interval: 1h
  values:
    controllers:
      fixly-bot:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: "{{ .Release.Name }}-secret"
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:729da2347ce652f30476b064198577fe12e1147e58499be9f343039343ef2cee
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/FixlyBot.git /workspace
                rm -f ~/.netrc
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:a7fb1e634c4a578f9e0bd6327f11a3cde11b7a9395f48e24360c0988bcc5c2bc
            env:
              TZ: Europe/Warsaw
              PYTHONUNBUFFERED: 1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                cd /workspace
                python -m venv /venv
                /venv/bin/pip install --no-cache-dir .
                exec /venv/bin/fixlybot
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    rbac:
      roles:
        fixly-bot:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - "{{ .Release.Name }}-state"
              verbs:
                - get
                - patch
                - update
                - create
      bindings:
        fixly-bot:
          type: RoleBinding
          roleRef:
            identifier: fixly-bot
          subjects:
            - identifier: fixly-bot
    persistence:
      venv:
        type: emptyDir
        globalMounts:
          - path: /venv
      # pip-cache:
      #   existingClaim: "{{ .Release.Name }}-pip-cache"
      #   globalMounts:
      #     - path: /root/.cache/pip
      # TODO: figure out how to create this PVC without an additional file
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
