---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fixly-bot
spec:
  chartRef:
    kind: OCIRepository
    name: fixly-bot
  interval: 1h
  values:
    controllers:
      fixly-bot:
        annotations:
          reloader.stakater.com/auto: "true"
          secret.reloader.stakater.com/reload: "{{ .Release.Name }}-secret"
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.1@sha256:2306e2b05ee0ef99f5d25b0779f645b24ae9f91ba187107503592fcdfe78da3a
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/FixlyBot.git /workspace
                rm -f ~/.netrc
          uv-sync:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:aa365c22da2fb0352dd6519006c5cba870e299caa51221e3729e12ec4c09ae78
            env:
              HOME: /tmp
              UV_CACHE_DIR: /uv-cache
              UV_PROJECT_ENVIRONMENT: /uv-data/bot/venv
            command:
              - uv
            args:
              - sync
              - "--directory"
              - /workspace
              - "--locked"
              - "--no-dev"
              - "--compile-bytecode"
            resources:
              requests:
                cpu: 10m
              limits:
                # bytecode compilation spikes memory during install+compile
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:aa365c22da2fb0352dd6519006c5cba870e299caa51221e3729e12ec4c09ae78
            env:
              HOME: /tmp
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
              UV_CACHE_DIR: /uv-cache
              UV_PROJECT_ENVIRONMENT: /uv-data/bot/venv
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - uv
            args:
              - run
              - "--no-sync"
              - "--directory"
              - /workspace
              - fixlybot
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
    defaultPodOptions:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    rbac:
      roles:
        fixly-bot:
          type: Role
          rules:
            - apiGroups:
                - ""
              resources:
                - secrets
              resourceNames:
                - "{{ .Release.Name }}-state"
              verbs:
                - get
                - patch
                - update
                - create
      bindings:
        fixly-bot:
          type: RoleBinding
          roleRef:
            identifier: fixly-bot
          subjects:
            - identifier: fixly-bot
    persistence:
      uv-cache:
        type: emptyDir
        globalMounts:
          - path: /uv-cache
      uv-data:
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 2Gi
        globalMounts:
          - path: /uv-data
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
