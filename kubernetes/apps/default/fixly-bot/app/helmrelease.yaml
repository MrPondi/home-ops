---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: fixly-bot
spec:
  chartRef:
    kind: OCIRepository
    name: fixly-bot
  interval: 1h
  values:
    controllers:
      fixly-bot:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: 2.52.0@sha256:d453f54c83320412aa89c391b076930bd8569bc1012285e8c68ce2d4435826a3
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/FixlyBot.git /workspace
                rm -f ~/.netrc
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:a7185a8e40af01bf891414a4df16ef10fc6000cee460a404a13da9029fe41604
            env:
              TZ: Europe/Warsaw
              PYTHONUNBUFFERED: 1
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                cd /workspace
                python -m venv /venv
                /venv/bin/pip install --no-cache-dir .
                exec /venv/bin/fixlybot
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      venv:
        existingClaim: "{{ .Release.Name }}-venv"
        globalMounts:
          - path: /venv
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
