---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: college-timetable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: college-timetable-secret
    template:
      data:
        # --- Source 1 ---
        SYNC_1_CALDAV_URL: "{{ .SYNC_1_CALDAV_URL }}"
        SYNC_1_USERNAME: "{{ .SYNC_1_USERNAME }}"
        SYNC_1_PASSWORD: "{{ .SYNC_1_PASSWORD }}"
        SYNC_1_CALENDAR_NAME_1: "{{ .SYNC_1_CALENDAR_NAME_1 }}"
        SYNC_1_CALENDAR_NAME_2: "{{ .SYNC_1_CALENDAR_NAME_2 }}"
        SYNC_1_COURSE_ICS_ID: "{{ .SYNC_1_COURSE_ICS_ID }}"
        SYNC_1_COURSE_ICS_SELECTOR: "{{ .SYNC_1_COURSE_ICS_SELECTOR }}"
        SYNC_1_DEFAULT_LOCATION: "{{ .SYNC_1_DEFAULT_LOCATION }}"

        # --- Source 2 ---
        SYNC_2_CALDAV_URL: "{{ .SYNC_2_CALDAV_URL }}"
        SYNC_2_AUTH_METHOD: "{{ .SYNC_2_AUTH_METHOD }}"
        SYNC_2_TOKEN_FILE: "{{ .SYNC_2_TOKEN_FILE }}"
        SYNC_2_CALENDAR_NAME_1: "{{ .SYNC_2_CALENDAR_NAME_1 }}"
        SYNC_2_CALENDAR_NAME_2: "{{ .SYNC_2_CALENDAR_NAME_2 }}"
        SYNC_2_COURSE_ICS_ID: "{{ .SYNC_2_COURSE_ICS_ID }}"
        SYNC_2_COURSE_ICS_SELECTOR: "{{ .SYNC_2_COURSE_ICS_SELECTOR }}"
        SYNC_2_DEFAULT_LOCATION: "{{ .SYNC_2_DEFAULT_LOCATION }}"

        # --- Source 3 ---
        SYNC_3_CALDAV_URL: "{{ .SYNC_3_CALDAV_URL }}"
        SYNC_3_AUTH_METHOD: "{{ .SYNC_3_AUTH_METHOD }}"
        SYNC_3_TOKEN_FILE: "{{ .SYNC_3_TOKEN_FILE }}"
        SYNC_3_CALENDAR_NAME_1: "{{ .SYNC_3_CALENDAR_NAME_1 }}"
        SYNC_3_CALENDAR_NAME_2: "{{ .SYNC_3_CALENDAR_NAME_2 }}"
        SYNC_3_COURSE_ICS_ID: "{{ .SYNC_3_COURSE_ICS_ID }}"
        SYNC_3_COURSE_ICS_SELECTOR: "{{ .SYNC_3_COURSE_ICS_SELECTOR }}"
        SYNC_3_DEFAULT_LOCATION: "{{ .SYNC_3_DEFAULT_LOCATION }}"

        # Default location for events
        DEFAULT_LOCATION: "{{ .DEFAULT_LOCATION }}"

        GITHUB_TOKEN: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: college-timetable
    - extract:
        key: github
