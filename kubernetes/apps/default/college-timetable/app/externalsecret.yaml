---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: college-timetable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: college-timetable-secret
    template:
      data:
        CALDAV_URL: "{{ .CALDAV_URL }}"
        USERNAME: "{{ .USERNAME }}"
        PASSWORD: "{{ .PASSWORD }}"
        COURSE_ICS_ID: "{{ .COURSE_ICS_ID }}"
        COURSE_ICS_SELECTOR: "{{ .COURSE_ICS_SELECTOR }}"
        CALENDAR_NAME_1: "{{ .CALENDAR_NAME_1 }}"
        CALENDAR_NAME_2: "{{ .CALENDAR_NAME_2 }}"
        DEFAULT_LOCATION: "{{ .DEFAULT_LOCATION }}"
  dataFrom:
    - extract:
        key: college-timetable
