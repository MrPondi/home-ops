---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: college-timetable
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: college-timetable-secret
    template:
      data:
        CALDAV_URL: '{{ .CALDAV_URL }}'
        USERNAME: '{{ .USERNAME }}'
        PASSWORD: '{{ .PASSWORD }}'
        COURSE_ID: '{{ .COURSE_ID }}'
        CALENDAR_NAME_1: '{{ .CALENDAR_NAME_1 }}'
        CALENDAR_NAME_2: '{{ .CALENDAR_NAME_2 }}'
  dataFrom:
    - extract:
        key: college-timetable
