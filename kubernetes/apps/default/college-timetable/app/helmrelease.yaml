---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: college-timetable
spec:
  chartRef:
    kind: OCIRepository
    name: college-timetable
  interval: 1h
  values:
    controllers:
      update-lecturers:
        type: cronjob
        cronjob:
          schedule: 0 0 * * 1
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/CollegeTimetable.git /workspace
                rm -f ~/.netrc
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:58dd3a4ffd84673134e0e4ec3006477218f7a62eb15d4f94ea1f134a6011974d
            env:
              HOME: /tmp
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
              UV_CACHE_DIR: /uv-data/cache
              UV_PROJECT_ENVIRONMENT: /uv-data/venv
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - sh
              - "-ec"
            args:
              - |
                cd /workspace
                uv sync --locked --no-dev
                exec uv run --locked --no-dev populate-lecturers
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
        pod:
          restartPolicy: Never
      timetable-sync:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:832b1cd1a271509f3d5272a1a62d4cb2ab1a53426ebde1f6c2cb7349f907dc6f
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/CollegeTimetable.git /workspace
                rm -f ~/.netrc
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:58dd3a4ffd84673134e0e4ec3006477218f7a62eb15d4f94ea1f134a6011974d
            env:
              HOME: /tmp
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
              UV_CACHE_DIR: /uv-data/cache
              UV_PROJECT_ENVIRONMENT: /uv-data/venv
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - sh
              - "-ec"
            args:
              - |
                cd /workspace
                uv sync --locked --no-dev
                exec uv run --locked --no-dev college
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      # longhorn pre-formats fresh PVs with lost+found/ - env + cache live in
      # subdirectories so uv never validates the mount root as an environment
      uv-data-timetable-sync:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 2Gi
        advancedMounts:
          timetable-sync:
            app:
              - path: /uv-data
      uv-data-update-lecturers:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 2Gi
        advancedMounts:
          update-lecturers:
            app:
              - path: /uv-data
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
