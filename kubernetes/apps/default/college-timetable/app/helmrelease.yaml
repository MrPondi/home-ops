---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: college-timetable
spec:
  chartRef:
    kind: OCIRepository
    name: college-timetable
  interval: 1h
  values:
    controllers:
      update-lecturers:
        type: cronjob
        cronjob:
          schedule: 0 0 * * 1
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:4f9488b7295baec153a9953479690f835ad4699b1d9f11e3897a4485c224fc3e
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/CollegeTimetable.git /workspace
                rm -f ~/.netrc
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:cae66f2ef0ec51a9891263eeee7f987dacf0a9879e8aa9353d5606e0530619a5
            env:
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                cd /workspace
                python -m venv /venv
                /venv/bin/pip install --no-cache-dir .
                exec /venv/bin/populate-lecturers
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
      timetable-sync:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:4f9488b7295baec153a9953479690f835ad4699b1d9f11e3897a4485c224fc3e
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/CollegeTimetable.git /workspace
                rm -f ~/.netrc
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:cae66f2ef0ec51a9891263eeee7f987dacf0a9879e8aa9353d5606e0530619a5
            env:
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                cd /workspace
                python -m venv /venv
                /venv/bin/pip install --no-cache-dir .
                exec /venv/bin/college
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      venv:
        type: emptyDir
        globalMounts:
          - path: /venv
      # pip-cache:
      #   existingClaim: "{{ .Release.Name }}-pip-cache"
      #   globalMounts:
      #     - path: /root/.cache/pip
      # TODO: figure out how to create this PVC without an additional file
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
