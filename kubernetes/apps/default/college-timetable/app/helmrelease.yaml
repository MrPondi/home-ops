---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: college-timetable
spec:
  chartRef:
    kind: OCIRepository
    name: college-timetable
  interval: 1h
  values:
    controllers:
      college-timetable:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          pip-install:
            image:
              repository: python
              tag: 3.14-slim@sha256:e3782138420d9e87c16497320817db6ca8689e354d6150426dd6fc261f3fd682
            command:
              - "pip3"
              - "install"
              - "-r"
              - "/config/requirements.txt"
              - "--target"
              - "/packages"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:e3782138420d9e87c16497320817db6ca8689e354d6150426dd6fc261f3fd682
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
              - "PYTHONPATH=/packages "
              - "python3"
              - "/app/main.py"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    configMaps:
      requirements:
        data:
          requirements.txt: |-
            anyio==4.11.0
            beautifulsoup4==4.14.2
            bs4==0.0.2
            caldav==2.0.1
            certifi==2025.10.5
            charset-normalizer==3.4.4
            click==8.3.0
            colorama==0.4.6
            h11==0.16.0
            httpcore==1.0.9
            httpx==0.28.1
            icalendar==6.3.1
            idna==3.11
            lxml==6.0.2
            python-dateutil==2.9.0.post0
            recurring-ical-events==3.8.0
            requests==2.32.5
            six==1.17.0
            sniffio==1.3.1
            soupsieve==2.8
            typing-extensions==4.15.0
            tzdata==2025.2
            urllib3==2.5.0
            x-wr-timezone==2.0.1
    persistence:
      packages:
        type: emptyDir
        globalMounts:
          - path: /packages
      app:
        type: emptyDir
        globalMounts:
          - path: /app
      secret-file:
        type: secret
        name: college-timetable-secret
        globalMounts:
          - path: /app/main.py
            subPath: main.py
      requirements-file:
        type: configMap
        identifier: requirements
        globalMounts:
          - path: /config/requirements.txt
            subPath: requirements.txt
