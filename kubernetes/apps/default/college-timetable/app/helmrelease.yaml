---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: college-timetable
spec:
  chartRef:
    kind: OCIRepository
    name: college-timetable
  interval: 1h
  values:
    controllers:
      update-lecturers:
        type: cronjob
        cronjob:
          schedule: 0 0 * * 1
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          pip-install:
            image:
              repository: python
              tag: 3.14-slim@sha256:7a500125bc50693f2214e842a621440a1b1b9cbb2188f74ab045d29ed2ea5856
            command:
              - "pip3"
              - "install"
              - "--no-cache-dir"
              - "--target"
              - "/packages"
              - "beautifulsoup4"
              - "caldav>=3.0.1"
              - "httpx"
              - "icalendar"
              - "rich"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:7a500125bc50693f2214e842a621440a1b1b9cbb2188f74ab045d29ed2ea5856
            env:
              TZ: Europe/Warsaw
              PYTHONPATH: "/packages"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "python"
              - "-u"
              - "/app/populate_lecturers.py"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never

      college-timetable:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          pip-install:
            image:
              repository: python
              tag: 3.14-slim@sha256:7a500125bc50693f2214e842a621440a1b1b9cbb2188f74ab045d29ed2ea5856
            command:
              - "pip3"
              - "install"
              - "--no-cache-dir"
              - "--target"
              - "/packages"
              - "beautifulsoup4"
              - "caldav>=3.0.1"
              - "httpx"
              - "icalendar"
              - "rich"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        containers:
          app:
            image:
              repository: python
              tag: 3.14-slim@sha256:7a500125bc50693f2214e842a621440a1b1b9cbb2188f74ab045d29ed2ea5856
            env:
              TZ: Europe/Warsaw
              PYTHONPATH: "/packages"
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "python"
              - "-u"
              - "/app/sync.py"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 128Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      packages:
        type: emptyDir
        globalMounts:
          - path: /packages
      script:
        type: configMap
        name: "{{ .Release.Name }}-configmap"
        globalMounts:
          - path: /app
      tmp:
        type: emptyDir
