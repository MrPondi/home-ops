---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: college-timetable
spec:
  chartRef:
    kind: OCIRepository
    name: college-timetable
  interval: 1h
  values:
    controllers:
      update-lecturers:
        type: cronjob
        cronjob:
          schedule: 0 0 * * 1
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:03228d7ded483b0b3e55e1de7fa660d70d3e1bb432fa7021d29e192640de11aa
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-github"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/CollegeTimetable.git /workspace
                rm -f ~/.netrc
          uv-sync:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:a5a32d74ad861254268a6bc3ab066fc564c9b8ad39deea56df536f4980dc37b6
            env:
              HOME: /tmp
              UV_CACHE_DIR: /uv-cache
              UV_PROJECT_ENVIRONMENT: /uv-data/populate/venv
            command:
              - uv
            args:
              - sync
              - "--directory"
              - /workspace
              - "--locked"
              - "--no-dev"
              - "--compile-bytecode"
            resources:
              requests:
                cpu: 10m
              limits:
                # bytecode compilation spikes memory during install+compile
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:a5a32d74ad861254268a6bc3ab066fc564c9b8ad39deea56df536f4980dc37b6
            env:
              HOME: /tmp
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
              UV_CACHE_DIR: /uv-cache
              UV_PROJECT_ENVIRONMENT: /uv-data/populate/venv
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-github"
            command:
              - uv
            args:
              - run
              - "--no-sync"
              - "--directory"
              - /workspace
              - populate-lecturers
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
        pod:
          restartPolicy: Never
      timetable-sync:
        type: cronjob
        cronjob:
          schedule: 0 * * * *
          backoffLimit: 0
          concurrencyPolicy: Forbid
          successfulJobsHistory: 1
          failedJobsHistory: 1
          ttlSecondsAfterFinished: 86400
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:03228d7ded483b0b3e55e1de7fa660d70d3e1bb432fa7021d29e192640de11aa
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-github"
            command:
              - "sh"
              - "-c"
            args:
              - |
                export HOME=/tmp
                echo "machine github.com login x-access-token password $GITHUB_TOKEN" > ~/.netrc
                chmod 600 ~/.netrc
                git clone https://github.com/MrPondi/CollegeTimetable.git /workspace
                rm -f ~/.netrc
          uv-sync:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:a5a32d74ad861254268a6bc3ab066fc564c9b8ad39deea56df536f4980dc37b6
            env:
              HOME: /tmp
              UV_CACHE_DIR: /uv-cache
              UV_PROJECT_ENVIRONMENT: /uv-data/sync/venv
            command:
              - uv
            args:
              - sync
              - "--directory"
              - /workspace
              - "--locked"
              - "--no-dev"
              - "--compile-bytecode"
            resources:
              requests:
                cpu: 10m
              limits:
                # bytecode compilation spikes memory during install+compile
                memory: 512Mi
        containers:
          app:
            image:
              repository: ghcr.io/astral-sh/uv
              tag: python3.14-trixie@sha256:a5a32d74ad861254268a6bc3ab066fc564c9b8ad39deea56df536f4980dc37b6
            env:
              HOME: /tmp
              PYTHONUNBUFFERED: 1
              TZ: Europe/Warsaw
              UV_CACHE_DIR: /uv-cache
              UV_PROJECT_ENVIRONMENT: /uv-data/sync/venv
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
              - secretRef:
                  name: "{{ .Release.Name }}-github"
            command:
              - uv
            args:
              - run
              - "--no-sync"
              - "--directory"
              - /workspace
              - college
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
              limits:
                memory: 256Mi
        pod:
          restartPolicy: Never
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /data
      uv-cache:
        type: emptyDir
        globalMounts:
          - path: /uv-cache
      uv-data-timetable-sync:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 2Gi
        advancedMounts:
          timetable-sync:
            app:
              - path: /uv-data
            uv-sync:
              - path: /uv-data
      uv-data-update-lecturers:
        type: persistentVolumeClaim
        accessMode: ReadWriteOnce
        storageClass: longhorn
        size: 2Gi
        advancedMounts:
          update-lecturers:
            uv-sync:
              - path: /uv-data
            app:
              - path: /uv-data
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      tmp:
        type: emptyDir
