---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
configMapGenerator:
  - name: college-timetable-configmap
    files:
      - config.py=./resources/config.py
      - fetcher.py=./resources/fetcher.py
      - parser.py=./resources/parser.py
      - sync.py=./resources/sync.py
      - populate_lecturers.py=./resources/populate_lecturers.py
generatorOptions:
  disableNameSuffixHash: true
