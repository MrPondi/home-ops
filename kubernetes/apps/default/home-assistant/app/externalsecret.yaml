---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: home-assistant-secret
    template:
      data:
        HASS_ELEVATION: "{{ .HASS_ELEVATION }}"
        HASS_GOOGLE_PROJECT_ID: "{{ .HASS_GOOGLE_PROJECT_ID }}"
        HASS_GOOGLE_SECURE_DEVICES_PIN: "{{ .HASS_GOOGLE_SECURE_DEVICES_PIN }}"
        HASS_LATITUDE: "{{ .HASS_LATITUDE }}"
        HASS_LONGITUDE: "{{ .HASS_LONGITUDE }}"
        HASS_PIRATE_WEATHER_API_KEY: "{{ .HASS_PIRATE_WEATHER_API_KEY }}"
  dataFrom:
    - extract:
        key: home-assistant
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: home-assistant-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: home-assistant-config
    template:
      data:
        configuration.yaml: |-
          # Loads default set of integrations. Do not remove.
          default_config:

          http:
            use_x_forwarded_for: true
            trusted_proxies:
              - 127.0.0.1
              - 10.0.30.0/24
              - 10.42.0.0/16

          # Load frontend themes from the themes folder
          frontend:
            themes: !include_dir_merge_named themes

          automation: !include automations.yaml
          script: !include scripts.yaml
          scene: !include scenes.yaml

          openid:
            client_id: "{{ .HASS_OIDC_CLIENT_ID }}"
            client_secret: "{{ .HASS_OIDC_CLIENT_SECRET }}"
            authorize_url: "https://authentik.pondi.dev/application/o/authorize/"
            token_url: "http://authentik-server.security.svc.cluster.local/application/o/token/"
            user_info_url: "http://authentik-server.security.svc.cluster.local/application/o/userinfo/"
            scope: "openid profile email"
            username_field: "preferred_username"
            block_login: false
            openid_text: "Login with Authentik"
            create_user: true

          mqtt:
            sensor:
              - name: Oliwka
                state_topic: "zwave/nodeID_3/sensor_multilevel/endpoint_8/Air_temperature"
  dataFrom:
    - extract:
        key: home-assistant
