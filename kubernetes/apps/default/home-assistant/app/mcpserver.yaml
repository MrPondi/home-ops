---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: hass
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:8.2.0@sha256:dbcfc0ee8ad02d2190ebde69e5cc6167175c79608bbf1d55cff9034e256face1
  transport: streamable-http
  mcpPort: 8080
  env:
    - name: HOMEASSISTANT_URL
      value: http://home-assistant.default.svc.cluster.local:8123
    - name: HA_MCP_DISABLE_UPDATE_CHECK
      value: "true"
    - name: MCP_PORT
      value: "8080"
  secrets:
    - name: home-assistant-secret
      key: HASS_MCP_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - ha-mcp-web
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
