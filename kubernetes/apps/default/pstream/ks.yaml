---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # TEMPORARY net-new bootstrap — remove after first backup lands (just kube pg-initial-backup default pstream); recovery is the default once a backup exists
  labels:
    components.postgres/cnpg: init
  name: pstream-db
spec:
  components:
    - ../../../../components/postgres
  dependsOn:
    - name: external-secrets-store
      namespace: external-secrets
    - name: barman-cloud
      namespace: database
  healthCheckExprs:
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      failed: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'False')
      current: status.conditions.filter(e, e.type == 'Ready').all(e, e.status == 'True')
  interval: 1h
  path: ./kubernetes/apps/default/pstream/db
  postBuild:
    substitute:
      APP: pstream
      POSTGRES_STORAGE_SIZE: 5Gi
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: false
