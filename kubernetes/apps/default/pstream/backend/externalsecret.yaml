---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pstream-backend
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: pstream-backend-secret
    template:
      data:
        CRYPTO_SECRET: "{{ .PSTREAM_CRYPTO_SECRET }}"
        TMDB_API_KEY: "{{ .PSTREAM_TMDB_API_KEY }}"
        TRAKT_CLIENT_ID: "{{ .PSTREAM_TRAKT_CLIENT_ID }}"
        TRAKT_CLIENT_SECRET: "{{ .PSTREAM_TRAKT_CLIENT_SECRET }}"

        # Database
        DATABASE_URL: "postgresql://pstream:{{ .PSTREAM_POSTGRES_PASSWORD }}@postgres-rw.database.svc.cluster.local/pstream"

        INIT_POSTGRES_HOST: postgres-rw.database.svc.cluster.local
        INIT_POSTGRES_DBNAME: pstream
        INIT_POSTGRES_USER: pstream
        INIT_POSTGRES_PASS: "{{ .PSTREAM_POSTGRES_PASSWORD  }}"
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  dataFrom:
    - extract:
        key: pstream
    - extract:
        key: cloudnative-pg
