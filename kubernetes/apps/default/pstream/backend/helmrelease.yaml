---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pstream-backend
spec:
  chartRef:
    kind: OCIRepository
    name: pstream-backend
  interval: 1h
  values:
    controllers:
      pstream-backend:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          postgres-init:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.3@sha256:6fa1f331cddd2eb0b6afa7b8d3685c864127a81ab01c3d9400bc3ff5263a51cf
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
          init-metrics:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.37.0@sha256:026ed7273270ec08f6902b4ae8334c23b473e5394bec3bbbdbfe580c710d50bc
            command:
              - sh
              - -c
              - |
                for f in .metrics.json .metrics_daily.json .metrics_weekly.json .metrics_monthly.json; do
                  [ ! -f /data/$f ] && echo '{}' > /data/$f
                done
                printf "Initialized metrics files\n"
        containers:
          app:
            image:
              repository: ghcr.io/dumbutdumber/backend
              tag: latest@sha256:ca7225a7d143ef681a5336f7d36a54d3600df3520a07762528780b811ce84f43
            env:
              META_NAME: pondi-backend
              META_DESCRIPTION: "Backend for P-Stream, (Pondi Stream)."
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              readOnlyRootFilesystem: true
              allowPrivilegeEscalation: false
              capabilities: {drop: ["ALL"]}
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 3000
    serviceMonitor:
      app:
        endpoints:
          - port: http
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: services
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        advancedMounts:
          pstream-backend:
            init-metrics:
              - path: /data
            app:
              - path: /app/.metrics.json
                subPath: .metrics.json
              - path: /app/.metrics_daily.json
                subPath: .metrics_daily.json
              - path: /app/.metrics_weekly.json
                subPath: .metrics_weekly.json
              - path: /app/.metrics_monthly.json
                subPath: .metrics_monthly.json
