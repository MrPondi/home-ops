---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pstream-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: pstream-proxy
  interval: 1h
  values:
    controllers:
      pstream-proxy:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:0b5f57d22181e8b8fbe8ac5ca8754faa0d577f101b9857418f1acc43955ad464
            command:
              - "git"
              - "clone"
              - "https://github.com/MrPondi/mov-proxy.git"
              - "/workspace"
        containers:
          app:
            image:
              repository: node
              tag: 25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4
            env:
              NPM_CONFIG_PREFIX: /tmp/node
              NPM_CONFIG_AUDIT: false
              NPM_CONFIG_FUND: false
              NPM_CONFIG_UPDATE_NOTIFIER: false
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /
                    port: &port 3000
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /?destination=https://postman-echo.com/get
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            command:
              - "sh"
              - "-c"
            args:
              - |
                cd /workspace

                npx --yes pnpm@10 install
                npx --yes pnpm@10 build
                npx --yes pnpm@10 start
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: services
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      node-npm:
        type: emptyDir
        globalMounts:
          - path: /home/node/.npm
      node-local:
        type: emptyDir
        globalMounts:
          - path: /home/node/.local
      tmp:
        type: emptyDir
