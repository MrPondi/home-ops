# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pstream-proxy
spec:
  chartRef:
    kind: OCIRepository
    name: pstream-proxy
  interval: 1h
  values:
    controllers:
      pstream-proxy:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:e043be20669db13cbcfb6190192babee4cf2dca98709bb0c2d08ca2d35a0a06a
            command:
              - "git"
              - "clone"
              - "https://github.com/MrPondi/mov-proxy.git"
              - "/workspace"
        containers:
          app:
            image:
              repository: node
              tag: 25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4
            env:
              TZ: Europe/Warsaw
              NPM_CONFIG_PREFIX: /tmp/node
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - "sh"
              - "-c"
            args:
              - |
                cd /workspace

                npx --yes pnpm install
                npx --yes pnpm build
                npx --yes pnpm start
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 3000
    route:
      app:
        annotations:
          gatus.home-operations.com/endpoint: |-
            group: services
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-external
            namespace: network
    persistence:
      workspace:
        type: emptyDir
        globalMounts:
          - path: /workspace
      node-npm:
        type: emptyDir
        globalMounts:
          - path: /home/node/.npm
      node-local:
        type: emptyDir
        globalMounts:
          - path: /home/node/.local
      tmp:
        type: emptyDir
