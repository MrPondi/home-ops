# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pstream
spec:
  chartRef:
    kind: OCIRepository
    name: pstream
  interval: 1h
  values:
    controllers:
      pstream:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          1-clone:
            image:
              repository: alpine/git
              tag: v2.54.0@sha256:113d99116e236f93f0b1f53cd46dbda662cf1136d20dc9ae2834962226654d9f
            command:
              - "git"
              - "clone"
              - "-b"
              - "production"
              - "https://github.com/p-stream/p-stream.git"
              - "/workspace"
          2-build:
            image:
              repository: node
              tag: 25-alpine@sha256:bdf2cca6fe3dabd014ea60163eca3f0f7015fbd5c7ee1b0e9ccb4ced6eb02ef4
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            command:
              - sh
              - -c
              - |
                cd /workspace
                npx --yes pnpm install
                npx pnpm install
                npx pnpm build
        containers:
          app:
            image:
              repository: nginx
              tag: 1.31-alpine@sha256:20316569d8f81a160065d7d2a5eeffc7ca97d79022462ee255fd23fa103a6b5c
            env:
              TZ: Europe/Warsaw
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: 80
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: PStream
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: libremdb.png
          gethomepage.dev/description: Movie provider agregator
          gethomepage.dev/weight: "25"
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    configMaps:
      config:
        data:
          default.conf: |
            server {
                listen       80;
                server_name  _;
                root         /usr/share/nginx/html;
                index        index.html;

                location / {
                    try_files $uri $uri/ /index.html;
                }
            }
    persistence:
      workspace:
        type: emptyDir
        advancedMounts:
          pstream:
            1-clone:
              - path: /workspace
            2-build:
              - path: /workspace
            app:
              - path: /usr/share/nginx/html
                subPath: dist
      node-npm:
        type: emptyDir
        advancedMounts:
          pstream:
            2-build:
              - path: /home/node/.npm
      node-local:
        type: emptyDir
        advancedMounts:
          pstream:
            2-build:
              - path: /home/node/.local
      nginx-config:
        type: configMap
        identifier: config
        advancedMounts:
          pstream:
            app:
              - path: /etc/nginx/conf.d/default.conf
                subPath: default.conf
                readOnly: true
      nginx-cache:
        type: emptyDir
        advancedMounts:
          pstream:
            app:
              - path: /var/cache/nginx
      run:
        type: emptyDir
        advancedMounts:
          pstream:
            app:
              - path: /run
      tmp:
        type: emptyDir
