---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: kritika-secret
    template:
      data:
        KRITIKA_AUTH_ADMIN_PASSWORD: "{{ .KRITIKA_ADMIN_PASSWORD }}"
        KRITIKA_GITHUB_CLIENT_ID: "{{ .GITHUB_BOT_APP_CLIENT_ID }}"
        KRITIKA_GITHUB_PRIVATE_KEY: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
        KRITIKA_GITHUB_WEBHOOK_SECRET: "{{ .KRITIKA_WEBHOOK_SECRET }}"
  dataFrom:
    - extract:
        key: kritika
    - extract:
        key: github
  data:
    - secretKey: GITHUB_BOT_APP_PRIVATE_KEY
      remoteRef:
        key: github-bot-key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kritika-cache
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: kritika-cache
    template:
      data:
        AWS_ACCESS_KEY_ID: "{{ .KRITIKA_MINIO_ACCESS_KEY }}"
        AWS_SECRET_ACCESS_KEY: "{{ .KRITIKA_MINIO_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: kritika
