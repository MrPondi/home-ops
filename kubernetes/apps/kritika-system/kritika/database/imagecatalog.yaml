---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/postgresql.cnpg.io/imagecatalog_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: ImageCatalog
metadata:
  name: kritika-postgres
spec:
  images:
    - extensions:
        - name: vchord
          dynamic_library_path:
            - /usr/lib/postgresql/18/lib/
          extension_control_path:
            - /usr/share/postgresql/18/
          image:
            # renovate: datasource=docker depName=ghcr.io/home-operations/vchord
            reference: ghcr.io/home-operations/vchord:1.3.0@sha256:c705b2313d64370eb19d3958a32ff1c68bbd76dd015dfe0ecceae9649949965a
      # standard image ships pgvector (extension `vector`)
      # renovate: datasource=docker depName=ghcr.io/cloudnative-pg/postgresql
      image: ghcr.io/cloudnative-pg/postgresql:18.7-standard-bookworm@sha256:2643d7a683334dea20ba3171634f303eaf023605e709aa0f60ccc6aebf9fda18
      major: 18
