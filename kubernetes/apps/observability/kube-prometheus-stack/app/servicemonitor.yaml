---
apiVersion: v1
kind: Endpoints
metadata:
  name: ultrafeeder
subsets:
  - addresses:
      - ip: 192.168.1.172
    ports:
      - name: metrics
        port: 9273
      - name: metrics-extra
        port: 9274
---
apiVersion: v1
kind: Service
metadata:
  name: ultrafeeder
  labels:
    app: ultrafeeder
spec:
  ports:
    - name: metrics
      port: 9273
    - name: metrics-extra
      port: 9274
---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/monitoring.coreos.com/servicemonitor_v1.json
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: ultrafeeder
spec:
  endpoints:
    - port: metrics
    - port: metrics-extra
  jobLabel: ultrafeeder
  namespaceSelector:
    matchNames:
      - observability
  selector:
    matchLabels:
      app: ultrafeeder
