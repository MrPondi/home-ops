---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: alertmanager-secret
    template:
      data:
        BUDDY_HEARTBEAT_TOKEN: "{{ .BUDDY_HEARTBEAT_TOKEN }}"
        BUDDY_HEARTBEAT_URL: "https://{{ .BUDDY_STATUS_HOSTNAME }}/api/v1/endpoints/buddy_heartbeat/external?success=true"
        ALERTMANAGER_PUSHOVER_TOKEN: "{{ .ALERTMANAGER_PUSHOVER_TOKEN }}"
        PUSHOVER_USER_KEY: "{{ .PUSHOVER_USER_KEY }}"
  data:
    - secretKey: BUDDY_HEARTBEAT_TOKEN
      remoteRef:
        key: "384c3110-2603-43cd-a268-b36d01337691"
    - secretKey: BUDDY_STATUS_HOSTNAME
      remoteRef:
        key: "cacfa8a3-b16c-4d91-9671-b36d01376cd3"
    - secretKey: ALERTMANAGER_PUSHOVER_TOKEN
      remoteRef:
        key: "cd553d02-f8c2-4a42-b1ec-b35600a55d90"
    - secretKey: PUSHOVER_USER_KEY
      remoteRef:
        key: "7227fd59-c6db-442f-b9c8-b35600a4c7f0"
