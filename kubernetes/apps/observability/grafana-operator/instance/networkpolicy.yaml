---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    # UI grafana.pondi.dev (envoy-internal)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # operator dashboard/datasource provisioning (observability)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: grafana-operator
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # gatus probes (observability)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: gatus-sidecar
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # homepage widgets (default)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            k8s:app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # toolhive MCP gateway (ai)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: ai
            k8s:app.kubernetes.io/name: virtualmcpserver
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # prometheus datasource
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # alertmanager datasource
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # victoria-logs datasource
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    # authentik OIDC token/userinfo (security)
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: server
            k8s:app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: security
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
    # Internet (widgets, APIs)
    - toFQDNs:
        - matchName: secure.gravatar.com
        - matchName: secure.gravatar.com.observability.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
