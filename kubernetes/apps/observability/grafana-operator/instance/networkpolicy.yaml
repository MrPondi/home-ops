---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana
spec:
  endpointSelector:
    matchLabels:
      app: grafana
  ingress:
    # envoy UI grafana.pondi.dev + prometheus scrape
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
  egress:
    # prometheus datasource
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
    # alertmanager datasource
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
    # victoria-logs datasource
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: victoria-logs-single
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
    # authentik OIDC token/userinfo (security)
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: server
            k8s:app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: security
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
