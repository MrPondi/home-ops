---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanaserviceaccount_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaServiceAccount
metadata:
  name: grafana-mcp
spec:
  instanceName: grafana
  name: grafana-mcp
  role: Editor
  tokens:
    - name: vmcp
      secretName: grafana-mcp-token
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: grafana-mcp-secret-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["grafana-mcp-token"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: grafana-mcp-secret-reader
subjects:
  - kind: ServiceAccount
    name: grafana-mcp
    namespace: ai
roleRef:
  kind: Role
  name: grafana-mcp-secret-reader
  apiGroup: rbac.authorization.k8s.io
