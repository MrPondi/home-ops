---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: grafana-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: grafana-operator
  egress:
    # Grafana instance API
    - toEndpoints:
        - matchLabels:
            app: grafana
      toPorts:
        - ports:
            - port: "3000"
              protocol: TCP
    # Grafana.com API — plugins/dashboards (operator binary; wire name carries search suffix)
    - toFQDNs:
        - matchName: grafana.com
        - matchName: grafana.com.observability.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
