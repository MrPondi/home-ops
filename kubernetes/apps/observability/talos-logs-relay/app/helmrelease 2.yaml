---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app talos-logs-relay
spec:
  chartRef:
    kind: OCIRepository
    name: talos-logs-relay
  interval: 1h
  values:
    config:
      # The "kernel" service duplicates the lines that KmsgLogConfig sends.
      # dns-resolve-cache is two debug lines per host DNS query. The console
      # dashboard polls machined every second.
      filters: |
        [FILTER]
            Name grep
            Match talos
            Exclude $talos-service ^(kernel|dns-resolve-cache)$

        [FILTER]
            Name grep
            Match talos
            Logical_Op and
            Exclude $talos-service ^machined$
            Exclude $msg match\swith\sservice\s"dashboard"

        [FILTER]
            Name lua
            Match talos
            script /fluent-bit/scripts/strip_newline.lua
            call strip_newline

        [FILTER]
            Name modify
            Match talos
            Hard_rename talos-level level
            Set node ${NODE_NAME}
      # A record larger than Buffer_Size is lost. JSON escaping can grow a
      # 64KiB Talos line up to six times, and VictoriaLogs skips lines over
      # 256KiB.
      inputs: |
        [INPUT]
            Name tcp
            Alias talos
            Tag talos
            Port 6050
            Buffer_Size 256
            Chunk_Size 64
            storage.type filesystem
      # syslogd puts its message in content, not msg.
      outputs: |
        [OUTPUT]
            Name http
            Alias victorialogs
            Match talos
            Host victoria-logs.observability.svc.cluster.local
            Port 9428
            URI /insert/jsonline?_msg_field=msg,content&_time_field=talos-time&_stream_fields=node,talos-service,facility
            Format json_lines
            Json_date_key false
            Retry_Limit no_limits
            storage.total_limit_size 256M
      # Health_Check must stay off. With it on, errors from VictoriaLogs fail
      # the readiness probe, and Talos cannot hand over lines during an outage.
      # The storage limits keep a backlog under the memory limit.
      service: |
        [SERVICE]
            Flush 5
            HTTP_Server On
            storage.path /var/lib/talos-logs-relay
            storage.max_chunks_up 16
            storage.backlog.mem_limit 16M
            scheduler.cap 30
    daemonSetVolumeMounts:
      - name: data
        mountPath: /var/lib/talos-logs-relay
    # The directory is owned by root, so the container runs as root.
    daemonSetVolumes:
      - name: data
        hostPath:
          path: /var/lib/talos-logs-relay
          type: DirectoryOrCreate
    env:
      - name: NODE_NAME
        valueFrom:
          fieldRef:
            fieldPath: spec.nodeName
    extraPorts:
      - name: talos
        containerPort: 6050
        port: 6050
        protocol: TCP
    fullnameOverride: *app
    # Kernel lines end in a newline.
    luaScripts:
      strip_newline.lua: |
        function strip_newline(tag, ts, record)
          local m = record["msg"]
          if type(m) == "string" and m:sub(-1) == "\n" then
            record["msg"] = m:sub(1, -2)
            return 2, ts, record
          end
          return 0, ts, record
        end
    rbac:
      create: false
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        memory: 128Mi
    securityContext:
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]
      readOnlyRootFilesystem: true
    # talos/cluster.yaml.j2 repeats this IP, because the host network namespace
    # cannot resolve cluster DNS. The pod stamps its own node name, so each
    # node must reach its local pod.
    service:
      clusterIP: 10.43.0.60
      internalTrafficPolicy: Local
    serviceAccount:
      automountServiceAccountToken: false
      create: false
    serviceMonitor:
      enabled: true
