---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: gatus-sidecar
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gatus-sidecar
  ingress:
    # HTTPRoute {status,gatus-sidecar}.pondi.dev (envoy-external)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-external
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # Homepage status page
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: default
            k8s:app.kubernetes.io/name: homepage
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # TCP health checks to any cluster service port — no per-service touch-ups
    - toEntities:
        - cluster
      toPorts:
        - ports:
            - port: "1"
              endPort: 65535
              protocol: TCP
    # TCP health checks + ntfy alerting + external DNS resolver tcp://1.1.1.1:53 — any internet port
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "1"
              endPort: 65535
              protocol: TCP
    # External DNS resolver + connectivity checker udp://1.1.1.1:53
    - toCIDR:
        - 1.1.1.1/32
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
    # ICMP echo — icmp://1.1.1.1, 8.8.8.8, 9.9.9.9 connectivity checks
    - toEntities:
        - world
      icmps:
        - fields:
            - type: 8
              family: IPv4
