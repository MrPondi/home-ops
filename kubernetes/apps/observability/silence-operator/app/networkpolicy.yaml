---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: silence-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: silence-operator
  egress:
    # alertmanager silence API, same-ns
    - toEndpoints:
        # alertmanager pods (observability/same-ns)
        - matchLabels:
            app.kubernetes.io/name: alertmanager
      toPorts:
        - ports:
            - port: "9093"
              protocol: TCP
