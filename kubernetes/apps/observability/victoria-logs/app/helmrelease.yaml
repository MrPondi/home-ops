# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs
  interval: 1h
  values:
    global:
      image:
        registry: quay.io
    dashboards:
      enabled: true
      grafanaOperator:
        enabled: true
    server:
      fullnameOverride: victoria-logs
      persistentVolume:
        enabled: true
        storageClassName: ceph-block
        size: 50Gi
      retentionPeriod: 90d
      route:
        enabled: true
        annotations:
          gatus.home-operations.com/endpoint: |-
            name: victoria logs
            group: observability
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Victoria Logs
          gethomepage.dev/group: Monitoring & Operations
          gethomepage.dev/icon: victorialogs.svg
          gethomepage.dev/description: Log aggregation system
          gethomepage.dev/weight: "20"
          gethomepage.dev/app: victoria-logs-single
        hostnames:
          - victoria-logs.pondi.dev
        parentRefs:
          - name: envoy-internal
            namespace: network
        extraRules:
          - filters:
              - type: RequestRedirect
                requestRedirect:
                  path:
                    type: ReplaceFullPath
                    replaceFullPath: /select/vmui/
                  statusCode: 302
            matches:
              - path:
                  type: Exact
                  value: /
      serviceMonitor:
        enabled: true
