---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/grafana.integreatly.org/grafanadashboard_v1beta1.json
apiVersion: grafana.integreatly.org/v1beta1
kind: GrafanaDashboard
metadata:
  name: cilium-hubble-drops
spec:
  allowCrossNamespaceImport: true
  instanceSelector:
    matchLabels:
      dashboards: grafana
  datasources:
    - datasourceName: victorialogs
      inputName: DS_VICTORIALOGS
  configMapRef:
    name: cilium-hubble-drops-dashboard
    key: cilium-hubble-drops-dashboard.json
