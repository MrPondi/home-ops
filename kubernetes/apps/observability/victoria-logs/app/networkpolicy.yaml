---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: victoria-logs
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: victoria-logs-single
  ingress:
    # envoy UI victoria-logs.pondi.dev, grafana datasource, collector remoteWrite, prometheus scrape
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "9428"
              protocol: TCP
