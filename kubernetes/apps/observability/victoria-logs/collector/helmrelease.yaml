---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-logs-collector
spec:
  chartRef:
    kind: OCIRepository
    name: victoria-logs-collector
  interval: 1h
  values:
    fullnameOverride: victoria-logs-collector
    global:
      image:
        registry: quay.io
    podMonitor:
      enabled: true
    remoteWrite:
      - url: http://victoria-logs.observability.svc.cluster.local:9428
        maxDiskUsagePerURL: 10GB
    collector:
      streamFields:
        - kubernetes.pod_name
        - kubernetes.pod_namespace
        - kubernetes.container_name
        - kubernetes.pod_labels.app.kubernetes.io/name
    extraArgs:
      "kubernetesCollector.decolorizeFields": _msg
      # Cilium hubble exported flows on the node (rotated by the exporter)
      "fileCollector.glob": /var/run/cilium/hubble/policy-drops*.log
      "fileCollector.extraFields": '{"log_source":"cilium-hubble"}'
      # single stream per node instead of default hostname+file → stream-filterable & compress better
      "fileCollector.streamFields": hostname,log_source
      # use the flow event time, not tailing time
      "fileCollector.timeField": time
    extraVolumes:
      - name: hubble-flows
        hostPath:
          path: /var/run/cilium/hubble
          type: Directory
    extraVolumeMounts:
      - name: hubble-flows
        mountPath: /var/run/cilium/hubble
        readOnly: true
