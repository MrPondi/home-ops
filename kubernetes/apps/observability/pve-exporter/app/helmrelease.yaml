---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: pve-exporter
spec:
  chartRef:
    kind: OCIRepository
    name: pve-exporter
  interval: 1h
  values:
    controllers:
      pve-exporter:
        strategy: RollingUpdate
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/prometheus-pve/prometheus-pve-exporter
              tag: 3.9.0@sha256:78a58df7a31c9fbee94962cd06422672668529de6421892df9aed4b6cee0757f
            env:
              TZ: Europe/Warsaw
              PYTHONWARNINGS: once
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 10m
                memory: 64Mi
              limits:
                memory: 128Mi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
    service:
      app:
        ports:
          metrics:
            port: 9221
    serviceMonitor:
      app:
        enabled: true
        endpoints:
          - path: /pve
            port: metrics
            scheme: http
            params:
              cluster:
                - "1"
              module:
                - default
              node:
                - "1"
              target:
                - pve.internal
        serviceName: pve-exporter
    persistence:
      tmp:
        type: emptyDir
