---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: blackbox-exporter-lan
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus-blackbox-exporter
      app.kubernetes.io/instance: blackbox-exporter-lan
  egress:
    # NFS — qnap.internal portmapper :111 + nfs :2049 (lan-nfs tcp_connect probe)
    - toEntities:
        - world
      toPorts:
        - ports:
            - port: "111"
              protocol: TCP
            - port: "111"
              protocol: UDP
            - port: "2049"
              protocol: TCP
            - port: "2049"
              protocol: UDP
    # ICMP echo — qnap.internal lan-icmp probe
    - toEntities:
        - world
      icmps:
        - fields:
            - type: 8
              family: IPv4
