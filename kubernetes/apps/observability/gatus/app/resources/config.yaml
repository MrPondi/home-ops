---
connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

metrics: true

storage:
  type: sqlite
  caching: true
  path: ${GATUS_CONFIG_PATH}/gatus.db

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/109785648
  link: https://github.com/MrPondi
  default-sort-by: group
  buttons:
    - name: Github
      link: https://github.com/MrPondi
    - name: Homelab
      link: https://github.com/MrPondi/home-ops

web:
  port: ${GATUS_WEB_PORT}

endpoints:
  - name: Centrum Robotów
    group: business
    url: https://centrumrobotow.com
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"

  - name: Centrum Robotów Koszących
    group: business
    url: https://centrumrobotowkoszacych.pl
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
