---
web:
  port: ${GATUS_WEB_PORT}

metrics: true

ui:
  title: Status | Gatus
  header: Status
  logo: https://avatars.githubusercontent.com/u/109785648
  link: https://github.com/MrPondi

connectivity:
  checker:
    target: 1.1.1.1:53
    interval: 1m

alerting:
  discord:
    webhook-url: ${GATUS_DISCORD_WEBHOOK_URL}

endpoints:
  - name: flux-webhook
    group: external
    url: https://flux-webhook.pondi.dev
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 404"
  - name: Centrum Robotów
    group: business
    url: https://centrumrobotow.com
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
