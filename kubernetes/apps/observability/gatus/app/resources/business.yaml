---
alerting:
  ntfy:
    topic: ${BUSINESS_NTFY_TOPIC}
    default-alert:
      description: health-check failed
      failure-threshold: 3
      minimum-reminder-interval: 1h
      send-on-resolved: true
      success-threshold: 2
    priority: 4
    resolved-priority: 0
    click: https://gatus.pondi.dev

endpoints:
  - name: Centrum Robotów
    group: business
    url: https://centrumrobotow.com
    interval: 1m
    client:
      dns-resolver: tcp://1.1.1.1:53
    conditions:
      - "[STATUS] == 200"
    alerts:
      - type: ntfy

  - name: Centrum Robotów Koszących
    group: business
