---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netronome
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: netronome-secret
    template:
      data:
        NETRONOME__OIDC_ISSUER: https://auth.pondi.dev/application/o/netronome/
        NETRONOME__OIDC_CLIENT_ID: "{{ .NETRONOME_OIDC_CLIENT_ID }}"
        NETRONOME__OIDC_CLIENT_SECRET: "{{ .NETRONOME_OIDC_CLIENT_SECRET }}"
        NETRONOME__OIDC_REDIRECT_URL: https://speedtest.pondi.dev/api/auth/oidc/callback
  dataFrom:
    - extract:
        key: netronome
