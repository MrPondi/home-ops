---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: netronome-vpn
spec:
  chartRef:
    kind: OCIRepository
    name: netronome-vpn
  interval: 1h
  values:
    controllers:
      netronome-vpn:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image: &netronome-image
              repository: ghcr.io/autobrr/netronome
              tag: v0.14.1@sha256:3d7cccb5221447864a68556d7bd7c73a3ba736f1ef5157cc0904011445593aca
            args: ["agent", "--disable-system-metrics"]
            env:
              NETRONOME__AGENT_HOST: "0.0.0.0"
              NETRONOME__AGENT_PORT: &port 8200
              NETRONOME__AGENT_INTERFACE: "net1"
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: netronome-vpn-secret
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /netronome/info
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /netronome/info
                    port: *port
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            resources:
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
          vnstatd:
            image: *netronome-image
            command: ["/usr/sbin/vnstatd"]
            args: ["-n", "--alwaysadd", "--noremove"]
            env:
              TZ: Europe/Warsaw
            resources:
              requests:
                cpu: 10m
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: false
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      annotations:
        k8s.v1.cni.cncf.io/networks: |-
          [{
            "name": "vpn",
            "namespace": "kube-system",
            "ips": ["10.0.40.15/24"],
            "mac": "32:5a:7c:9e:12:f5"
          }]
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    persistence:
      vnstat:
        storageClass: longhorn
        accessMode: ReadWriteOnce
        size: 1Gi
        globalMounts:
          - path: /var/lib/vnstat
