---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: netronome-vpn
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: netronome-vpn
  ingress:
    # netronome-vpn.pondi.dev via envoy-internal
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
    # netronome server pods (observability)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: netronome
      toPorts:
        - ports:
            - port: "8200"
              protocol: TCP
