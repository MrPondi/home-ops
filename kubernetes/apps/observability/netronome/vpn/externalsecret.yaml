---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: netronome-vpn
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: netronome-vpn-secret
    template:
      data:
        NETRONOME__AGENT_API_KEY: "{{ .NETRONOME__AGENT_API_KEY }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hex-32
      rewrite:
        - regexp:
            source: "password"
            target: "NETRONOME__AGENT_API_KEY"
