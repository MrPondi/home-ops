---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: flux-operator
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: flux-operator-secret
    template:
      data:
        OIDC_CLIENT_ID: "{{ .FLUX_OPERATOR_OIDC_CLIENT_ID }}"
        OIDC_CLIENT_SECRET: "{{ .FLUX_OPERATOR_OIDC_CLIENT_SECRET }}"
  dataFrom:
    - extract:
        key: flux-operator
