---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: flux-operator
spec:
  chartRef:
    kind: OCIRepository
    name: flux-operator
  interval: 1h
  values:
    serviceMonitor:
      create: true
    web:
      config:
        baseURL: "https://flux-operator.pondi.dev"
        authentication:
          type: OAuth2
          oauth2:
            provider: OIDC
            issuerURL: "https://auth.pondi.dev/application/o/flux-operator/"
            scopes:
              - email
              - openid
              - profile
              - admin
            variables:
              - name: groups
                expression: "has(claims.admin) ? ['flux-admin'] : ['flux-user']"
            impersonation:
              username: "claims.preferred_username"
              groups: "variables.groups"
      networkPolicy:
        create: false
  valuesFrom:
    - kind: Secret
      name: flux-operator-secret
      valuesKey: OIDC_CLIENT_ID
      targetPath: web.config.authentication.oauth2.clientID
    - kind: Secret
      name: flux-operator-secret
      valuesKey: OIDC_CLIENT_SECRET
      targetPath: web.config.authentication.oauth2.clientSecret
