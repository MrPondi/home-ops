---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: github-webhook-token-secret
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: token
      remoteRef:
        key: "f22b0626-66c2-48aa-bb9e-b356016be63f"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sops-age
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: sops-age-secret
    template:
      data:
        age.agekey: "{{ .SOPS_PRIVATE_KEY }}"
  data:
    - secretKey: SOPS_PRIVATE_KEY
      remoteRef:
        key: "1b58f3de-71a0-418c-a28c-b36a00c30263"
