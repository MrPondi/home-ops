---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: konflate-webhook-token
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: konflate-webhook-token-secret
    template:
      data:
        KONFLATE_WEBHOOK_SECRET: "{{ .KONFLATE_WEBHOOK_SECRET }}"
        KONFLATE_APP_CLIENT_ID: "{{ .GITHUB_BOT_APP_CLIENT_ID }}"
        KONFLATE_APP_PRIVATE_KEY: "{{ .GITHUB_BOT_APP_PRIVATE_KEY }}"
        KONFLATE_APP_INSTALLATION_ID: "{{ .GITHUB_BOT_APP_ID }}"
        KONFLATE_TOKEN: "{{ .GITHUB_TOKEN }}"
  dataFrom:
    - extract:
        key: konflate
    - extract:
        key: github
    - secretKey: GITHUB_BOT_APP_PRIVATE_KEY
      remoteRef:
        key: github-bot-key
