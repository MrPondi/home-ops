---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: konflate
spec:
  chartRef:
    kind: OCIRepository
    name: konflate
  interval: 1h
  values:
    config:
      repo: github://MrPondi/home-ops
      statusChecks: true
      prComments: true
      publicUrl: https://{{ .Release.Name }}.pondi.dev
      mergeCommand: gh pr merge {{ .Number }} -s -d --repo {{ .Repo }}
    secret:
      existingSecret: konflate-secret
    httpRoute:
      enabled: true
      annotations:
        gatus.home-operations.com/endpoint: |-
          conditions: ["[STATUS] == 200"]
        gethomepage.dev/enabled: "true"
        gethomepage.dev/name: Konflate
        gethomepage.dev/group: Monitoring & Operations
        gethomepage.dev/icon: /icons/konflate.svg
        gethomepage.dev/description: Pull request review tool
        gethomepage.dev/weight: "40"
      parentRefs:
        - name: envoy-external
          namespace: network
      hostnames:
        - "{{ .Release.Name }}.pondi.dev"
    monitoring:
      serviceMonitor:
        enabled: true
    resources:
      requests:
        cpu: 50m
      limits:
        memory: 1Gi
