---
apiVersion: v1
kind: Namespace
metadata:
  name: _
  annotations:
    kustomize.toolkit.fluxcd.io/prune: disabled
  labels:
    resource.kubernetes.io/admin-access: "true" # permits adminAccess in DRA ResourceClaimTemplates (embed-gpu)
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {} # all pods in the namespace
  ingress:
    # Prometheus scrape (PodMonitor/ServiceMonitor) — namespace-wide, all ports; per-app CNPs must not re-declare it
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
    # ICMP Destination Unreachable from Service ClusterIPs (10.43.0.0/16) — no-backend service replies; without this CiliumPolicyIngressDrops fires
    - fromCIDR:
        - 10.43.0.0/16
      icmps:
        - fields:
            - type: 3
              family: IPv4
  egress:
    # DNS to kube-dns pods (kube-system) — namespace-wide allow, per-app CNPs no longer carry it
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: kube-system
            k8s:k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: UDP
            - port: "53"
              protocol: TCP
          rules:
            dns:
              - matchPattern: "*"
    # Kubernetes API — namespace-wide allow (RBAC-gated), per-app CNPs no longer carry it
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
