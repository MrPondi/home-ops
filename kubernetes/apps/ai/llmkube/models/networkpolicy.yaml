---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name embed
spec:
  endpointSelector:
    matchExpressions:
      - key: inference.llmkube.dev/model
        operator: Exists
  ingress:
    # LLMKube operator pods
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: llmkube
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # LiteLLM proxy pods
    - fromEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/name: litellm
            k8s:io.kubernetes.pod.namespace: ai
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # HuggingFace (api + CDN; '**.' matches subdomains at any depth, incl. search-suffixed wire names)
    - toFQDNs:
        - matchName: huggingface.co
        - matchName: huggingface.co.ai.svc.cluster.local
        - matchPattern: "**.huggingface.co"
        - matchPattern: "**.huggingface.co.ai.svc.cluster.local"
        - matchPattern: "**.hf.co"
        - matchPattern: "**.hf.co.ai.svc.cluster.local"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
