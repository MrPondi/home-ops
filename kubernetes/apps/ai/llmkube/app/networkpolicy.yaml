---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name llmkube-operator
spec:
  endpointSelector:
    matchLabels:
      control-plane: controller-manager # llmkube controller pods (ai)
  ingress:
    # Admission webhook from kube-apiserver (host-networked)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # All llmkube InferenceService runtime pods
    - toEndpoints:
        - matchExpressions:
            - key: inference.llmkube.dev/model
              operator: Exists
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # HuggingFace (api + CDN; '**.' matches subdomains at any depth, incl. search-suffixed wire names)
    - toFQDNs:
        - matchName: huggingface.co
        - matchName: huggingface.co.ai.svc.cluster.local
        - matchPattern: "**.huggingface.co"
        - matchPattern: "**.huggingface.co.ai.svc.cluster.local"
        - matchPattern: "**.hf.co"
        - matchPattern: "**.hf.co.ai.svc.cluster.local"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
