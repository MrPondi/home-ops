---
apiVersion: inference.llmkube.dev/v1alpha1
kind: InferenceService
metadata:
  name: embed-1
  labels:
    krr/ignore: "true"
spec:
  modelRef: embed
  runtime: llamacpp
  image: docker.io/kyuz0/amd-strix-halo-toolboxes:rocm-6.4.4@sha256:1c655ca0443655f2e7603d054770b07cd8c79267145728b3261295f005053947
  rolloutPolicy:
    waitForIdle: false
    idleTimeoutSeconds: 86400
  replicas: 1
  priority: normal
  podLabels:
    gpu-inference: "true"
    embed-pool: "true"
  contextSize: 32768
  parallelSlots: 32
  flashAttention: true
  batchSize: 2048
  uBatchSize: 2048
  env:
    - name: HSA_OVERRIDE_GFX_VERSION
      value: "11.5.1" # Radeon 8060S iGPU (gfx1151)
    - name: GGML_HIP_ENABLE_UNIFIED_MEMORY
      value: "1"
  resources:
    cpu: "2"
    memory: 16Gi
  mode: embedding
  extraArgs:
    - --alias
    - embed
    - --cont-batching
    - --cache-ram
    - "0"
    - --kv-unified
    - --load-mode
    - mmap
  endpoint:
    port: 8080
    type: ClusterIP
  probeOverrides:
    startup:
      httpGet:
        path: /health
        port: 8080
      periodSeconds: 10
      failureThreshold: 360
    liveness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 30
      periodSeconds: 30
      failureThreshold: 6
    readiness:
      httpGet:
        path: /health
        port: 8080
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 6
