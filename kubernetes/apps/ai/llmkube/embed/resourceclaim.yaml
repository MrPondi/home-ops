---
# ResourceClaimTemplate backed by the AMD iGPU DRA device class (amd-gpu-resource-driver, kube-system)
apiVersion: resource.k8s.io/v1
kind: ResourceClaimTemplate
metadata:
  name: embed-gpu
spec:
  spec:
    devices:
      requests:
        - name: gpu
          exactly:
            deviceClassName: gpu.amd.com
            adminAccess: true
            allocationMode: All
