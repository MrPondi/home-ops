---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: litellm-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # SSO
        GENERIC_CLIENT_ID: "{{ .LITELLM_OIDC_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .LITELLM_OIDC_CLIENT_SECRET }}"
        GENERIC_AUTHORIZATION_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/authorize/"
        GENERIC_TOKEN_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/token/"
        GENERIC_USERINFO_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/userinfo/"
  dataFrom:
    - extract:
        key: litellm
