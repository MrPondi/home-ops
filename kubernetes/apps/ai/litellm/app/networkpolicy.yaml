---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name litellm-operator
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # Admission webhook from kube-apiserver (host-networked)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
  egress:
    # Kubernetes API
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
