---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: litellm-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        LITELLM_SALT_KEY: "{{ .LITELLM_SALT_KEY }}"

        # AI provider credentials
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
        GEMINI_API_KEY: "{{ .AISTUDIO_API_KEY }}"

        # SSO
        GENERIC_CLIENT_ID: "{{ .LITELLM_OIDC_CLIENT_ID }}"
        GENERIC_CLIENT_SECRET: "{{ .LITELLM_OIDC_CLIENT_SECRET }}"
        GENERIC_AUTHORIZATION_ENDPOINT: "https://auth.pondi.dev/application/o/authorize/"
        GENERIC_TOKEN_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/token/"
        GENERIC_USERINFO_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/userinfo/"
        GENERIC_SCOPE: "openid email profile litellm_role"
        GENERIC_USER_ROLE_ATTRIBUTE: "litellm_role"
        PROXY_LOGIN_URL: "https://auth.pondi.dev/application/o/litellm/end-session/"
  dataFrom:
    - extract:
        key: litellm
