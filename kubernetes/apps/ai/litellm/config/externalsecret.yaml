---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: litellm-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        OPENCODE_API_KEY: "{{ .OPENCODE_API_KEY }}"
        GEMINI_API_KEY: "{{ .AISTUDIO_API_KEY }}"

        # # DB
        # DATABASE_URL: "postgresql://litellm:{{ .LITELLM_POSTGRES_PASSWORD }}@postgres-rw.database.svc.cluster.local/litellm"
        # INIT_POSTGRES_HOST: "postgres-rw.database.svc.cluster.local"
        # INIT_POSTGRES_DBNAME: "litellm"
        # INIT_POSTGRES_USER: "litellm"
        # INIT_POSTGRES_PASS: "{{ .LITELLM_POSTGRES_PASSWORD }}"
        # INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # # SSO
        # GENERIC_CLIENT_ID: "{{ .LITELLM_OIDC_CLIENT_ID }}"
        # GENERIC_CLIENT_SECRET: "{{ .LITELLM_OIDC_CLIENT_SECRET }}"
        # GENERIC_AUTHORIZATION_ENDPOINT: "https://auth.pondi.dev/application/o/authorize/"
        # GENERIC_TOKEN_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/token/"
        # GENERIC_USERINFO_ENDPOINT: "http://authentik-server.security.svc.cluster.local/application/o/userinfo/"
  dataFrom:
    - extract:
        key: litellm
