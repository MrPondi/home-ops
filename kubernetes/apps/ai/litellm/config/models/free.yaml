---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name deepseek-v4-flash-free
spec:
  modelName: *name
  params:
    model: openai/deepseek-v4-flash-free
    apiBase: https://opencode.ai/zen/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENCODE_API_KEY
  info:
    mode: chat
    maxTokens: 384000
    maxInputTokens: 1048560
    maxOutputTokens: 384000
    supportsFunctionCalling: true
    supportsPromptCaching: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name big-pickle-free
spec:
  modelName: *name
  params:
    model: openai/big-pickle
    apiBase: https://opencode.ai/zen/v1
    apiKeyRef:
      name: litellm-secret
      key: OPENCODE_API_KEY
  info:
    mode: chat
    maxTokens: 32000
    maxInputTokens: 200000
    maxOutputTokens: 32000
    supportsFunctionCalling: true
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name gemini-3.1-flash-lite
spec:
  modelName: *name
  params:
    model: gemini/gemini-3.1-flash-lite
    apiKeyRef:
      name: litellm-secret
      key: GEMINI_API_KEY
