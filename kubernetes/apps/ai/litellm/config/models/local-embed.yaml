---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name embed-pool-1
  labels:
    litellm.home-operations.com/managed-by: flux # keep the auto-projector off this owner-managed model
spec:
  modelName: embed
  proxyRef: litellm
  params:
    model: openai/embed
    apiBase: http://embed-1.ai:8080/v1
    apiKey: sk-llmkube-noauth # llama.cpp ignores auth; placeholder to satisfy the openai client
  info:
    mode: embedding
    maxInputTokens: 32768
