---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmmodel_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMModel
metadata:
  name: &name glm-5.3-flash
spec:
  modelName: *name
  proxyRef: litellm
  params:
    model: openai/glm-5.3-flash
    apiBase: https://opencode.ai/zen/go/v1
    apiKey: os.environ/OPENCODE_API_KEY
  info:
    mode: chat
    maxInputTokens: 1048576
    maxOutputTokens: 128000
    supportsFunctionCalling: true
    supportsPromptCaching: true
    supportsVision: true
    extra:
      input_cost_per_token: 0.075e-06
      output_cost_per_token: 0.25e-06
      cache_creation_input_token_cost: 0.0e-06
      cache_read_input_token_cost: 0.03e-06
