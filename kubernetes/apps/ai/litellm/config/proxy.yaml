---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/litellm.home-operations.com/litellmproxy_v1alpha1.json
apiVersion: litellm.home-operations.com/v1alpha1
kind: LiteLLMProxy
metadata:
  name: litellm
spec:
  # renovate: datasource=docker depName=ghcr.io/berriai/litellm
  image: ghcr.io/berriai/litellm:v1.101.0@sha256:d295634e09c648dcdb72c4cc2dd226f5fb87823a73e88cbbed6f205e4deb044b
  replicas: 1
  generalSettings:
    health_check_endpoint: /v1/health
    store_model_in_db: false
  podAnnotations:
    reloader.stakater.com/auto: "true"
  routerSettings:
    routing_strategy: simple-shuffle
    redis_host: os.environ/REDIS_HOST
    redis_port: os.environ/REDIS_PORT
    num_retries: 3
    timeout: 600
  litellmSettings:
    success_callback:
      - prometheus
    failure_callback:
      - prometheus
    prometheus_adapter: true
    require_auth_for_metrics_endpoint: false
    cache: true
    cache_params:
      type: redis
      host: litellm-dragonfly.ai.svc.cluster.local
      port: 6379
    drop_params: true
    merge_reasoning_content_in_choices: true
  env:
    - name: LITELLM_LOG
      value: INFO
    - name: LITELLM_MODE
      value: PRODUCTION
    - name: PROXY_BASE_URL
      value: "https://litellm.pondi.dev"
    - name: AUTO_REDIRECT_UI_LOGIN_TO_SSO
      value: "true"
  envFrom:
    - secretRef:
        name: litellm-secret
  apiAccess:
    masterKeyRef:
      name: litellm-secret
      key: LITELLM_MASTER_KEY
  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 2Gi
  service:
    type: ClusterIP
    port: 4000
  route:
    hostnames:
      - litellm.pondi.dev
    parentRefs:
      - name: envoy-internal
        namespace: network
    filters:
      - type: RequestHeaderModifier
        requestHeaderModifier:
          set:
            - name: x-litellm-session-id
              value: "%REQ(x-session-id)%"
