---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/clustersecretstore_v1.json
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: litellm-keys
spec:
  provider:
    kubernetes:
      remoteNamespace: ai
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          namespace: ai
          key: ca.crt
      auth:
        serviceAccount:
          name: litellm-key-reader
          namespace: ai
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/core/serviceaccount_v1.json
apiVersion: v1
kind: ServiceAccount
metadata:
  name: litellm-key-reader
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/role_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: litellm-key-reader
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    # LLM virtual key secrets generated by the litellm operator; kept explicit
    # because RBAC resourceNames cannot glob `litellm-key-*`.
    resourceNames: ["litellm-key-toolhive"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["selfsubjectrulesreviews"]
    verbs: ["create"]
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/rbac.authorization.k8s.io/rolebinding_v1.json
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: litellm-key-reader
subjects:
  - kind: ServiceAccount
    name: litellm-key-reader
roleRef:
  kind: Role
  name: litellm-key-reader
  apiGroup: rbac.authorization.k8s.io
