---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mcp-gateway
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: *name
      app.kubernetes.io/name: virtualmcpserver
  ingress:
    # HTTPRoute mcp.pondi.dev (envoy-internal)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    # Prometheus PodMonitor
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Session storage (dragonfly)
    - toEndpoints:
        - matchLabels:
            app: ${APP}-dragonfly
            app.kubernetes.io/name: dragonfly
            app.kubernetes.io/part-of: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Kubernetes API (MCP backend discovery)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Local MCPServer proxies
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
    # OIDC upstream authentik via auth.pondi.dev (envoy-internal; backend port 10443)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name mcp-gateway-internal
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/instance: *name
      app.kubernetes.io/name: virtualmcpserver
  ingress:
    # open-webui (tool server)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: open-webui
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    # hermes (tool server)
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: hermes
      toPorts:
        - ports:
            - port: "4483"
              protocol: TCP
    # Prometheus PodMonitor
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Session storage (dragonfly)
    - toEndpoints:
        - matchLabels:
            app: ${APP}-dragonfly
            app.kubernetes.io/name: dragonfly
            app.kubernetes.io/part-of: dragonfly
      toPorts:
        - ports:
            - port: "6379"
              protocol: TCP
    # Kubernetes API (MCP backend discovery)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "6443"
              protocol: TCP
    # Local MCPServer proxies
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
