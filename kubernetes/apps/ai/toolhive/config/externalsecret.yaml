---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/sshkey_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: SSHKey
metadata:
  name: signing-key
spec:
  keyType: "rsa"
  keySize: 2048
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: toolhive-secret
    template:
      data:
        TOOLHIVE_OIDC_CLIENT_ID: "{{ .TOOLHIVE_OIDC_CLIENT_ID }}"
        TOOLHIVE_OIDC_CLIENT_SECRET: "{{ .TOOLHIVE_OIDC_CLIENT_SECRET }}"
        AUTH_SIGNING_KEY: "{{ .AUTH_SIGNING_KEY }}"
        AUTH_HMAC_KEY: "{{ .AUTH_HMAC_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: base64-32
      rewrite:
        - regexp:
            source: "password"
            target: "AUTH_HMAC_KEY"
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: SSHKey
          name: signing-key
      rewrite:
        - regexp:
            source: "privateKey"
            target: "AUTH_SIGNING_KEY"
