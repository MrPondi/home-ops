---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: toolhive-secret
    template:
      data:
        # TOOLHIVE_OIDC_CLIENT_ID: "{{ .TOOLHIVE_OIDC_CLIENT_ID }}"
        # TOOLHIVE_OIDC_CLIENT_SECRET: "{{ .TOOLHIVE_OIDC_CLIENT_SECRET }}"
        AUTH_SIGNING_KEY: "{{ .AUTH_SIGNING_KEY }}"
        AUTH_HMAC_KEY: "{{ .AUTH_HMAC_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
  data:
    - secretKey: AUTH_SIGNING_KEY
      remoteRef:
        key: toolhive-signing-key
