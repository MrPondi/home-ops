---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/generators.external-secrets.io/password_v1alpha1.json
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: toolhive-hmac
spec:
  length: 32
  allowRepeat: true
  noUpper: false
  encoding: base64
  secretKeys:
    - AUTH_HMAC_KEY
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: toolhive-secret
    template:
      data:
        TOOLHIVE_OIDC_CLIENT_ID: "{{ .TOOLHIVE_OIDC_CLIENT_ID }}"
        TOOLHIVE_OIDC_CLIENT_SECRET: "{{ .TOOLHIVE_OIDC_CLIENT_SECRET }}"
        AUTH_HMAC_KEY: "{{ .AUTH_HMAC_KEY }}"
  dataFrom:
    - extract:
        key: toolhive
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: toolhive-hmac
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-embed
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: litellm-keys
  target:
    name: toolhive-embed-secret
  data:
    - secretKey: api-key
      remoteRef:
        key: litellm-key-toolhive
        property: api-key
