---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name seerr
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  ingress:
    # Proxy runner -> server
    - fromEndpoints:
        - matchLabels:
            toolhive-name: seerr
            app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
  egress:
    # Seerr (media namespace)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: seerr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: seerr-proxy-runner
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: &name seerr
      app.kubernetes.io/name: mcpserver
  egress:
    # Proxy runner -> MCP server
    - toEndpoints:
        - matchLabels:
            toolhive-name: *name
            app: *name
      toPorts:
        - ports:
            - port: "8085"
              protocol: TCP
