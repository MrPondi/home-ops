---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: jellyfin
spec:
  image: ghcr.io/jaredtrent/jellyfin-mcp:2026.924.1@sha256:47877d8cf5282a3dea35c2bfa4b8331ea4cb543093091a37a27aa834cbbab2a0
  transport: stdio
  proxyPort: 8080
  # Bare "--" ends flag parsing so the image CMD (--http ...) is replaced
  # with no flags and the binary runs its stdio default (per upstream Dockerfile).
  args:
    - --
  env:
    - name: JELLYFIN_URL
      value: http://jellyfin.media.svc.cluster.local:8096
  secrets:
    - name: toolhive-jellyfin-secret
      key: JELLYFIN_API_KEY
  groupRef:
    name: mcp-tools
