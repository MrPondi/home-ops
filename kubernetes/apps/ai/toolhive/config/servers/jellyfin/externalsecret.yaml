---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-jellyfin
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: toolhive-jellyfin-secret
    template:
      data:
        JELLYFIN_API_KEY: "{{ .JELLYFIN_MCP_API_KEY }}"
  dataFrom:
    - extract:
        key: jellyfin
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-jellyfin-http-token
spec:
  refreshPolicy: OnChange
  target:
    name: toolhive-jellyfin-http-token-secret
    template:
      data:
        JELLYFIN_MCP_HTTP_TOKEN: "{{ .JELLYFIN_MCP_HTTP_TOKEN }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hex-32
      rewrite:
        - regexp:
            source: "password"
            target: "JELLYFIN_MCP_HTTP_TOKEN"
