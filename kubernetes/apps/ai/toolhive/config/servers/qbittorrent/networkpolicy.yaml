---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name qbittorrent
spec:
  # qBittorrent MCP server pod (ai)
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  # No ingress - stdio transport binds no TCP port; proxy runner attaches via kube API
  egress:
    # qBittorrent WebUI (media) - QBT_WEBUI_PORT=80 in media/qbittorrent/app/helmrelease.yaml so pod port == service port
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: qbittorrent
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
