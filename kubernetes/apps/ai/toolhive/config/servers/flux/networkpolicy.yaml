---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name flux
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  ingress:
    # Proxy runner -> server
    - fromEndpoints:
        - matchLabels:
            toolhive-name: flux
            app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-proxy-runner
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: &name flux
      app.kubernetes.io/name: mcpserver
  egress:
    # Proxy runner -> MCP server
    - toEndpoints:
        - matchLabels:
            toolhive-name: *name
            app: *name
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
