---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.60.0@sha256:9940c2c46c1bff5af3827cb76f28a1ff347ea8141ed1af42e66ffbd79e8c4bdb
  transport: streamable-http
  mcpPort: 8000
  serviceAccount: flux-mcp
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
          env:
            # In-cluster mode: no KUBECONFIG; uses the pod service account.
            - name: RUNTIME_NAMESPACE
              value: flux-system
            # Disable the proxyrunner's update checks / usage metrics
            - name: TOOLHIVE_SKIP_UPDATE_CHECK
              value: "true"
  groupRef:
    name: mcp-tools
