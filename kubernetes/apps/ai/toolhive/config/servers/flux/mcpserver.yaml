---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.63.0@sha256:d0700196e3e89bf35bc3b375ff72dc11e23dd82c0050957f5c54b72bbf81fa0a
  transport: streamable-http
  mcpPort: 8000
  serviceAccount: flux-mcp
  env:
    # In-cluster mode: no KUBECONFIG; uses the pod service account.
    - name: RUNTIME_NAMESPACE
      value: flux-system
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
  groupRef:
    name: mcp-tools
