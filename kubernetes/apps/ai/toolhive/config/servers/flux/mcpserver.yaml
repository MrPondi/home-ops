---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.62.0@sha256:a1f3fdc03a6ca1ac9960dec8d60cef99337aa2af59f47c257be7c8334fdca82d
  transport: streamable-http
  mcpPort: 8000
  serviceAccount: flux-mcp
  env:
    # In-cluster mode: no KUBECONFIG; uses the pod service account.
    - name: RUNTIME_NAMESPACE
      value: flux-system
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
  groupRef:
    name: mcp-tools
