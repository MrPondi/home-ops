---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: flux
spec:
  image: ghcr.io/controlplaneio-fluxcd/flux-operator-mcp:v0.61.0@sha256:b253ef07502413bcad89d8fb8f9c01d3cfa070331698323fbd8fe0ae9cfa1cb4
  transport: streamable-http
  mcpPort: 8000
  serviceAccount: flux-mcp
  env:
    # In-cluster mode: no KUBECONFIG; uses the pod service account.
    - name: RUNTIME_NAMESPACE
      value: flux-system
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          args:
            - serve
            - --transport=http
            - --port=8000
  groupRef:
    name: mcp-tools
