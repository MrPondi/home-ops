---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserverentry_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServerEntry
metadata:
  name: cloudflare
spec:
  remoteUrl: https://mcp.cloudflare.com/mcp
  transport: streamable-http
  headerForward:
    addHeadersFromSecret:
      - headerName: Authorization
        valueSecretRef:
          key: CLOUDFLARE_API_TOKEN
          name: toolhive-cloudflare-secret
  groupRef:
    name: mcp-tools
