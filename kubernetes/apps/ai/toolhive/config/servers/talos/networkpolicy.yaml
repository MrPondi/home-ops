---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name talos
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  ingress:
    # Proxy runner -> server
    - fromEndpoints:
        - matchLabels:
            toolhive-name: talos
            app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
  egress:
    # Talos node API (apid)
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: talos-proxy-runner
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: &name talos
      app.kubernetes.io/name: mcpserver
  egress:
    # Proxy runner -> MCP server
    - toEndpoints:
        - matchLabels:
            toolhive-name: *name
            app: *name
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
