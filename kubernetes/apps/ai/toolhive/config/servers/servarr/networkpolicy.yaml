---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name servarr
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  egress:
    # Sonarr (media namespace)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Radarr (media namespace)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Prowlarr (media namespace)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: prowlarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
