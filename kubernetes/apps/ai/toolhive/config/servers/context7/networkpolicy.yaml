---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: context7-mcp
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
  egress:
    # Internet (mcp.context7.com)
    - toFQDNs:
        - matchName: mcp.context7.com
        - matchName: mcp.context7.com.ai.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
