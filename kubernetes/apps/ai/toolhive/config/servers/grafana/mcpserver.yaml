---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: docker.io/grafana/mcp-grafana:1.4.2@sha256:f87fa67a561f7b3deb412402887117bd1e9f1f7a8695935d27c498543ab3458b
  transport: streamable-http
  mcpPort: 8000
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
    - name: GRAFANA_ORG_ID
      value: "1"
    - name: TOOLHIVE_SKIP_UPDATE_CHECK
      value: "true"
  secrets:
    - name: grafana-mcp-token
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  args:
    - --transport
    - streamable-http
    - --address
    - 0.0.0.0:8000
    - --allowed-hosts
    - "*"
  serviceAccount: grafana-mcp
  groupRef:
    name: mcp-tools
