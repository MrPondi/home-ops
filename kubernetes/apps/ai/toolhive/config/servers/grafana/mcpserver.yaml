---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: docker.io/grafana/mcp-grafana:2.2.0@sha256:697336440e34878f8e0b26a69675db8d7e97b4d0daec25ec5441c85ac6c60e81
  transport: streamable-http
  mcpPort: 8000
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
    - name: GRAFANA_ORG_ID
      value: "1"
    - name: GRAFANA_USAGE_STATS
      value: disabled
  secrets:
    - name: grafana-mcp-token
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  args:
    - --transport
    - streamable-http
    - --address
    - 0.0.0.0:8000
    - --allowed-hosts
    - "*"
  serviceAccount: grafana-mcp
  groupRef:
    name: mcp-tools
