---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: grafana
spec:
  image: docker.io/grafana/mcp-grafana:1.6.3@sha256:0479c026fd40a95e6a176855b8570e06845790f8a45de2f9c1ec8ba3ba06a8bf
  transport: streamable-http
  mcpPort: 8000
  env:
    - name: GRAFANA_URL
      value: http://grafana-service.observability.svc.cluster.local:3000
    - name: GRAFANA_ORG_ID
      value: "1"
  secrets:
    - name: grafana-mcp-token
      key: token
      targetEnvName: GRAFANA_SERVICE_ACCOUNT_TOKEN
  args:
    - --transport
    - streamable-http
    - --address
    - 0.0.0.0:8000
    - --allowed-hosts
    - "*"
  serviceAccount: grafana-mcp
  groupRef:
    name: mcp-tools
