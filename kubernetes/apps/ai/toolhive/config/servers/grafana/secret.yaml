---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/secretstore_v1.json
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: grafana-mcp
spec:
  provider:
    kubernetes:
      remoteNamespace: observability
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: grafana-mcp
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-mcp-token
spec:
  secretStoreRef:
    kind: SecretStore
    name: grafana-mcp
  target:
    name: grafana-mcp-token
    creationPolicy: Owner
  data:
    - secretKey: token
      remoteRef:
        key: grafana-mcp-token
        property: token
