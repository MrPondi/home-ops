---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: authentik
spec:
  image: ghcr.io/samik081/mcp-authentik:0.9.0@sha256:d85b49670d7f619b1c37c6bc8b149784c3171fc37a9e1bf3a5837eb3e547434c
  transport: stdio
  proxyPort: 8080
  env:
    - name: AUTHENTIK_URL
      value: http://authentik-server.security.svc.cluster.local
    - name: AUTHENTIK_ACCESS_TIER
      value: read-only
  secrets:
    - name: toolhive-authentik-secret
      key: AUTHENTIK_TOKEN
  groupRef:
    name: mcp-tools
