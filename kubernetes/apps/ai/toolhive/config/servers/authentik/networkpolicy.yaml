---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name authentik
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  egress:
    # authentik OIDC token/userinfo (security)
    - toEndpoints:
        - matchLabels:
            k8s:app.kubernetes.io/component: server
            k8s:app.kubernetes.io/name: authentik
            k8s:io.kubernetes.pod.namespace: security
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
