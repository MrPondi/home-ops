---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name prometheus
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  ingress:
    # Proxy runner -> server
    - fromEndpoints:
        - matchLabels:
            toolhive-name: prometheus
            app.kubernetes.io/name: mcpserver
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
  egress:
    # Prometheus
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "9090"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: prometheus-proxy-runner
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: &name prometheus
      app.kubernetes.io/name: mcpserver
  egress:
    # Proxy runner -> MCP server
    - toEndpoints:
        - matchLabels:
            toolhive-name: *name
            app: *name
      toPorts:
        - ports:
            - port: "8000"
              protocol: TCP
