---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name github
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  egress:
    # Internet (api.github.com)
    - toFQDNs:
        - matchName: api.github.com
        - matchName: api.github.com.ai.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
