---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name konflate
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: virtualmcpserver
  egress:
    # Konflate (flux-system)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: flux-system
            k8s:app.kubernetes.io/name: konflate
      toPorts:
        - ports:
            - port: "8080"
              protocol: TCP
