---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: minio-mcp
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: &name minio
      app: *name
  egress:
    # QNAP MinIO S3 (direct)
    - toCIDR:
        - 10.0.25.25/32
      toPorts:
        - ports:
            - port: "9000"
              protocol: TCP
