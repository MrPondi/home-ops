---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: toolhive-minio
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: toolhive-minio-secret
    template:
      data:
        MINIO_ACCESS_KEY: "{{ .MINIO_MCP_ACCESS_KEY }}"
        MINIO_SECRET_KEY: "{{ .MINIO_MCP_SECRET_KEY }}"
  dataFrom:
    - extract:
        key: minio
