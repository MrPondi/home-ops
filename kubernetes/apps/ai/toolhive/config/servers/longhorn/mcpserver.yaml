---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: longhorn
spec:
  image: ghcr.io/rafaelgaspar/longhorn-mcp:0.1.7@sha256:8116b3fa07ae5bb9506e439a92cdb49312d1a32d761bffd53a6bd523becdc5f8
  transport: streamable-http
  mcpPort: 3000
  env: []
  args:
    - node
    - dist/index.js
    - --http
    - --port
    - "3000"
    - --read-only
    - --longhorn-url
    - http://longhorn-backend.longhorn-system.svc.cluster.local:9500
    - --allowed-hosts
    - localhost,127.0.0.1,mcp-longhorn,mcp-longhorn-headless,mcp-longhorn.ai.svc.cluster.local,mcp-longhorn-headless.ai.svc.cluster.local
  groupRef:
    name: mcp-tools
