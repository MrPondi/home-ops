---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name longhorn
spec:
  # Longhorn MCP server pod (ai)
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  # No ingress - stdio transport binds no TCP port; proxy runner attaches via kube API
  egress:
    # Longhorn manager pods (longhorn-system) - label verified via longhorn-system/longhorn/app/networkpolicy.yaml podSelector app: longhorn-manager
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: longhorn-system
            k8s:app: longhorn-manager
      toPorts:
        - ports:
            - port: "9500"
              protocol: TCP
