---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: unifi-network
spec:
  image: ghcr.io/sirkirby/unifi-network-mcp:0.29.7@sha256:3307ada7db311203ea1802993bf3fcc022d14966434c4b740e7d0a8e3351ca72
  transport: streamable-http
  mcpPort: 3000
  env:
    - name: UNIFI_NETWORK_HOST
      value: 192.168.1.1
    - name: UNIFI_NETWORK_SITE
      value: default
    - name: UNIFI_VERIFY_SSL
      value: "false"
    - name: UNIFI_MCP_HTTP_ENABLED
      value: "true"
    - name: UNIFI_MCP_HTTP_TRANSPORT
      value: streamable-http
    - name: UNIFI_MCP_HOST
      value: 0.0.0.0
    - name: UNIFI_MCP_PORT
      value: "3000"
    - name: UNIFI_MCP_ENABLE_DNS_REBINDING_PROTECTION
      value: "false"
    - name: UNIFI_TOOL_REGISTRATION_MODE
      value: meta_only
    - name: UNIFI_POLICY_CREATE
      value: "false"
    - name: UNIFI_POLICY_UPDATE
      value: "false"
    - name: UNIFI_POLICY_DELETE
      value: "false"
    - name: UNIFI_TOOL_PERMISSION_MODE
      value: confirm
  secrets:
    - name: toolhive-unifi-username-secret
      key: UNIFI_USERNAME
    - name: toolhive-unifi-password-secret
      key: UNIFI_PASSWORD
    - name: toolhive-unifi-api-key-secret
      key: UNIFI_API_KEY
  groupRef:
    name: mcp-tools
