---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name proxmox
spec:
  endpointSelector:
    matchLabels:
      toolhive: "true"
      toolhive-name: *name
      app: *name
  egress:
    # Proxmox VE API (pve.internal via proxmox-backend EndpointSlice 10.0.10.10)
    - toCIDR:
        - 10.0.10.10/32
      toPorts:
        - ports:
            - port: "8006"
              protocol: TCP
