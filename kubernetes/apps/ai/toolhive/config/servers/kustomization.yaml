---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./networkpolicy.yaml
  - ./authentik/
  - ./context7/
  - ./flux/
  - ./github/
  - ./grafana/
  # - ./hass/
  - ./jellyfin/
  - ./konflate/
  - ./kubernetes/
  - ./longhorn/
  - ./prometheus/
  - ./qbittorrent/
  - ./seerr/
  - ./servarr/
  - ./talos/
  - ./unifi/
  - ./victoria-logs/
patches:
  - patch: |-
      - op: add
        path: /spec/env/-
        value:
          name: TOOLHIVE_SKIP_UPDATE_CHECK
          value: "true"
    target:
      group: toolhive.stacklok.dev
      kind: MCPServer
