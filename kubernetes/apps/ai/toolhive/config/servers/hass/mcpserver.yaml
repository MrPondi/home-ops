---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: hass
spec:
  image: ghcr.io/homeassistant-ai/ha-mcp:9.1.2@sha256:381b1e01635d3c51f35a01882863610bc0b76a22bae93835a6a5a5c926d9ecb4
  transport: streamable-http
  mcpPort: 8080
  env:
    - name: HOMEASSISTANT_URL
      value: http://home-assistant.default.svc.cluster.local:8123
    - name: HA_MCP_DISABLE_UPDATE_CHECK
      value: "true"
    - name: MCP_PORT
      value: "8080"
  secrets:
    - name: toolhive-hass-secret
      key: HOMEASSISTANT_TOKEN
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          command:
            - ha-mcp-web
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  groupRef:
    name: mcp-tools
