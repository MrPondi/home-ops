---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubernetes
spec:
  env: []
  image: ghcr.io/containers/kubernetes-mcp-server:v0.0.69@sha256:1da9d62ad0c008a6cadcf2718c86c2e2d18753ca1d9f1f3313068980794b24f2
  transport: streamable-http
  mcpPort: 8080
  serviceAccount: kubernetes-mcp
  args:
    - --config=/etc/kubernetes-mcp-server/config.toml
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
  groupRef:
    name: mcp-tools
