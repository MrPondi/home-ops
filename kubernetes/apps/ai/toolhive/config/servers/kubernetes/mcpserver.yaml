---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubernetes
spec:
  env: []
  image: ghcr.io/containers/kubernetes-mcp-server:v0.1.2@sha256:e3bf21b5488aedb02d1e686de162785a82fa99a6ada12388aef157c2fdd5dc68
  transport: streamable-http
  mcpPort: 8080
  serviceAccount: kubernetes-mcp
  args:
    - --config=/etc/kubernetes-mcp-server/config.toml
  podTemplateSpec:
    spec:
      containers:
        - name: mcp
          volumeMounts:
            - name: config
              mountPath: /etc/kubernetes-mcp-server
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kubernetes-mcp-config
  groupRef:
    name: mcp-tools
