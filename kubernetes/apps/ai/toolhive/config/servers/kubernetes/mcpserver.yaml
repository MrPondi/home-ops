---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/mcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: MCPServer
metadata:
  name: kubernetes
spec:
  env: []
  image: ghcr.io/containers/kubernetes-mcp-server:v0.0.67@sha256:e47f6ccc5347e1ea6be495d8d9ab55ac8a995fe87800fb984fa770cebe14ad44
  transport: streamable-http
  mcpPort: 8080
  serviceAccount: kubernetes-mcp
  args:
    - --port=8080
    - --read-only
    - --stateless
  groupRef:
    name: mcp-tools
