---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: toolhive-signing-key
spec:
  secretName: toolhive-signing-key-secret
  commonName: toolhive-oidc-signer
  duration: 43800h # 5y
  privateKey:
    algorithm: RSA
    encoding: PKCS8
    size: 2048
  issuerRef:
    name: selfsigned-internal
    kind: ClusterIssuer
    group: cert-manager.io
