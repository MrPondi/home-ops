---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway
spec:
  authServerConfig:
    issuer: https://mcp.pondi.dev
    signingKeySecretRefs:
      - name: toolhive-signing-key-secret
        key: tls.key
    hmacSecretRefs:
      - name: toolhive-secret
        key: AUTH_HMAC_KEY
    tokenLifespans:
      accessTokenLifespan: 1h
      refreshTokenLifespan: 168h
      authCodeLifespan: 10m
    upstreamProviders:
      - name: authentik
        type: oidc
        oidcConfig:
          issuerUrl: https://auth.pondi.dev/application/o/toolhive/
          clientId: ${TOOLHIVE_OIDC_CLIENT_ID}
          clientSecretRef:
            name: toolhive-secret
            key: TOOLHIVE_OIDC_CLIENT_SECRET
          redirectUri: https://mcp.pondi.dev/oauth/callback
          scopes:
            - openid
            - profile
            - email
            - offline_access
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}."
    optimizer:
      embeddingModel: embed
      embeddingProvider: openai
      embeddingService: http://litellm.ai.svc.cluster.local:4000/v1
      embeddingServiceTimeout: 180s
  groupRef:
    name: mcp-tools
  telemetryConfigRef:
    name: prometheus
  incomingAuth:
    type: oidc
    oidcConfigRef:
      name: authentik
      audience: https://mcp.pondi.dev/mcp
      resourceUrl: https://mcp.pondi.dev/mcp
      scopes:
        - openid
        - profile
        - email
        - offline_access
  outgoingAuth:
    source: discovered
  sessionStorage:
    address: toolhive-dragonfly.ai.svc.cluster.local:6379
    db: 0
    provider: redis
    keyPrefix: "vmcp-sessions:"
    passwordRef:
      key: password
      name: ${APP}-dragonfly-secret
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          args:
            - serve
            - --config=/etc/vmcp-config/config.yaml
            - --host=0.0.0.0
            - --port=4483
          env:
            - name: INSECURE_DISABLE_URL_VALIDATION
              value: "true"
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed-secret
                  key: api-key
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/toolhive.stacklok.dev/virtualmcpserver_v1beta1.json
apiVersion: toolhive.stacklok.dev/v1beta1
kind: VirtualMCPServer
metadata:
  name: mcp-gateway-internal
spec:
  config:
    aggregation:
      conflictResolution: prefix
      conflictResolutionConfig:
        prefixFormat: "{workload}."
  groupRef:
    name: mcp-tools
  telemetryConfigRef:
    name: prometheus
  incomingAuth:
    type: anonymous
  outgoingAuth:
    source: discovered
  sessionStorage:
    address: toolhive-dragonfly.ai.svc.cluster.local:6379
    db: 1
    provider: redis
    keyPrefix: "vmcp-sessions:"
    passwordRef:
      key: password
      name: ${APP}-dragonfly-secret
  podTemplateSpec:
    spec:
      containers:
        - name: vmcp
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 1Gi
          args:
            - serve
            - --config=/etc/vmcp-config/config.yaml
            - --host=0.0.0.0
            - --port=4483
          env:
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: toolhive-embed-secret
                  key: api-key
