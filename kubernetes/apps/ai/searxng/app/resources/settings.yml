---
use_default_settings: true

server:
  limiter: true
  image_proxy: true
  method: GET
  public_instance: false

search:
  # Autocomplete and favicon resolvers were set to duckduckgo, which fires one
  # upstream request per keystroke and per result row. For a private instance
  # driven by automated agents (open-webui RAG, openclaw) these
  # generate zero value and were the dominant source of DDG captcha/rate-limits.
  # Disabling them cuts most wasted upstream calls. Set back to "duckduckgo" if
  # interactive UI usage on search.jory.dev wants them back.
  autocomplete: ""
  favicon_resolver: ""
  languages:
    - all
    - en
    - en-US
    - pl
    - pl-PL
  formats:
    - html
    - json

general:
  instance_name: Search

ui:
  default_theme: simple
  infinite_scroll: true
  query_in_title: true
  results_on_new_tab: true
  static_use_hash: true
  theme_args:
    simple_style: auto

categories_as_tabs:
  general:
  images:
  videos:
  map:

enabled_plugins:
  - Basic Calculator
  - Hash plugin
  - Open Access DOI rewrite
  - Self Informations
  - Tracker URL remover
  - Unit converter plugin

hostnames:
  high_priority:
    - (.*)\/blog\/(.*)
    - (.*\.)?wikipedia.org$
    - (.*\.)?github.com$
    - (.*\.)?reddit.com$
    - (.*\.)?docker.com$
    - (.*\.)?archlinux.org$
    - (.*\.)?stackoverflow.com$
    - (.*\.)?askubuntu.com$
    - (.*\.)?superuser.com$

# Engines disabled because they were rate-limiting / captcha-ing this instance's
# single egress IP. Merged by `name` against use_default_settings. If an engine
# stops failing after traffic drops, it can be re-enabled here.
engines:
  - name: ahmia
    inactive: true
  - name: torch
    inactive: true
  # startpage is notoriously captcha-aggressive and was returning "Suspended: CAPTCHA".
  - name: startpage
    disabled: true
  # karmasearch was returning "Suspended: access denied".
  - name: karmasearch
    disabled: true
  # brave was returning "Suspended: too many requests".
  - name: brave
    disabled: true
  # Brave (HTML scraper) gets IP-blocked like Google/DDG. The API-backed engine `braveapi` is quota-based and reliable.
  # - name: braveapi
  #   disabled: true
  #   api_key: "{{ .BRAVE_API_KEY }}"
