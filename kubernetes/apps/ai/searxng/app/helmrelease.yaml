---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: searxng
spec:
  chartRef:
    kind: OCIRepository
    name: searxng
  interval: 1h
  values:
    controllers:
      searxng:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/searxng/searxng
              tag: 2026.9.18-0d6910ae5@sha256:012e7557a611d4a7043a413bd1939eed81a1e1077ac33c89890236119e8eea80
            env:
              SEARXNG_BASE_URL: https://search.pondi.dev
              SEARXNG_PORT: &port 8080
              SEARXNG_VALKEY_URL: "redis://{{ .Release.Name }}-dragonfly.ai.svc.cluster.local:6379"
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /healthz
                    port: *port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop: ["ALL"]
                add: ["CHOWN", "SETGID", "SETUID", "DAC_OVERRIDE"]
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 977
        runAsGroup: 977
        fsGroup: 977
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: SearxNG
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: searxng
          gethomepage.dev/description: Privacy-respecting metasearch engine
          gethomepage.dev/weight: "3"
        hostnames:
          - "search.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        type: configMap
        name: "{{ .Release.Name }}-config"
        globalMounts:
          - path: /etc/searxng/settings.yml
            subPath: settings.yml
          - path: /etc/searxng/limiter.toml
            subPath: limiter.toml
      tmp:
        type: emptyDir
        globalMounts:
          - path: /tmp
            subPath: tmp
