providers:
  litellm:
    api: http://litellm.ai.svc.cluster.local:4000/v1
    api_key: "{{ .LITELLM_MASTER_KEY }}"
    models:
      # qwen-local:
      #   context_length: 148480
      deepseek-v4-flash-free:
        context_length: 1000000
      big-pickle-free:
        context_length: 200000
      # minimax-m3:
      #   context_length: 512000
      # glm-5-2:
      #   context_length: 1048560
model:
  default: deepseek-v4-flash-free
  provider: custom:litellm
fallback_providers:
  #   - provider: custom:litellm
  #     model: qwen-local
  - provider: custom:litellm
    model: big-pickle-free
#   - provider: custom:litellm
#     model: minimax-m3
#   - provider: custom:litellm
#     model: glm-5-2
agent:
  max_turns: 90
  gateway_timeout: 1800
  restart_drain_timeout: 60
  api_max_retries: 2
  tool_use_enforcement: auto
  reasoning_effort: medium
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
approvals:
  mode: smart
  timeout: 60
  cron_mode: deny
  mcp_reload_confirm: true
  destructive_slash_confirm: true
command_allowlist:
  - execute_code
  - "curl *pondi.dev*"
  - "wget *pondi.dev*"
  - "curl *.ai.svc.cluster.local*"
gateway:
  platforms:
    whatsapp_cloud:
      enabled: true
      require_mention: true
group_sessions_per_user: false
# memory:
#   auto_migrate: true
#   auto_summarize:
#     threshold: 50
#   provider: memini
# plugins:
#   enabled:
#     - memini
mcp_servers:
  toolhive:
    url: http://vmcp-mcp-gateway.ai.svc.cluster.local:4483/mcp
    auth: oauth
platform_toolsets:
  cli:
    - hermes-cli
  photon:
    - hermes-cli
privacy:
  redact_pii: true
security:
  redact_secrets: true
  tirith_enabled: true
  tirith_fail_open: true
streaming:
  enabled: false
terminal:
  backend: local
  cwd: /opt/data/workspace
  timeout: 180
  persistent_shell: true
toolsets:
  - hermes-cli
web:
  backend: ddgs
  use_gateway: false
