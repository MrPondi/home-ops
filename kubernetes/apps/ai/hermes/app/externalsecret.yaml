---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-secret
    template:
      data:
        LITELLM_MASTER_KEY: "{{ .LITELLM_MASTER_KEY }}"
        # HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HERMES_OIDC_CLIENT_ID }}"
        # HERMES_DASHBOARD_OIDC_CLIENT_SECRET: "{{ .HERMES_OIDC_CLIENT_SECRET }}"
        # HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email"
        # HERMES_DASHBOARD_OIDC_ISSUER: https://auth.pondi.dev/application/o/hermes/
        HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "admin"
        HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "{{ .HERMES_DASHBOARD_PASSWORD }}"
        HERMES_DASHBOARD_PUBLIC_URL: https://hermes.pondi.dev
        # Whatsapp Cloud API credentials
        WHATSAPP_CLOUD_PHONE_NUMBER_ID: "{{ .WHATSAPP_CLOUD_PHONE_NUMBER_ID }}"
        WHATSAPP_CLOUD_ACCESS_TOKEN: "{{ .WHATSAPP_CLOUD_ACCESS_TOKEN}}"
        WHATSAPP_CLOUD_APP_ID: "{{ .WHATSAPP_CLOUD_APP_ID }}"
        WHATSAPP_CLOUD_APP_SECRET: "{{ .WHATSAPP_CLOUD_APP_SECRET }}"
        WHATSAPP_CLOUD_VERIFY_TOKEN: "{{ .WHATSAPP_CLOUD_VERIFY_TOKEN }}"
        WHATSAPP_CLOUD_ALLOWED_USERS: "{{ .WHATSAPP_CLOUD_ALLOWED_USERS }}"
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: litellm
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-config-secret
    template:
      templateFrom:
        - configMap:
            name: hermes-config
            items:
              - key: config.yaml
  dataFrom:
    - extract:
        key: hermes
    - extract:
        key: litellm
