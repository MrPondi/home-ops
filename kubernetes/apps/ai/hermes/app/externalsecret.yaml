---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-secret
    template:
      data:
        API_SERVER_KEY: "{{ .HERMES_API_SERVER_KEY }}"
        # Whatsapp Cloud API credentials
        WHATSAPP_CLOUD_PHONE_NUMBER_ID: "{{ .WHATSAPP_CLOUD_PHONE_NUMBER_ID }}"
        WHATSAPP_CLOUD_ACCESS_TOKEN: "{{ .WHATSAPP_CLOUD_ACCESS_TOKEN}}"
        WHATSAPP_CLOUD_APP_ID: "{{ .WHATSAPP_CLOUD_APP_ID }}"
        WHATSAPP_CLOUD_APP_SECRET: "{{ .WHATSAPP_CLOUD_APP_SECRET }}"
        WHATSAPP_CLOUD_VERIFY_TOKEN: "{{ .WHATSAPP_CLOUD_VERIFY_TOKEN }}"
        WHATSAPP_CLOUD_ALLOWED_USERS: '{{ replace .ALLOWED_PHONE_NUMBERS "+" "" }}'
        WHATSAPP_CLOUD_HOME_CHANNEL: '{{ replace .HOME_PHONE_NUMBER "+" "" }}'
        # Photon credentials
        PHOTON_PROJECT_ID: "{{ .PHOTON_PROJECT_ID }}"
        PHOTON_PROJECT_SECRET: "{{ .PHOTON_PROJECT_SECRET }}"
        PHOTON_ALLOWED_USERS: "{{ .ALLOWED_PHONE_NUMBERS }}"
        PHOTON_HOME_CHANNEL: "{{ .HOME_PHONE_NUMBER }}"
  dataFrom:
    - extract:
        key: hermes
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-dashboard
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-dashboard-secret
    template:
      data:
        HERMES_DASHBOARD_PUBLIC_URL: https://hermes.pondi.dev
        HERMES_DASHBOARD_OIDC_CLIENT_ID: "{{ .HERMES_OIDC_CLIENT_ID }}"
        HERMES_DASHBOARD_OIDC_SCOPES: "openid profile email"
        HERMES_DASHBOARD_OIDC_ISSUER: https://auth.pondi.dev/application/o/hermes/
  dataFrom:
    - extract:
        key: hermes
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: hermes-config
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: hermes-config-secret
    template:
      templateFrom:
        - configMap:
            name: hermes-config
            items:
              - key: config.yaml
  dataFrom:
    - extract:
        key: hermes
  data:
    - secretKey: LITELLM_HERMES_KEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: litellm-keys
      remoteRef:
        key: litellm-key-hermes
        property: api-key
