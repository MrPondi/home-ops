---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          1-init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - /bin/sh
              - -c
              - |
                set -euo pipefail

                cp /tmp/config.yaml /opt/data/config.yaml

                mkdir -p /opt/data/.local/bin

                if [ ! -f /opt/data/.local/bin/ffmpeg ]; then
                  mkdir -p /tmp/ffmpeg
                  cd /tmp/ffmpeg

                  wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
                  wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz.md5

                  md5sum -c ffmpeg-release-amd64-static.tar.xz.md5

                  tar -xf ffmpeg-release-amd64-static.tar.xz --strip-components=1

                  mv ffmpeg ffprobe /opt/data/.local/bin/

                  chmod +x /opt/data/.local/bin/ffmpeg /opt/data/.local/bin/ffmprobe

                  cd /
                  rm -rf /tmp/ffmpeg
                fi

                cat > /opt/data/.env <<EOF
                WHATSAPP_ENABLED=false
                API_SERVER_KEY=$${API_SERVER_KEY}
                EOF

                chown -R 10000:10000 /run-app /run-dashboard /opt/data
                chmod 755 /run-app /run-dashboard
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
            env:
              - name: API_SERVER_KEY
                valueFrom:
                  secretKeyRef:
                    name: "{{ .Release.Name }}-secret"
                    key: API_SERVER_KEY
          2-install-tools:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.9.21@sha256:6bece0644e29a347e5ae17db43c36938c86f171c6f5e0cef18aa2075d331f3a3
            command:
              - /bin/sh
              - -c
              - |
                set -euo pipefail

                PHOTON_SRC="/opt/hermes/plugins/platforms/photon/sidecar"
                PHOTON_DEST="/opt/data/photon/sidecar"
                mkdir -p "$PHOTON_DEST"

                if [ -f "$PHOTON_SRC/package.json" ] && [ ! -f "$PHOTON_DEST/package.json" ]; then
                  cp -a "$PHOTON_SRC/." "$PHOTON_DEST/"
                fi

                if [ -f "$PHOTON_DEST/package.json" ]; then
                  cd "$PHOTON_DEST" && npm ci 2>/dev/null || npm install
                fi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          gateway:
            image: *image
            args: ["sleep", "infinity"]
            env:
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &api-port 8642
              HERMES_HOME: /opt/data
              HOME: /opt/data
              # WhatsApp cloud webhook (unused — platform disabled in config.yaml)
              # WHATSAPP_CLOUD_WEBHOOK_PORT: &whatsapp-port 8090
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: *api-port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health/detailed
                    port: *api-port
                    httpHeaders:
                      - name: Authorization
                        value: "Bearer ${PROBE_API_KEY}"
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
          dashboard:
            image: *image
            args:
              - dashboard
              - --host
              - "0.0.0.0"
            env:
              GATEWAY_HEALTH_URL: http://localhost:8642
              HERMES_DASHBOARD_PORT: &dashboard-port 9119
              HERMES_HOME: /opt/data
              HOME: /opt/data
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-dashboard-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/status
                    port: *dashboard-port
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 10
                  timeoutSeconds: 5
                  failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    service:
      gateway:
        ports:
          api:
            port: *api-port
          # whatsapp:
          #   port: *whatsapp-port
      dashboard:
        ports:
          http:
            port: *dashboard-port
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes Agent Dashboard
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: mdi-robot-happy-outline
          gethomepage.dev/description: Nous Hermes agent
          gethomepage.dev/weight: "2"
          gethomepage.dev/app: hermes
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - identifier: dashboard
                port: http
      # whatsapp-webhook:
      #   annotations:
      #     gatus.home-operations.com/endpoint: |-
      #       conditions: ["[STATUS] == 400"]
      #   hostnames:
      #     - whatsapp-webhook.pondi.dev
      #   parentRefs:
      #     - name: envoy-external
      #       namespace: network
      #   rules:
      #     - backendRefs:
      #         - identifier: gateway
      #           port: whatsapp
      #       matches:
      #         - path:
      #             type: PathPrefix
      #             value: /whatsapp/webhook
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      config:
        type: secret
        name: "{{ .Release.Name }}-config-secret"
        defaultMode: 0755
        advancedMounts:
          hermes:
            1-init:
              - path: /tmp/config.yaml
                subPath: config.yaml
      run-app:
        type: emptyDir
        advancedMounts:
          hermes:
            1-init:
              - path: /run-app
            gateway:
              - path: /run

      run-dashboard:
        type: emptyDir
        advancedMounts:
          hermes:
            1-init:
              - path: /run-dashboard
            dashboard:
              - path: /run
      tmp:
        type: emptyDir
