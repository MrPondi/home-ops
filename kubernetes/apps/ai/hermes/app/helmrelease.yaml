---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          1-init:
            image:
              repository: docker.io/library/alpine
              tag: "3.24"
            command:
              - /bin/sh
              - -c
              - |
                set -euo pipefail

                cp /tmp/config.yaml /opt/data/config.yaml

                mkdir -p /opt/data/.local/bin

                if [ ! -f /opt/data/.local/bin/ffmpeg ]; then
                  mkdir -p /tmp/ffmpeg
                  cd /tmp/ffmpeg

                  wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
                  wget -q https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz.md5

                  md5sum -c ffmpeg-release-amd64-static.tar.xz.md5

                  tar -xf ffmpeg-release-amd64-static.tar.xz --strip-components=1

                  mv ffmpeg ffprobe /opt/data/.local/bin/

                  chmod +x /opt/data/.local/bin/ffmpeg /opt/data/.local/bin/ffmprobe

                  cd /
                  rm -rf /tmp/ffmpeg
                fi

                chown -R 10000:10000 /run /opt/data
                chmod 755 /run
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
          2-install-tools:
            image: &image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.16@sha256:f8f548d87d16634d1ad9e3777280f3f577ba2358703f04e18e74007ffd3621bf
            command:
              - /bin/sh
              - -c
              - |
                set -euo pipefail

                PHOTON_SRC="/opt/hermes/plugins/platforms/photon/sidecar"
                PHOTON_DEST="/opt/data/photon/sidecar"
                mkdir -p "$PHOTON_DEST"

                if [ -f "$PHOTON_SRC/package.json" ] && [ ! -f "$PHOTON_DEST/package.json" ]; then
                  cp -a "$PHOTON_SRC/." "$PHOTON_DEST/"
                fi

                if [ -f "$PHOTON_DEST/package.json" ]; then
                  cd "$PHOTON_DEST" && npm ci 2>/dev/null || npm install
                fi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *image
            args: ["sleep", "infinity"]
            env:
              HOME: /opt/data
              HERMES_HOME: /opt/data
              WHATSAPP_CLOUD_WEBHOOK_PORT: &whatsapp-port 8090
              SEARXNG_URL: http://searxng.ai.svc.cluster.local:8080
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboard-port 9119
              API_SERVER_ENABLED: true
              API_SERVER_HOST: 0.0.0.0
              API_SERVER_PORT: &api-port 8642
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/status
                    port: *dashboard-port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 100m
                memory: 512Mi
              limits:
                memory: 2Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *dashboard-port
          api:
            port: *api-port
          whatsapp:
            port: *whatsapp-port
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes Agent Dashboard
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: mdi-robot-happy-outline
          gethomepage.dev/description: Nous Hermes agent
          gethomepage.dev/weight: "2"
          gethomepage.dev/app: hermes
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
        rules:
          - backendRefs:
              - port: http
      whatsapp-webhook:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 400"]
        hostnames:
          - whatsapp-webhook.pondi.dev
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - port: whatsapp
            matches:
              - path:
                  type: PathPrefix
                  value: /whatsapp/webhook
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      config:
        type: secret
        name: "{{ .Release.Name }}-config-secret"
        defaultMode: 0755
        advancedMounts:
          hermes:
            1-init:
              - path: /tmp/config.yaml
                subPath: config.yaml
      run:
        type: emptyDir
        advancedMounts:
          hermes:
            1-init:
              - path: /run
            app:
              - path: /run
      tmp:
        type: emptyDir
