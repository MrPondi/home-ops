---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: hermes
spec:
  chartRef:
    kind: OCIRepository
    name: hermes
  interval: 1h
  values:
    controllers:
      hermes:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          1-init:
            image:
              repository: ghcr.io/home-operations/busybox
              tag: 1.38.0@sha256:7e2c04dd50ede647bf4a7a4c8dbd629dd4971cd139b9b88fb22bfc3c7a6c13df
            command:
              - /bin/sh
              - -c
              - |
                set -euo pipefail

                cp /tmp/config.yaml /opt/data/config.yaml

                mkdir -p /opt/data/.local/bin

                if [ ! -f /opt/data/.local/bin/ffmpeg ]; then
                  wget -qO /tmp/ffmpeg.tar.xz https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz
                  wget -qO /tmp/ffmpeg.tar.xz.md5 https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz.md5

                  cd /tmp && md5sum -c ffmpeg.tar.xz.md5

                  tar -xf /tmp/ffmpeg.tar.xz --strip-components=1 -C /opt/data/.local/bin --wildcards '*/ffmpeg'

                  chmod +x /opt/data/.local/bin/ffmpeg
                  rm /tmp/ffmpeg.tar.xz /tmp/ffmpeg.tar.xz.md5
                fi

                chown -R 10000:10000 /run /opt/data
                chmod 755 /run
            securityContext:
              runAsUser: 0
              runAsGroup: 0
              runAsNonRoot: false
          2-install-tools:
            image: &hermes-image
              repository: docker.io/nousresearch/hermes-agent
              tag: v2026.8.13@sha256:68e15ae2a6d894d0ccbd9f8aacbbe13d4d28fa5dc9b6a303970b67bb2499b1a6
            command:
              - /bin/sh
              - -c
              - |
                set -euo pipefail

                PHOTON_SRC="/opt/hermes/plugins/platforms/photon/sidecar"
                PHOTON_DEST="/opt/data/photon/sidecar"
                mkdir -p "$PHOTON_DEST"

                if [ -f "$PHOTON_SRC/package.json" ] && [ ! -f "$PHOTON_DEST/package.json" ]; then
                  cp -a "$PHOTON_SRC/." "$PHOTON_DEST/"
                fi

                if [ -f "$PHOTON_DEST/package.json" ]; then
                  cd "$PHOTON_DEST" && npm ci 2>/dev/null || npm install
                fi
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
        containers:
          app:
            image: *hermes-image
            args: ["gateway", "run"]
            env:
              HOME: /opt/data
              HERMES_HOME: /opt/data
              HERMES_DASHBOARD: true
              HERMES_DASHBOARD_HOST: 0.0.0.0
              HERMES_DASHBOARD_PORT: &dashboard-port 9119
              WHATSAPP_CLOUD_WEBHOOK_PORT: &whatsapp-port 8090
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              startup:
                enabled: true
                custom: true
                spec:
                  httpGet: &httpGet
                    path: /api/status
                    port: *dashboard-port
                  initialDelaySeconds: 10
                  periodSeconds: 5
                  timeoutSeconds: 5
                  failureThreshold: 30
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  periodSeconds: 30
                  timeoutSeconds: 5
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet: *httpGet
                  timeoutSeconds: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
            resources:
              requests:
                cpu: 50m
                memory: 512Mi
              limits:
                memory: 1Gi
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 10000
        fsGroup: 10000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *dashboard-port
          whatsapp:
            port: *whatsapp-port
    route:
      dashboard:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Hermes Agent Dashboard
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: mdi-robot-happy-outline
          gethomepage.dev/description: Nous Hermes agent
          gethomepage.dev/weight: "5"
        hostnames:
          - "{{ .Release.Name }}.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
      whatsapp-webhook:
        annotations:
          gatus.home-operations.com/endpoint: |-
            conditions: ["[STATUS] == 400"]
        hostnames:
          - whatsapp-webhook.pondi.dev
        parentRefs:
          - name: envoy-external
            namespace: network
        rules:
          - backendRefs:
              - port: whatsapp
            matches:
              - path:
                  type: PathPrefix
                  value: /whatsapp/webhook
    persistence:
      data:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /opt/data
      config:
        type: secret
        name: "{{ .Release.Name }}-config-secret"
        defaultMode: 0755
        advancedMounts:
          hermes:
            1-init:
              - path: /tmp/config.yaml
                subPath: config.yaml
      run:
        type: emptyDir
        globalMounts:
          - path: /run
      tmp:
        type: emptyDir
