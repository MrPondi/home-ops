---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: hermes
spec:
  components:
    - ../../../../components/kopiur/statefulset
  dependsOn:
    - name: ai-postbuild
    - name: external-secrets-store
      namespace: external-secrets
    - name: litellm
      namespace: ai
    - name: searxng
      namespace: ai
  interval: 1h
  path: ./kubernetes/apps/ai/hermes/app
  postBuild:
    substitute:
      APP: hermes
      KOPIUR_CLAIM: data
      KOPIUR_PGID: "10000"
      KOPIUR_PUID: "10000"
    substituteFrom:
      - kind: Secret
        name: hermes-postbuild-secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
