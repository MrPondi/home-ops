---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: open-webui
spec:
  refreshPolicy: OnChange
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: open-webui-secret
    template:
      data:
        WEBUI_SECRET_KEY: "{{ .WEBUI_SECRET_KEY }}"
        # Backends
        ENABLE_OLLAMA_API: "false"
        ENABLE_OPENAI_API: "true"
        OPENAI_API_BASE_URLS: http://litellm.ai.svc.cluster.local:4000/v1;http://hermes-gateway.ai.svc.cluster.local:8642/v1
        OPENAI_API_KEYS: "{{ .LITELLM_OPEN_WEBUI_KEY }};{{ .HERMES_API_SERVER_KEY }}"
        # OpenID
        OAUTH_CLIENT_ID: "{{ .OPEN_WEBUI_OIDC_CLIENT_ID }}"
        OAUTH_CLIENT_SECRET: "{{ .OPEN_WEBUI_OIDC_CLIENT_SECRET }}"
        OAUTH_PROVIDER_NAME: Authentik
        OPENID_PROVIDER_URL: https://auth.pondi.dev/application/o/open-webui/.well-known/openid-configuration
        OPENID_REDIRECT_URI: https://chat.pondi.dev/oauth/oidc/callback
        OAUTH_SCOPES: email openid profile open-webui
        ENABLE_OAUTH_SIGNUP: "true"
        ENABLE_LOGIN_FORM: "false"
        ENABLE_PASSWORD_AUTH: "false"
        ENABLE_OAUTH_PERSISTENT_CONFIG: "false"
        ENABLE_OAUTH_BACKCHANNEL_LOGOUT: "true"
        ENABLE_OAUTH_ROLE_MANAGEMENT: "true"
        OAUTH_AUTO_REDIRECT: "true"
        OAUTH_MERGE_ACCOUNTS_BY_EMAIL: "true"
        OAUTH_UPDATE_PICTURE_ON_LOGIN: "true"
  dataFrom:
    - extract:
        key: open-webui
    - extract:
        key: hermes
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: hex-32
      rewrite:
        - regexp:
            source: "password"
            target: "WEBUI_SECRET_KEY"
  data:
    - secretKey: LITELLM_OPEN_WEBUI_KEY
      sourceRef:
        storeRef:
          kind: ClusterSecretStore
          name: litellm-keys
      remoteRef:
        key: litellm-key-open-webui
        property: api-key
