---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 1h
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        initContainers:
          postgres-init:
            image:
              repository: ghcr.io/home-operations/postgres-init
              tag: 18.6@sha256:b6d3af974df781c673d37e49bdddfa14a6f5be28b18d2cb7713f0449bea4057b
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.11.0@sha256:72c0ba641ba75e7aa52655cb242570906ececd09b1140fb736483038a22b3228
            env:
              WEBUI_URL: https://chat.pondi.dev
              CORS_ALLOW_ORIGIN: https://chat.pondi.dev
              ENABLE_PERSISTENT_CONFIG: "false"
              ENABLE_VERSION_UPDATE_CHECK: "false"
              ENABLE_API_KEYS: "true"
              DEFAULT_LOCALE: pl
              TOOL_SERVER_CONNECTIONS: '[{"type":"mcp","url":"http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp","spec_type":"url","spec":"","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"mcp-gateway","name":"MCP Gateway","description":""}}]'
              # SearXNG
              ENABLE_WEB_SEARCH: True
              WEB_SEARCH_ENGINE: "searxng"
              WEB_SEARCH_RESULT_COUNT: 3
              WEB_SEARCH_CONCURRENT_REQUESTS: 10
              SEARXNG_QUERY_URL: "http://searxng.ai.svc.cluster.local:8080/search?q=<query>"
              # Websockets / Redis
              REDIS_URL: redis://{{ .Release.Name }}-dragonfly.ai.svc.cluster.local:6379/0
              ENABLE_WEBSOCKET_SUPPORT: true
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://{{ .Release.Name }}-dragonfly.ai.svc.cluster.local:6379/1
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 3
              readiness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /api/models
                    port: *port
                    httpHeaders:
                      - name: x-api-key
                        value: "${PROBE_API_KEY}"
                  periodSeconds: 15
                  timeoutSeconds: 3
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: open-webui-light
          gethomepage.dev/description: Chat interface for local LLMs
          gethomepage.dev/weight: "1"
        hostnames:
          - "chat.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
