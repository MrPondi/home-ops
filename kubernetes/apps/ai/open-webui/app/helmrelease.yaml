---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: open-webui
spec:
  chartRef:
    kind: OCIRepository
    name: open-webui
  interval: 1h
  values:
    controllers:
      open-webui:
        annotations:
          reloader.stakater.com/auto: "true"
        containers:
          app:
            image:
              repository: ghcr.io/open-webui/open-webui
              tag: v0.13.5@sha256:e0dc5a8bf5c71cadf339d1e7b9408b357da75fb2854f82cad57a1609fadf2a22
            env:
              CORS_ALLOW_ORIGIN: https://chat.pondi.dev
              DATABASE_URL:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-pg-app
                    key: uri
              DEFAULT_LOCALE: pl
              ENABLE_API_KEYS: "true"
              ENABLE_PERSISTENT_CONFIG: "false"
              ENABLE_VERSION_UPDATE_CHECK: "false"
              ENABLE_WEB_SEARCH: True
              ENABLE_WEBSOCKET_SUPPORT: true
              HERMES_API_SERVER_KEY:
                valueFrom:
                  secretKeyRef:
                    name: open-webui-secret
                    key: HERMES_API_SERVER_KEY
              LITELLM_OPEN_WEBUI_KEY:
                valueFrom:
                  secretKeyRef:
                    name: litellm-key-open-webui
                    key: api-key
              # $(VAR) only expands vars defined earlier; app-template sorts env keys alphabetically,
              # so every var referenced here must sort before OPENAI_API_KEYS
              OPENAI_API_KEYS: $(LITELLM_OPEN_WEBUI_KEY);$(HERMES_API_SERVER_KEY)
              REDIS_URL: redis://{{ .Release.Name }}-dragonfly.ai.svc.cluster.local:6379/0
              SEARXNG_QUERY_URL: "http://searxng.ai.svc.cluster.local:8080/search?q=<query>"
              TOOL_SERVER_CONNECTIONS: '[{"type":"mcp","url":"http://vmcp-mcp-gateway-internal.ai.svc.cluster.local:4483/mcp","spec_type":"url","spec":"","path":"openapi.json","auth_type":"none","key":"","config":{"enable":true},"info":{"id":"mcp-gateway","name":"MCP Gateway","description":""}}]'
              WEB_SEARCH_CONCURRENT_REQUESTS: 10
              WEB_SEARCH_ENGINE: "searxng"
              WEB_SEARCH_RESULT_COUNT: 3
              WEBSOCKET_MANAGER: redis
              WEBSOCKET_REDIS_URL: redis://{{ .Release.Name }}-dragonfly.ai.svc.cluster.local:6379/1
              WEBUI_URL: https://chat.pondi.dev
              TZ: Europe/Warsaw
            envFrom:
              - secretRef:
                  name: "{{ .Release.Name }}-secret"
            probes:
              liveness:
                enabled: true
                custom: true
                spec:
                  httpGet:
                    path: /health
                    port: &port 8080
                  periodSeconds: 30
                  timeoutSeconds: 5
                  failureThreshold: 5
              # readiness:
              #   enabled: true
              #   custom: true
              #   spec:
              #     httpGet:
              #       path: /api/models
              #       port: *port
              #       httpHeaders:
              #         - name: x-api-key
              #           value: "${PROBE_API_KEY}"
              #     periodSeconds: 10
              #     timeoutSeconds: 5
              #     failureThreshold: 5
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities: { drop: ["ALL"] }
    defaultPodOptions:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
    service:
      app:
        ports:
          http:
            port: *port
    route:
      app:
        annotations:
          gethomepage.dev/enabled: "true"
          gethomepage.dev/name: Open WebUI
          gethomepage.dev/group: Home & Automation
          gethomepage.dev/icon: open-webui-light
          gethomepage.dev/description: Chat interface for local LLMs
          gethomepage.dev/weight: "1"
        hostnames:
          - "chat.pondi.dev"
        parentRefs:
          - name: envoy-internal
            namespace: network
    persistence:
      config:
        existingClaim: "{{ .Release.Name }}"
        globalMounts:
          - path: /app/backend/data
      tmp:
        type: emptyDir
