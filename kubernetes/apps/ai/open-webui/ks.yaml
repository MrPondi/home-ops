---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # TEMPORARY net-new bootstrap — remove after first backup lands (just kube pg-initial-backup ai open-webui); recovery is the default once a backup exists
  labels:
    components.dragonfly/enabled: "true"
    components.postgres/cnpg: init
    components.postgres/enabled: "true"
  name: open-webui
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: external-secrets-store
      namespace: external-secrets
    - name: searxng
      namespace: ai
  healthCheckExprs: []
  interval: 1h
  path: ./kubernetes/apps/ai/open-webui/app
  postBuild:
    substitute:
      APP: open-webui
    substituteFrom:
      - kind: Secret
        name: open-webui-postbuild-secret
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
