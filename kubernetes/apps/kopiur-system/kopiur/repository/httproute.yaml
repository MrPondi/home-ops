---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: ${APP_HTTPROUTE}
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Kopiur
    gethomepage.dev/group: Infrastructure
    gethomepage.dev/icon: kopia.svg
    gethomepage.dev/description: Backup and restore service
    gethomepage.dev/weight: "10"
spec:
  hostnames:
    - kopiur.pondi.dev
  parentRefs:
    - name: envoy-internal
      namespace: network
  rules:
    - backendRefs:
        - name: qnap-kopia-ui
          port: 51515
