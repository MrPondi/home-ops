---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authentik-db-secret
    template:
      data:
        password: "{{ .POSTGRES_PASSWORD  }}"
        postgresPassword: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "1d658229-a07a-4613-b481-b36701078584"
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "1d4755c9-83d8-4294-9c4d-b3680142499c"
