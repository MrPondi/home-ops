---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-outpost-ldap
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost-ldap
  ingress:
    # Cluster clients — LDAP/LDAPS backend ports
    - fromEntities:
        - cluster
      toPorts:
        - ports:
            - port: "3389"
              protocol: TCP
            - port: "6636"
              protocol: TCP
    # RFC1918 clients (TrueNAS) — LDAP/LDAPS backend ports
    - fromCIDR:
        - 10.0.25.25/32
      toPorts:
        - ports:
            - port: "3389"
              protocol: TCP
            - port: "6636"
              protocol: TCP
  egress:
    # Authentik server API via envoy-internal
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: authentik-outpost-rac
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: authentik-outpost-rac
  egress:
    # Authentik server API via envoy-internal
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: network
            k8s:app.kubernetes.io/name: envoy
            k8s:gateway.envoyproxy.io/owning-gateway-name: envoy-internal
      toPorts:
        - ports:
            - port: "10443"
              protocol: TCP
    # RAC provider — VLAN 20 (SSH)
    - toCIDRSet:
        - cidr: 10.0.20.0/24
      toPorts:
        - ports:
            - port: "22"
              protocol: TCP
