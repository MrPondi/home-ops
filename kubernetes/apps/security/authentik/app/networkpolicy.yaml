            - port: "25"
              protocol: TCP
    # Internet — general egress (Turnstile/Duo/HIBP)
    - toCIDRSet:
        - cidr: 0.0.0.0/0
          except:
            - 10.0.0.0/8
            - 169.254.0.0/16
