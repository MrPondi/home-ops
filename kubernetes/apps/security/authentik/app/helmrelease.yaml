---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    global:
      podAnnotations:
        reloader.stakater.com/auto: 'true'
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        readOnlyRootFilesystem: true
        capabilities: {drop: ["ALL"]}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik
    authentik:
      existingSecret:
        secretName: authentik-secret
      email:
        host: "smtp-relay.default.svc.cluster.local"
        from: "Authentik security <no-reply@pondi.dev>"
    server:
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.1
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: authentik-secret
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      route:
        main:
          enabled: true
          annotations:
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Authentik
            gethomepage.dev/group: Infrastructure
            gethomepage.dev/icon: authentik.svg
            gethomepage.dev/description: Identity and access management platform
            gethomepage.dev/weight: "0"
            gethomepage.dev/app: authentik
            gethomepage.dev/widget.type: authentik
            gethomepage.dev/widget.url: "http://authentik-server.security.svc.cluster.local"
            gethomepage.dev/widget.version: "2"
            gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
          hostnames:
            - "{{ .Release.Name }}.pondi.dev"
          parentRefs:
            - name: envoy-internal
              namespace: network
    worker:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1.5Gi
    geoip:
      enabled: false
      existingSecret:
        secretName: authentik-secret
        accountId: GEOIP_ACCOUNT_ID
        licenseKey: GEOIP_LICENSE_KEY

    prometheus:
      rules:
        enabled: true
