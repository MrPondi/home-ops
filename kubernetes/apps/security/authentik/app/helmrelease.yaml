# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    global:
      podAnnotations:
        reloader.stakater.com/auto: "true"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: authentik
    authentik:
      existingSecret:
        secretName: authentik-secret
    server:
      initContainers:
        - name: init-db
          image: ghcr.io/home-operations/postgres-init:18.6
          imagePullPolicy: IfNotPresent
          envFrom:
            - secretRef:
                name: authentik-secret
      volumeMounts:
        - name: data
          mountPath: /data
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          memory: 2Gi
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true
      route:
        main:
          enabled: true
          annotations:
            gatus.home-operations.com/endpoint: |-
              name: authentik
            gethomepage.dev/enabled: "true"
            gethomepage.dev/name: Authentik
            gethomepage.dev/group: Infrastructure
            gethomepage.dev/icon: authentik.svg
            gethomepage.dev/description: Identity and access management platform
            gethomepage.dev/weight: "0"
            gethomepage.dev/app: authentik
            gethomepage.dev/widget.type: authentik
            gethomepage.dev/widget.url: "http://authentik-server.security.svc.cluster.local"
            gethomepage.dev/widget.version: "2"
            gethomepage.dev/widget.key: "{{HOMEPAGE_VAR_AUTHENTIK_TOKEN}}"
          hostnames:
            - "auth.pondi.dev"
          parentRefs:
            - name: envoy-internal
              namespace: network
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
    worker:
      resources:
        requests:
          cpu: 100m
          memory: 256Mi
        limits:
          memory: 1.5Gi
      containerSecurityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: { drop: ["ALL"] }
    geoip:
      enabled: false
      existingSecret:
        secretName: authentik-secret
        accountId: GEOIP_ACCOUNT_ID
        licenseKey: GEOIP_LICENSE_KEY
    prometheus:
      rules:
        enabled: true
