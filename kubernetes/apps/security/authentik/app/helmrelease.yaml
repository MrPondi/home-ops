---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  chartRef:
    kind: OCIRepository
    name: authentik
  interval: 1h
  values:
    global:
      deploymentAnnotations:
        secret.reloader.stakater.com/reload: &secret authentik-secret
      envFrom:
        - secretRef:
            name: *secret
      deploymentStrategy:
        type: RollingUpdate

    authentik:
      error_reporting:
        enabled: false

    server:
      volumeMounts:
        - mountPath: /media
          name: authentik

      initContainers:
        - name: init-db
          image: ghcr.io/onedr0p/postgres-init:16
          envFrom:
            - secretRef:
                name: *secret

      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

    postgresql:
      enabled: false

    redis:
      enabled: true
      master:
        persistence:
          enabled: false

    service:
      app:
        ports:
          http:
            port: 9000

    route:
      app:
        hostnames:
          - "auth.${SECRET_DOMAIN}"
        parentRefs:
          - name: internal
            namespace: kube-system
            sectionName: https

    prometheus:
      rules:
        enabled: true
