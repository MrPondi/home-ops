---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: authentik
spec:
  interval: 1h
  timeout: 15m
  chartRef:
    kind: OCIRepository
    name: authentik
  values:
    global:
      podAnnotations:
        secret.reloader.stakater.com/reload: &secret authentik-secrets
      envFrom:
        - secretRef:
            name: *secret
    authentik:
      error_reporting:
        enabled: false

    server:
      metrics:
        enabled: true
        serviceMonitor:
          enabled: true

      service:
        servicePortHttp: 9000
        servicePortHttps: 9443

      route:
        main:
          enabled: true
          hostnames:
            - "auth.${SECRET_DOMAIN}"
          parentRefs:
            - name: internal
              namespace: kube-system
              sectionName: https

    postgresql:
      enabled: true
    redis:
      enabled: true

    prometheus:
      rules:
        enabled: true
