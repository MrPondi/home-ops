---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authentik-secret
    template:
      engineVersion: v2
      data:
        # Secret Key
        AUTHENTIK_SECRET_KEY: "{{ .AUTHENTIK_SECRET_KEY }}"
        # Database
        AUTHENTIK_POSTGRESQL__HOST: &dbhost "postgres-rw.database.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__NAME: &dbname "authentik"
        AUTHENTIK_POSTGRESQL__USER: &dbuser "authentik"
        AUTHENTIK_POSTGRESQL__PASSWORD: &dbpass "{{ .AUTHENTIK_POSTGRES_PASSWORD  }}"

        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
        # Email
        AUTHENTIK_EMAIL__HOST: smtp-relay.default.svc.cluster.local
        AUTHENTIK_EMAIL__PORT: "25"
        AUTHENTIK_EMAIL__USE_TLS: "false"
        AUTHENTIK_EMAIL__USE_SSL: "false"
        AUTHENTIK_EMAIL__TIMEOUT: "10"
        AUTHENTIK_EMAIL__FROM: "Authentik security <no-reply@pondi.dev>"
        # Bootstrap
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .AUTHENTIK_BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_BOOTSTRAP_TOKEN: "{{ .AUTHENTIK_ADMIN_TOKEN }}"
        AUTHENTIK_BOOTSTRAP_EMAIL: "admin@pondi.dev"
        # GeoIP
        GEOIP_ACCOUNT_ID: "{{ .MAXMIND_ACCOUNT_ID }}"
        GEOIP_LICENSE_KEY: "{{ .MAXMIND_LICENSE_KEY }}"
  dataFrom:
    - extract:
        key: authentik
    - extract:
        key: cloudnative-pg
    - extract:
        key: maxmind
