---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    name: authentik-secret
    template:
      data:
        AUTHENTIK_POSTGRESQL__HOST: &dbhost "authentik-db-postgresql.authentik.svc.cluster.local"
        AUTHENTIK_POSTGRESQL__NAME: &dbname "authentik"
        AUTHENTIK_POSTGRESQL__USER: &dbuser "authentik"

        AUTHENTIK_POSTGRESQL__PASSWORD: &dbpass "{{ .POSTGRES_PASSWORD  }}"

        AUTHENTIK_BOOTSTRAP_EMAIL: "{{ .BOOTSTRAP_EMAIL }}"
        AUTHENTIK_BOOTSTRAP_PASSWORD: "{{ .BOOTSTRAP_PASSWORD }}"
        AUTHENTIK_SECRET_KEY: "{{ .SECRET_KEY }}"

        INIT_POSTGRES_HOST: *dbhost
        INIT_POSTGRES_DBNAME: *dbname
        INIT_POSTGRES_USER: *dbuser
        INIT_POSTGRES_PASS: *dbpass
        INIT_POSTGRES_SUPER_PASS: "{{ .POSTGRES_SUPER_PASS }}"
  data:
    - secretKey: POSTGRES_PASSWORD
      remoteRef:
        key: "1d658229-a07a-4613-b481-b36701078584"
    - secretKey: POSTGRES_SUPER_PASS
      remoteRef:
        key: "1d4755c9-83d8-4294-9c4d-b3680142499c"
    - secretKey: BOOTSTRAP_EMAIL
      remoteRef:
        key: "3486c83b-23b7-43f5-8157-b3670103bc1b"
    - secretKey: BOOTSTRAP_PASSWORD
      remoteRef:
        key: "d440dd42-2183-4f06-bb8a-b36701037bf2"
    - secretKey: SECRET_KEY
      remoteRef:
        key: "411b4f3e-2a1e-4877-8f21-b3670105994b"
