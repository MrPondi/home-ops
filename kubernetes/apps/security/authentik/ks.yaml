---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/kustomize.toolkit.fluxcd.io/kustomization_v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  # TEMPORARY net-new bootstrap — remove after first backup lands (just kube pg-initial-backup security authentik); recovery is the default once a backup exists
  labels:
    components.postgres/cnpg: init
    components.postgres/enabled: "true"
  name: authentik
spec:
  components:
    - ../../../../components/kopiur/backup
  dependsOn:
    - name: external-secrets-store
      namespace: external-secrets
  healthCheckExprs: []
  interval: 1h
  path: ./kubernetes/apps/security/authentik/app
  postBuild:
    substitute:
      APP: authentik
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
    namespace: flux-system
  wait: true
