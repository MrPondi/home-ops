---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cleanrr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cleanrr
  egress:
    # Servarr suite mesh (sonarr/radarr/prowlarr)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/part-of: servarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
