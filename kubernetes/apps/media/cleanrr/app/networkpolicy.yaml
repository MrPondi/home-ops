---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: cleanrr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: cleanrr
  ingress:
    # Prometheus scrape (observability)
    - fromEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: observability
            k8s:app.kubernetes.io/name: prometheus
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
  egress:
    # Radarr API polling (media)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: radarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
    # Sonarr API polling (media)
    - toEndpoints:
        - matchLabels:
            k8s:io.kubernetes.pod.namespace: media
            k8s:app.kubernetes.io/name: sonarr
      toPorts:
        - ports:
            - port: "80"
              protocol: TCP
