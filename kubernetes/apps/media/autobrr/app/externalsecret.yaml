---
# yaml-language-server: $schema=https://kubernetes-schemas.pages.dev/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: autobrr-secret
    template:
      data:
        AUTOBRR__SESSION_SECRET: "{{ .AUTOBRR_SESSION_SECRET }}"
        DASHBOARD_URL: "{{ .RAPIDSEEDBOX_DASHBOARD_URL }}"
        DASHBOARD_LOGIN: "{{ .RAPIDSEEDBOX_DASHBOARD_LOGIN }}"
        DASHBOARD_PASSWORD: "{{ .RAPIDSEEDBOX_DASHBOARD_PASSWORD }}"
  dataFrom:
    - extract:
        key: autobrr
