---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: autobrr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: autobrr-secret
    template:
      data:
        AUTOBRR__OIDC_ENABLED: "true"
        AUTOBRR__OIDC_ISSUER: "https://auth.pondi.dev/application/o/autobrr/"
        AUTOBRR__OIDC_CLIENT_ID: "{{ .AUTOBRR_OIDC_CLIENT_ID }}"
        AUTOBRR__OIDC_CLIENT_SECRET: "{{ .AUTOBRR_OIDC_CLIENT_SECRET }}"
        AUTOBRR__OIDC_DISABLE_BUILT_IN_LOGIN: "true"
        AUTOBRR__OIDC_REDIRECT_URL: "https://autobrr.pondi.dev/api/auth/oidc/callback"
        # DASHBOARD_URL: "{{ .RAPIDSEEDBOX_DASHBOARD_URL }}"
        # DASHBOARD_LOGIN: "{{ .RAPIDSEEDBOX_DASHBOARD_LOGIN }}"
        # DASHBOARD_PASSWORD: "{{ .RAPIDSEEDBOX_DASHBOARD_PASSWORD }}"
  dataFrom:
    - extract:
        key: autobrr
