---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./externalsecret.yaml
  - ./helmrelease.yaml
  - ./ocirepository.yaml
  - ./prometheusrule.yaml
configMapGenerator:
  - name: autobrr-configmap
    files:
      - freespace_rapid.sh=./resources/freespace_rapid.sh
generatorOptions:
  disableNameSuffixHash: true

