---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/external-secrets.io/externalsecret_v1.json
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: radarr
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: bitwarden-secretsmanager
  target:
    name: radarr-secret
    template:
      data:
        RADARR__AUTH__APIKEY: "{{ .RADARR_API_KEY }}"
        RADARR__AUTH__OIDCAUTHORITY: "https://auth.pondi.dev/application/o/radarr/"
        RADARR__AUTH__OIDCCLIENTID: "{{ .RADARR_OIDC_CLIENT_ID }}"
        RADARR__AUTH__OIDCCLIENTSECRET: "{{ .RADARR_OIDC_CLIENT_SECRET }}"
        RADARR__AUTH__OIDCSCOPES: openid profile email
        RADARR__AUTH__OIDCUSERIDENTIFIER: "{{ .RADARR_OIDC_USER }}"
  dataFrom:
    - extract:
        key: radarr
