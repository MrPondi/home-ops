---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: brrpolice
spec:
  chartRef:
    kind: OCIRepository
    name: brrpolice
  interval: 1h
  values:
    config:
      qbittorrent:
        base_url: http://qbittorrent.{{ .Release.Namespace }}.svc.cluster.local
    controller:
      type: statefulset
    extraEnv:
      - name: TZ
        value: Europe/Warsaw
    podSecurityContext:
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      fsGroupChangePolicy: OnRootMismatch
    persistence:
      dataSourceRef:
        apiGroup: kopiur.home-operations.com
        kind: Restore
        name: brrpolice
      storageClass: longhorn
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
