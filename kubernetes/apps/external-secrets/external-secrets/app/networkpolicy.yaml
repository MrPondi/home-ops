---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name external-secrets
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  egress:
    # Bitwarden Secrets Manager SDK server
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: bitwarden-sdk-server
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name external-secrets-webhook
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # Admission webhook from kube-apiserver (host-networked)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "10250"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name bitwarden-sdk-server
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
  ingress:
    # external-secrets operator
    - fromEndpoints:
        - matchLabels:
            app.kubernetes.io/name: external-secrets
      toPorts:
        - ports:
            - port: "9998"
              protocol: TCP
  egress:
    # Bitwarden Secrets Manager (vault.bitwarden.com)
    - toFQDNs:
        - matchName: vault.bitwarden.com
        - matchName: vault.bitwarden.com.external-secrets.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
