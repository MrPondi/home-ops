---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/issuer_v1.json
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: external-secrets-selfsign
spec:
  selfSigned: {}
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/certificate_v1.json
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: external-secrets-ca
spec:
  # this is discouraged but required by ios
  commonName: external-secrets-ca
  secretName: external-secrets-ca
  duration: 43800h # 5y
  isCA: true
  issuerRef:
    name: external-secrets-selfsign
    kind: Issuer
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cert-manager.io/issuer_v1.json
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: external-secrets-ca
spec:
  ca:
    secretName: external-secrets-ca
