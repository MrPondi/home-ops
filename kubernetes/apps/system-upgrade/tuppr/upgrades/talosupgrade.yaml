---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/tuppr.home-operations.com/talosupgrade_v1alpha1.json
apiVersion: tuppr.home-operations.com/v1alpha1
kind: TalosUpgrade
metadata:
  name: talos
spec:
  talos:
    # renovate: datasource=custom.talos-factory depName=siderolabs/talos
    version: v1.14.6
  policy:
    # Single node: a drain cannot reschedule anything, it only cordons the node and
    # evicts every pod into Pending; CNPG's 1800s stop grace then outlasts the drain
    # timeout and the upgrade aborts without rebooting, leaving the node cordoned
    nodrain: true
    rebootMode: powercycle
  healthChecks:
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Snapshot
      expr: |-
        status.phase != 'Running'
    - apiVersion: kopiur.home-operations.com/v1alpha1
      kind: Restore
      expr: |-
        !(status.phase in ['Resolving', 'Restoring'])
    - apiVersion: longhorn.io/v1beta2
      kind: Node
      expr: |-
        status.conditions.filter(c, c.type == "Ready").all(c, c.status == "True") &&
        status.conditions.filter(c, c.type == "Schedulable").all(c, c.status == "True")
    - apiVersion: postgresql.cnpg.io/v1
      kind: Cluster
      expr: |-
        has(status.readyInstances) && status.readyInstances == object.spec.instances &&
        has(status.conditions) && status.conditions.exists(e, e.type == 'Ready' && e.status == 'True')
    - apiVersion: miroir.home-operations.com/v1alpha1
      kind: MiroirVolume
      expr: |-
        status.phase == 'Ready'
