---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: &name tuppr
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: *name
      app.kubernetes.io/instance: *name
  ingress:
    # Admission webhook from kube-apiserver (host-networked)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "9443"
              protocol: TCP
    # Kubelet liveness/readiness probes on the metrics port (host-networked kubelet; prometheus scrape comes via the namespace baseline)
    - fromEntities:
        - host
      toPorts:
        - ports:
            - port: "8081"
              protocol: TCP
  egress:
    # Talos API on node management network (:50000) — node version checks,
    # installer image pre-pull and machine config install image sync
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
    # Talos image factory (installer image availability + schematic lookup);
    # the expanded name matches the pod's ndots search-path resolution
    # (convention: cf. grafana-operator, qui); resolution rides the
    # default-deny proxied DNS for this namespace
    - toFQDNs:
        - matchName: factory.talos.dev
        - matchName: factory.talos.dev.system-upgrade.svc.cluster.local
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/cilium.io/ciliumnetworkpolicy_v2.json
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: tuppr-pods
spec:
  # Selects tuppr's ephemeral upgrade Job pods (talosctl driving the node
  # upgrade). They carry app.kubernetes.io/part-of: tuppr and
  # app.kubernetes.io/instance: <TalosUpgrade name>, so they never match the
  # controller selector above.
  endpointSelector:
    matchLabels:
      app.kubernetes.io/part-of: tuppr
  egress:
    # Talos API on node management network (:50000) — talosctl upgrade
    - toEntities:
        - host
        - remote-node
      toPorts:
        - ports:
            - port: "50000"
              protocol: TCP
