      tag: v1.0.1@sha256:f173c8e78bc819e2b8adc15192afefaf69a11307d49fca5382bda82885975830
    kubeletPlugin:
      containers:
        init:
          image: docker.io/library/busybox:1.37@sha256:9db7b59979c38555a39def84a31fb98b5296952f9e3afd4f6f11f05b07adfab0
    cdi:
      dynamicPath: /run/cdi
