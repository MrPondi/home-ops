---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/monitoring.coreos.com/prometheusrule_v1.json
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cilium-rules
spec:
  groups:
    - name: cilium.rules
      rules:
        - alert: CiliumPolicyEgressDrops
          # ICMP denied-drops excluded: Cilium denies ICMP by default (VIP-spoof protection);
          # per-flow ICMP detail lives in VictoriaLogs (log_source="cilium-hubble").
          expr: |-
            sum by (source_namespace) (increase(hubble_drop_total{reason="POLICY_DENIED", source_namespace!="", protocol!~"ICMPv4|ICMPv6"}[10m])) > 0
          for: 5m
          annotations:
            summary: >-
              Cilium is dropping egress flows from {{ $labels.source_namespace }} due to network policy
          labels:
            severity: critical

        - alert: CiliumPolicyIngressDrops
          # ICMP denied-drops excluded: Cilium denies ICMP by default (VIP-spoof protection);
          # per-flow ICMP detail lives in VictoriaLogs (log_source="cilium-hubble").
          expr: |-
            sum by (destination_namespace) (increase(hubble_drop_total{reason="POLICY_DENIED", destination_namespace!="", source_namespace="", protocol!~"ICMPv4|ICMPv6"}[10m])) > 0
          for: 5m
          annotations:
            summary: >-
              Cilium is dropping ingress flows to {{ $labels.destination_namespace }} due to network policy
          labels:
            severity: critical
