---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cilium
spec:
  chartRef:
    kind: OCIRepository
    name: cilium
  interval: 1h
  values:
    autoDirectNodeRoutes: true
    # bandwidthManager:
    #   enabled: true
    #   bbr: true
    bpf:
      # datapathMode: netkit
      masquerade: true
      hostLegacyRouting: true
      # preallocateMaps: true
      # tproxy: true
    # bpfClockProbe: true
    # bgpControlPlane:
    #   enabled: true
    cgroup:
      automount:
        enabled: false
      hostRoot: /sys/fs/cgroup
    # NOTE: devices might need to be set if you have more than one active NIC on your hosts
    # devices: eno+ eth+
    cni:
      # Required for pairing with Multus CNI
      exclusive: false
    dashboards:
      enabled: true
    endpointRoutes:
      enabled: true
    envoy:
      enabled: false
    hubble:
      enabled: true
      dashboards:
        enabled: true
      # Per-flow export of dropped flows to /var/run/cilium/hubble/ (hostPath),
      # collected by victoria-logs-collector on the node. JSON lines, hot-reloadable.
      export:
        dynamic:
          enabled: true
          config:
            createConfigMap: true
            content:
              - name: policy-drops
                filePath: /var/run/cilium/hubble/policy-drops.log
                fileMaxSizeMb: 10
                fileMaxBackups: 3
                includeFilters:
                  - verdict:
                      - DROPPED
      metrics:
        enabled:
          - dns
          - drop:labelsContext=source_namespace,destination_namespace
          - tcp
          - icmp
          - http
          - flow:labelsContext=source_namespace,destination_namespace
        serviceMonitor:
          enabled: true
          trustCRDsExist: true
      relay:
        enabled: true
        rollOutPods: true
      ui:
        enabled: true
    ipam:
      mode: kubernetes
    ipv4NativeRoutingCIDR: 10.42.0.0/16
    k8sServiceHost: 127.0.0.1
    k8sServicePort: 7445
    kubeProxyReplacement: true
    kubeProxyReplacementHealthzBindAddr: 0.0.0.0:10256
    l2announcements:
      enabled: true
    loadBalancer:
      algorithm: maglev
      mode: dsr
      serviceTopology: true
    localRedirectPolicies:
      enabled: true
    operator:
      dashboards:
        enabled: true
      prometheus:
        enabled: true
        serviceMonitor:
          enabled: true
      replicas: 1
      rollOutPods: true
    prometheus:
      enabled: true
      serviceMonitor:
        enabled: true
        trustCRDsExist: true
    rollOutCiliumPods: true
    routingMode: native
    securityContext:
      capabilities:
        ciliumAgent:
          - CHOWN
          - KILL
          - NET_ADMIN
          - NET_RAW
          - IPC_LOCK
          - SYS_ADMIN
          - SYS_RESOURCE
          - PERFMON
          - BPF
          - DAC_OVERRIDE
          - FOWNER
          - SETGID
          - SETUID
        cleanCiliumState:
          - NET_ADMIN
          - SYS_ADMIN
          - SYS_RESOURCE
    socketLB:
      hostNamespaceOnly: true
      enabled: true
