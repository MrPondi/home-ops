---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/gateway.networking.k8s.io/httproute_v1.json
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: hubble-ui
  annotations:
    gethomepage.dev/enabled: "true"
    gethomepage.dev/name: Hubble
    gethomepage.dev/group: Monitoring & Operations
    gethomepage.dev/icon: cilium.svg
    gethomepage.dev/description: Cilium network observability
    gethomepage.dev/weight: "18"
spec:
  parentRefs:
    - name: envoy-internal
      namespace: network
  hostnames:
    - hubble.pondi.dev
  rules:
    - backendRefs:
        - name: hubble-ui
          port: 80
