---
# yaml-language-server: $schema=https://k8s-schemas.home-operations.com/helm.toolkit.fluxcd.io/helmrelease_v2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: drm-exporter-amd
spec:
  chartRef:
    kind: OCIRepository
    name: drm-exporter-amd
  interval: 1h
  values:
    config:
      # Node has two GPUs (Intel 0000:01:00.0 + AMD 0000:03:00.0); qmlib
      # enumerates every DRM card and the exporter exits ENOENT on the Intel
      # device node, which is not injected by the AMD-only DRA claim. Scope to
      # the AMD slot so only its device nodes are opened.
      devices: ["0000:03:00.0"]
    dra:
      enabled: true
      deviceClassName: gpu.amd.com
    monitoring:
      serviceMonitor:
        enabled: true
      dashboards:
        enabled: true
        grafanaOperator:
          enabled: true
          matchLabels:
            dashboards: grafana
    resources:
      requests:
        cpu: 10m
      limits:
        memory: 128Mi
