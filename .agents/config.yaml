---
# Canonical, tool-agnostic agent configuration for this repo.
# Edit this file (and .agents/agents/*.md, .agents/skills/*), and commit (lefthook regenerates the adapters).
# Per-tool adapters (.mcp.json, .claude/, .opencode/) are GENERATED by scripts/sync_agents.py —
# never edit them by hand; the pre-commit hook regenerates and stages them.

# Agent used for a plain session (opencode `default_agent`, Claude Code `agent` setting).
defaultAgent: homelab-k8s

# MCP servers. Remote servers: `url` (+ optional `headers`, `oauth`); local: `command` + `args`.
# Header values use ${VAR} for environment variables (mise loads .secrets.env).
mcpServers:
  ToolHive:
    url: https://mcp.pondi.dev/mcp
    oauth: true
  context7:
    url: https://mcp.context7.com/mcp
    headers:
      CONTEXT7_API_KEY: ${CONTEXT7_API_KEY}
  dashboard-icons:
    url: https://dashboardicons.com/api/mcp
  terraform:
    enabled: false
    command: docker
    args: [run, -i, --rm, hashicorp/terraform-mcp-server:1.3.0]

# MCP tools hidden from every agent: server -> tool-name globs.
# ToolHive's context7 duplicates the direct context7 server.
mcpToolDeny:
  ToolHive: [context7_*]

# Files agents must never read with file tools (gitignore-style patterns).
protectedPaths:
  - kubeconfig
  - talosconfig
  - age.key
  - .secrets.env
  - .decrypted~*
