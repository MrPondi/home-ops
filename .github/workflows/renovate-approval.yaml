---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate Approval

# Rulesets match only the branch a pull request merges into, never the branch
# it comes from, so this workflow carries the "Renovate needs an approval"
# rule as the required commit status `Renovate Approval`:
#   - success at once for anyone else's pull request
#   - pending on a Renovate pull request until kritika's review of its head ends
#   - success once the owner approved it, or kritika approved it and its review
#     of the current head passed (kritika approves up to medium risk)
#   - failure when kritika's review ended without an approval, or errored; the
#     owner is then requested as a reviewer, as Renovate does for a PR that
#     cannot automerge

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  pull_request_review:
    types: [submitted, dismissed]
  status:

permissions: {}

env:
  CONTEXT: Renovate Approval
  KRITIKA_BOT: branch-hopper[bot]
  KRITIKA_CONTEXT: Kritika / Review
  RENOVATE_BOT: renovate[bot]

jobs:
  evaluate:
    name: Renovate Approval - Evaluate
    # Every commit status (Konflate, CI, ...) starts a run: act on kritika's only
    if: github.event_name != 'status' || github.event.context == 'Kritika / Review'
    runs-on: ubuntu-26.04
    # One evaluation per commit at a time; each reads the current state, so the last one wins
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.head.sha || github.event.sha }}
      cancel-in-progress: false
    permissions:
      pull-requests: write
      statuses: write
    steps:
      - name: Set the Renovate Approval status
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          OWNER: ${{ github.repository_owner }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha || github.event.sha }}
        run: |
          set_status() { # state description
            gh api -X POST "repos/$REPO/statuses/$SHA" -f state="$1" -f context="$CONTEXT" \
              -f description="$(printf '%s' "$2" | cut -c1-140)" > /dev/null
            echo "$SHA: $1 - $2"
          }

          if [ -n "$EVENT_PR" ]; then
            prs=$EVENT_PR
          else
            prs=$(gh api "repos/$REPO/commits/$SHA/pulls" \
              --jq '.[] | select(.state == "open" and .head.sha == env.SHA) | .number')
          fi

          for pr in $prs; do
            author=$(gh api "repos/$REPO/pulls/$pr" --jq '.user.login')
            if [ "$author" != "$RENOVATE_BOT" ]; then
              set_status success "Opened by $author: no approval needed"
              continue
            fi

            # Each reviewer's latest decision (APPROVED, CHANGES_REQUESTED or DISMISSED)
            approvers=$(gh api --paginate "repos/$REPO/pulls/$pr/reviews" \
              --jq '.[] | select(.state != "COMMENTED" and .state != "PENDING") | [.user.login, .state] | @tsv' \
              | awk -F'\t' '{ last[$1] = $2 } END { for (u in last) if (last[u] == "APPROVED") print u }')
            kritika=$(gh api "repos/$REPO/commits/$SHA/status" \
              --jq '[.statuses[] | select(.context == env.KRITIKA_CONTEXT)][0] | "\(.state)\t\(.description)"')
            kstate=${kritika%%$'\t'*}
            kdesc=${kritika#*$'\t'}

            if printf '%s\n' "$approvers" | grep -qxF -- "$OWNER"; then
              set_status success "Approved by $OWNER"
            elif printf '%s\n' "$approvers" | grep -qxF -- "$KRITIKA_BOT" && [ "$kstate" = "success" ]; then
              set_status success "Approved by kritika"
            elif [ "$kstate" = "success" ]; then
              reason=$(gh api --paginate "repos/$REPO/issues/$pr/comments" \
                --jq '.[] | select(.user.login == env.KRITIKA_BOT and (.body | contains("<!-- kritika:pr-"))) | .body' \
                | grep -m1 -F -- '**Not approved**' | sed 's/\*\*Not approved\*\*: *//' || true)
              set_status failure "kritika did not approve: ${reason:-see its summary}"
              requested=true
            elif [ "$kstate" = "failure" ] || [ "$kstate" = "error" ]; then
              set_status failure "kritika's review did not pass: $kdesc"
              requested=true
            else
              set_status pending "Waiting for kritika's review"
              continue
            fi

            if [ "${requested:-}" = true ]; then
              gh api -X POST "repos/$REPO/pulls/$pr/requested_reviewers" -f "reviewers[]=$OWNER" > /dev/null \
                && echo "#$pr: requested a review from $OWNER"
              requested=
            fi
          done
